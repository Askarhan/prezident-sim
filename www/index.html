<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A1120">
<title>Кабинет президента</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: situation room — map-first command screen, translucent instrument panels, amber controls, teal growth readouts.
   Deliberately single (dark) theme: the look of a command centre. */
:root{
  --paper:#0A1120;        /* deep night navy background */
  --panel:#0F1B30;        /* instrument panel */
  --panel-2:#13233D;      /* raised element on a panel */
  --ink:#DCE6F5; --muted:#7F93B2; --line:#203556;
  --accent:#F2A93B;       /* amber command colour */
  --on-accent:#1A1104;
  --state:#5AA9FF;        /* informational blue */
  --state-soft:#132743;
  --good:#39D0C3;         /* teal: growth, allies */
  --warn:#F7C948; --bad:#FF5D5D;
  --glow:0 0 0 1px rgb(90 169 255 / .08), 0 8px 24px rgb(0 0 0 / .35);
  --f-display:"Exo 2","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"Consolas",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);background-image:linear-gradient(rgb(90 169 255 / .035) 1px,transparent 1px),linear-gradient(90deg,rgb(90 169 255 / .035) 1px,transparent 1px),radial-gradient(1200px 600px at 70% -10%,rgb(90 169 255 / .10),transparent 60%);background-size:32px 32px,32px 32px,auto;background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--state);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.panel>h3,.panel>.row>h3,.branch h3{font-size:12px!important;text-transform:uppercase;letter-spacing:.14em;color:var(--state);font-weight:700}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.sm{width:14px;height:14px;vertical-align:-2px}
.ic.lg{width:22px;height:22px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* start screen */
.start-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.start-head h1{font-size:clamp(30px,6vw,52px);text-transform:uppercase;letter-spacing:.04em;background:linear-gradient(90deg,var(--ink),var(--state));-webkit-background-clip:text;background-clip:text;color:transparent}
.start-head p{margin:0;max-width:62ch;color:var(--muted)}
.seal{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-data);font-size:12px;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:3px 10px;width:max-content}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.country-card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.country-card:hover{border-color:var(--state)}
.cc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cc-name{font-weight:600;font-size:16px}
.code{font-family:var(--f-data);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.cc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12px}
.diff{font-size:12px;font-weight:600}
.continue{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--state-soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px}

/* game header */
.brief{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
.brief h2{font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.brief .date{font-family:var(--f-data);font-size:13px;color:var(--muted)}
.brief .spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.kpi{background:var(--panel);padding:10px 12px;min-width:0}
.kpi .label{display:flex;align-items:center;gap:6px}
.kpi .label .ic{color:var(--state)}
.kpi .v{font-family:var(--f-data);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .d{font-family:var(--f-data);font-size:11px}
.up{color:var(--good)} .down{color:var(--bad)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{padding:8px}.kpi .v{font-size:14px;white-space:normal;overflow-wrap:anywhere}.kpi .label{font-size:9.5px;letter-spacing:.04em}}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);letter-spacing:.02em}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,rgb(19 35 61 / .92),rgb(15 27 48 / .92));border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--glow);backdrop-filter:blur(6px)}
.panel h3{font-size:15px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.row+.row{border-top:1px dashed var(--line);padding-top:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--state);color:var(--state)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){color:var(--on-accent);filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.slider input{grid-column:1/-1;width:100%;accent-color:var(--state)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;font-size:12px;font-family:var(--f-data)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.bar{height:8px;background:#172846;border-radius:99px;overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--good);box-shadow:0 0 8px rgb(57 208 195 / .5)}
.bar.mid>i{background:var(--warn)} .bar.low>i{background:var(--bad)} .bar.high>i{background:var(--good)}
.rel{height:8px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good));border-radius:99px;position:relative}
.rel>b{position:absolute;top:-3px;width:3px;height:14px;background:var(--ink);border-radius:2px}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.state{color:var(--state)}
.law{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center}
.law+.law{border-top:1px dashed var(--line);padding-top:10px}
.law small{color:var(--muted);grid-column:1}
.switch{width:44px;height:24px;border-radius:99px;border:1px solid var(--line);background:var(--line);position:relative;grid-row:1/3;grid-column:2}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--panel);transition:left .15s}
.switch[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.switch[aria-checked="true"]::after{left:22px}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:260px;overflow:auto}
.news li{display:grid;grid-template-columns:auto 1fr;gap:8px}
.news .when{font-family:var(--f-data);font-size:11px;color:var(--muted);padding-top:2px}
.dip-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0}
.dip-row+.dip-row{border-top:1px dashed var(--line)}
.dip-name{display:flex;flex-direction:column;min-width:0}
.dip-name b{font-weight:600}
.dip-tags{display:flex;flex-wrap:wrap;gap:4px}
.dip-actions{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
@media (max-width:560px){.dip-row{grid-template-columns:1fr}}
.sector{display:flex;flex-direction:column;gap:6px}
.sector+.sector{border-top:1px dashed var(--line);padding-top:10px}
.capbar{position:relative}
.capbar .tgt{position:absolute;top:-3px;width:3px;height:14px;background:var(--ink);border-radius:2px}
.cap-meta{font-size:12px}
.tech-tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
@media (max-width:900px){.tech-tree{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tech-tree{grid-template-columns:1fr}}
.branch{display:flex;flex-direction:column;gap:8px;min-width:0}
.branch h3{font-size:14px}
.tech{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tech small{color:var(--muted)}
.tech .pill{align-self:flex-start}
.tech.locked{opacity:.55}
.tech.done{border-color:var(--good)}
.tech.active{border-color:var(--state);box-shadow:0 0 0 1px var(--state) inset}
.tech .row+.row{border-top:0;padding-top:0}
.select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%}
.parl{display:flex;height:18px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.parl span{display:block;height:100%}
.p0{background:var(--accent)} .p1{background:var(--state)} .p2{background:var(--warn)} .p3{background:var(--muted)}
.parl-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.parl-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ideo-grid,.scen-grid,.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ideo,.scen{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ideo small,.scen small,.ach small{color:var(--muted);font-size:12px}
.ideo.on{border-color:var(--good)} .ideo:disabled{cursor:default} .ideo:not(.on):disabled{opacity:.5}
.ideo .pill{align-self:flex-start}
.scen[aria-pressed="true"]{border-color:var(--state);box-shadow:0 0 0 1px var(--state) inset}
.ach{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;opacity:.5}
.ach.on{opacity:1;border-style:solid;border-color:var(--good)}
.resolution{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.resolution .seg{align-self:flex-start}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.qitem{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.build-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.bcard,.unit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-width:0}
.bcard.blocked{opacity:.75}
.bstats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.bstats b{color:var(--ink);font-weight:600}
.bstats b.up{color:var(--good)} .bstats b.down{color:var(--bad)}
.unit+.unit{margin-top:2px}
.map-panel{padding:10px}
.map-wrap{position:relative;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0F2442,#081224 70%);border:1px solid var(--line)}
#worldmap{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
#worldmap:active{cursor:grabbing}
#worldmap path{vector-effect:non-scaling-stroke;stroke-width:.6;transition:fill .2s}
#worldmap path:hover{filter:brightness(1.35)}
.m-off{fill:#14223A;stroke:#1C2F50}
.m-neutral{fill:#22385C;stroke:#35548A}
.m-friend{fill:#1C4B57;stroke:#39D0C3}
.m-ally{fill:#1F7C78;stroke:#5EF0E2}
.m-trade{fill:#1F4A7C;stroke:#5AA9FF}
.m-hostile{fill:#5A2633;stroke:#FF5D5D}
.m-war{fill:#A3293A;stroke:#FF8A8A;animation:warpulse 1.6s ease-in-out infinite}
.m-own{fill:#8C5B19;stroke:#F2A93B}
.m-player{fill:#F2A93B;stroke:#FFE0A8;filter:drop-shadow(0 0 4px rgb(242 169 59 / .8))}
#worldmap path.m-sel{stroke:#FFFFFF;stroke-width:2}
@keyframes warpulse{50%{fill:#D23A4E}}
.map-empty{padding:80px 16px;text-align:center;color:var(--muted)}
.map-tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.map-tools button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:rgb(15 27 48 / .9);display:grid;place-items:center;color:var(--ink)}
.map-tools button:hover{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:8px 4px 2px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid}
.sw.m-off{background:#14223A;border-color:#1C2F50}.sw.m-neutral{background:#22385C;border-color:#35548A}.sw.m-friend{background:#1C4B57;border-color:#39D0C3}.sw.m-ally{background:#1F7C78;border-color:#5EF0E2}.sw.m-trade{background:#1F4A7C;border-color:#5AA9FF}.sw.m-hostile{background:#5A2633;border-color:#FF5D5D}.sw.m-war{background:#A3293A;border-color:#FF8A8A}.sw.m-own{background:#8C5B19;border-color:#F2A93B}.sw.m-player{background:#F2A93B;border-color:#FFE0A8}
.bname{display:inline-flex;align-items:center;gap:8px}
.bname .ic{color:var(--accent)}
.country-card,.bcard,.unit,.qitem,.tech,.ideo,.scen,.choice,.resolution,.ach{background:var(--panel-2)!important}
.country-card:hover,.bcard:hover,.unit:hover{border-color:var(--state)}
@media (prefers-reduced-motion:reduce){.m-war{animation:none}}
.m-minor{fill:#182A47;stroke:#2A4570}
.sw.m-minor{background:#182A47;border-color:#2A4570}
#map-labels{pointer-events:none;font-family:var(--f-body);font-weight:600;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#081224;stroke-linejoin:round;fill:#8FA4C4;letter-spacing:.02em}
#map-labels .lb-game{fill:#DCE6F5}
#map-labels .lb-me{fill:#FFE0A8}
#map-labels .lb-sel{fill:#FFFFFF}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.tblock{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.trow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.trow+.trow{border-top:1px dashed var(--line);padding-top:8px}
.tname{display:flex;flex-direction:column;gap:1px;min-width:0}
.tname>span{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.tname .ic{color:var(--accent)}
.tname small{font-size:12px}
.trow.locked{opacity:.55}
.mrow{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(60px,.8fr);gap:10px;align-items:center}
.mrow+.mrow{border-top:1px dashed var(--line);padding-top:8px}
.mrow .spark{height:28px}
.stock{display:flex;flex-direction:column;gap:6px}
.stock+.stock{border-top:1px dashed var(--line);padding-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.mat{display:inline-flex;align-items:center;gap:4px}
.mat .ic{color:var(--muted)}
.spark{width:100%;height:56px;display:block}
.spark polyline{fill:none;stroke-width:2}
.goal{display:flex;justify-content:space-between;gap:10px;font-size:13px}
table.budget{width:100%;border-collapse:collapse;font-size:13px}
table.budget td{padding:4px 0}
table.budget td:last-child{text-align:right;font-family:var(--f-data)}
table.budget tr.total td{border-top:1px solid var(--line);font-weight:600;padding-top:6px}

/* bottom bar */
.endbar{position:fixed;left:0;right:0;bottom:0;background:rgb(10 17 32 / .94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.endbar .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:12px}
.endbar .info{flex:1;font-size:13px;color:var(--muted);min-width:0}
.clock{display:flex;flex-direction:column;gap:5px;min-width:150px}
.clock-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.clock-top b{font-size:15px}
.clock-hint{font-size:12px;color:var(--accent);font-weight:600}
.clock-track{height:5px}
.speeds{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0}
.speeds button{border:0;background:var(--panel);width:46px;height:42px;display:grid;place-items:center}
.speeds button+button{border-left:1px solid var(--line)}
.speeds svg{height:15px;fill:currentColor}
.speeds button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.speeds button{position:relative}
.speeds button.locked{color:var(--muted)}
.speeds .lock{position:absolute;right:4px;top:4px;height:10px;fill:var(--warn)}
.speeds .timer{position:absolute;right:3px;top:2px;font-size:9px;font-weight:600}
@media (max-width:640px){.endbar .info{display:none}.speeds button{width:40px}}
.old-next{font-family:var(--f-display);font-size:16px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 20px;white-space:nowrap}
.next:hover{filter:brightness(1.08)}

/* modal */
.modal{position:fixed;inset:0;background:rgb(10 16 22 / .55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:linear-gradient(180deg,#13233D,#0F1B30);box-shadow:0 20px 60px rgb(0 0 0 / .5);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;max-height:90%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:20px}
.stamp{font-family:var(--f-data);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px}
.choice:hover{border-color:var(--state)}
.choice b{display:block}
.choice small{color:var(--muted)}
.deltas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px}
.ad{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 8px}
.ad .count{font-family:var(--f-data);font-size:40px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30;max-width:90%}

function money(b){
  const a = Math.abs(b), sign = b < 0 ? "−" : "";
  if (a >= 1000) return sign + (a/1000).toFixed(2).replace(".",",") + " трлн $";
  if (a >= 1) return sign + a.toFixed(a >= 100 ? 0 : 1).replace(".",",") + " млрд $";
  if (a >= 0.01) return sign + Math.round(a*1000) + " млн $";
  if (a >= 0.001) return sign + (a*1000).toFixed(1).replace(".",",") + " млн $";
  if (a < 0.0000005) return "0 $";
  return sign + Math.round(a*1e6) + " тыс. $";
}

function me(){ return S.countries ? S.countries[S.player] : null; }

function load(){
  const raw = storageGet(); if (!raw) return false;
  try { const s = JSON.parse(raw); if (!s || !s.countries || s.over) return false; if (!s.capital) s.capital = {health:33,edu:33,infra:33,police:33}; if (!s.research) s.research = {current:null, done:{}, prog:{}}; if (s.science===undefined) s.science = 1; migrate(s); S = s; return true; } catch(e){ return false; }
}
function migrate(s){
  if (!s.intel) s.intel = {level:1, pts:3, ok:0};
  if (!s.council) s.council = {res:null, next:4, banned:{}, propCd:0};
  if (!s.ideology){ s.ideology = "dem"; s.ideoCd = 0; }
  if (!s.scenario) s.scenario = "normal";
  if (!s.flags) s.flags = {everWar:false, coup:false, resPassed:false};
  if (s.aggr===undefined) s.aggr = 1;
  if (!s.day) s.day = 1;
  Object.keys(BUILDINGS).forEach(k => { if (s.buildings[k]===undefined) s.buildings[k] = 0; });
  (s.queue||[]).forEach(q => { if (q.total===undefined){ q.left = q.left*30; q.total = BUILDINGS[q.type].days; } });
  if (!s.units){ const a = s.countries[s.player].army; s.units = {tank:Math.round(a*2), heli:Math.round(a*0.3), fighter:Math.round(a*0.25), sam:Math.round(a*0.05)}; }
  if (!s.rails) s.rails = {};
  if (!s.armsExport) s.armsExport = {};
  if (!s.buildCat) s.buildCat = "ind";
  if (!s.stock) s.stock = {wood:150, steel:120, oil:0, gold:0};
  if (!s.market) s.market = {wood:1, steel:1, oil:1, gold:1};
  if (!s.mhist) s.mhist = {wood:[1], steel:[1], oil:[1], gold:[1]};
  if (!s.contracts) s.contracts = {};
  if (!s.autoSell) s.autoSell = {wood:false, steel:false, oil:true, gold:true};
  if (!s.partners) s.partners = {};
  if (s.lastCommod===undefined) s.lastCommod = 0;
}

function gdppc(){ return me().gdp / me().pop; }
function taxBurden(){ const t=S.taxes; return t.inc*0.35 + t.corp*0.25 + t.vat*0.4; }
function modSum(stat){ return S.mods.filter(m=>m.stat===stat).reduce((a,m)=>a+m.v,0); }
function lawOn(id){ return !!S.laws[id]; }
function ideo(id){ return S.ideology===id; }
function intelCost(){ return me().gdp/12 * 0.003 * S.intel.level; }
function parliament(){
  const mine = clamp(S.approval*0.8 + 12 + (ideo("auth")?25:0), 5, 95);
  const rest = 100 - mine;
  return [[IDEOLOGIES.find(i=>i.id===S.ideology).party, mine, true], ...OTHER_PARTIES.map(([n,share])=>[n, rest*share, false])];
}
function majority(){ return parliament()[0][1] >= 50; }

function achSet(o){ try { localStorage.setItem(ACH_KEY, JSON.stringify(o)); } catch(e){} }
let achCache = null;
function unlock(id){
  achCache = achCache || achGet();
  if (achCache[id]) return;
  achCache[id] = new Date().toISOString().slice(0,10); achSet(achCache);
  const a = ACHIEVEMENTS.find(x=>x.id===id);
  if (S && S.log) addLog(`Достижение получено: «${a.name}».`);
  setTimeout(()=>toast(`Достижение: «${a.name}»`), 300);
}
function checkAchievements(){
  if (!S || !S.countries) return;
  const c = me();
  if (Object.values(S.laws).some(Boolean)) unlock("first_law");
  const nt = Object.keys(S.research.done).length;
  if (nt>=8) unlock("tech8"); if (nt>=TECH.length) unlock("tech16");
  if (S.capital.edu>=95) unlock("edu");
  if (S.treasury > c.gdp*0.2) unlock("rich");
  if (S.approval>=80) unlock("beloved");
  if (S.stability>=90) unlock("iron");
  const ctrl = controlled().length;
  if (ctrl>=2) unlock("conqueror"); if (ctrl>=5) unlock("empire");
  if (Object.values(C()).filter(x=>x.ally && !x.owner).length>=3) unlock("diplomat");
  if (S.intel.ok>=5) unlock("spymaster");
  if (S.flags.coup) unlock("coup");
  if (S.flags.resPassed) unlock("council");
  if (S.turn>=120 && !S.flags.everWar) unlock("peace");
  if (S.terms>=2) unlock("veteran");
}
function tech(id){ return S.research && S.research.done[id] ? 1 : 0; }
function rpMonthly(){ return (1 + S.capital.edu/15 + S.science*2) * (ideo("tech")?1.3:1); }
function scienceCost(){ return me().gdp/12 * 0.005 * S.science; }
function techAvailable(tc){ return !tech(tc.id) && (tc.tier===1 || TECH.some(x=>x.br===tc.br && x.tier===tc.tier-1 && tech(x.id))); }
function lawSum(key){ return LAWS.filter(l=>lawOn(l.id) && l[key]).reduce((a,l)=>a+l[key],0); }
function selfSuff(r){
  const c = me(); let v = c.prof[r]*100 + S.annexBonus[r];
  const b = RES.find(x=>x.id===r).build; v += S.buildings[b]*15;
  Object.entries(BUILDINGS).forEach(([id,bd]) => { if (bd.use && bd.use[r]) v -= bd.use[r]*S.buildings[id]; });
  if (r==="power"){ if (lawOn("green")) v += 15; v += 10*tech("smartgrid") + 40*tech("fusion"); }
  if (r==="food") v += 20*tech("agro");
  if (r==="oil" || r==="metal") v += 20*tech("deep");
  v += modSum(r);
  return Math.max(0, v);
}
function deficits(){ return RES.filter(r => selfSuff(r.id) < 60).length; }
function objIncome(id){ const b = BUILDINGS[id]; if (!b.roi) return 0; let v = me().gdp*b.cost*b.roi; if ((id==="factory"||id==="auto") && tech("automation")) v *= 1.5; return v; }
function objUpkeep(id){ return me().gdp*BUILDINGS[id].cost*0.004; }
function objCount(id){ return S.buildings[id]||0; }
function queued(id){ return S.queue.filter(q=>q.type===id).length; }
function maxSlots(){ return 2 + Math.floor(S.capital.infra/34); }
function buildN(type){ return objCount(type) + queued(type); }
function buildCost(type){ const b = BUILDINGS[type]; return Math.max(0.03, me().gdp * b.cost) * (1 + (b.scale||0)*buildN(type)); }
function buildDays(type){ const b = BUILDINGS[type]; return Math.round(Math.min(b.days*2.5, b.days + (b.dscale||0)*buildN(type))); }
function matShort(mat){ let cost = 0; const miss = {}; for (const r in mat){ const lack = Math.max(0, mat[r] - S.stock[r]); if (lack > 0){ miss[r] = lack; cost += lack*importPrice(r); } } return {miss, cost}; }
function takeMat(mat){ for (const r in mat) S.stock[r] = Math.max(0, S.stock[r] - mat[r]); }
function buildTotal(type){ return buildCost(type) + matShort(BUILDINGS[type].mat||{}).cost; }

/* ---------- Commodities & trade ---------- */
function woodProf(id){ return WOOD_PROF[id] ?? 0.8; }
function goldProf(id){ return GOLD_PROF[id] ?? 0.2; }
function commodOpen(r){ const t = COMMOD[r].tech; return !t || !!tech(t); }
function outMult(r){
  if (r==="wood") return Math.max(0.5, woodProf(S.player));
  if (r==="steel") return selfSuff("metal") < 60 ? 0.5 : 1;
  if (r==="oil") return Math.max(0.2, me().prof.oil);
  if (r==="gold") return Math.max(0.2, goldProf(S.player));
  return 1;
}
function baseOut(r){
  if (!commodOpen(r)) return 0;
  const c = me();
  if (r==="wood") return 10*woodProf(S.player);
  if (r==="steel") return 8*c.prof.metal*(selfSuff("metal") < 60 ? 0.5 : 1);
  if (r==="oil") return 4*c.prof.oil;
  return 0.8*goldProf(S.player);
}
// each next producer yields a bit less (deposits deplete): k-th object gives out * decay^k
function objOut(id){ const b = BUILDINGS[id]; if (!b.out) return 0; const r = Object.keys(b.out)[0]; return b.out[r]*outMult(r)*Math.pow(b.decay||1, buildN(id)); }
function objOutTotal(id){ const b = BUILDINGS[id]; if (!b.out) return 0; const r = Object.keys(b.out)[0], n = objCount(id), d = b.decay||1; return b.out[r]*outMult(r)*(d < 1 ? (1 - Math.pow(d, n))/(1 - d) : n); }
function prodOf(r){ let v = baseOut(r); Object.entries(BUILDINGS).forEach(([id,b]) => { if (b.out && b.out[r]) v += objOutTotal(id); }); return v; }
function priceMult(r){ return 1 + 0.15*tech("exchange") + (r==="oil" ? 0.35*tech("refining") : 0); }
function commodPrice(r){ return me().gdp*COMMOD[r].price*S.market[r]*priceMult(r); }
function importPrice(r){ return me().gdp*COMMOD[r].price*S.market[r]*1.6*(Object.values(C()).some(x=>x.sanctionsUs) ? 1.3 : 1); }
function hashIso(s){ let h = 7; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; }
function partner(iso){ if (!S.partners[iso]){ const h = hashIso(iso); S.partners[iso] = {rel:(h%46)-14, trade:false, improveCd:0}; } return S.partners[iso]; }
function shortName(iso){ return SHORT_NAMES[iso] || ruName(iso); }
function partnerName(iso){ const x = C()[iso]; return x ? x.name : shortName(iso); }
function partnerGdp(iso){ const x = C()[iso]; return x ? x.gdp : (MINOR_GDP[iso] ?? 8); }
function relOf(iso){ const x = C()[iso]; return x ? x.rel : partner(iso).rel; }
function tradeOn(iso){ const x = C()[iso]; return x ? x.trade : partner(iso).trade; }
function demandPrem(iso, r){
  const x = C()[iso], g = partnerGdp(iso);
  if (r==="gold") return g >= 1000 ? 0.15 : g >= 200 ? 0.08 : 0.03;
  if (x){ const prof = r==="wood" ? woodProf(iso) : r==="steel" ? x.prof.metal : x.prof.oil; return clamp((1-prof)*0.3, -0.15, 0.35); }
  return ((hashIso(iso+r) % 40) - 8) / 100;
}
function premium_(iso, r){ return demandPrem(iso,r) + (tradeOn(iso) ? 0.1 : 0) + relOf(iso)/1000; }
function contractPrice(iso, r){ return commodPrice(r)*(1 + premium_(iso,r)); }
function partnerCap(iso){ const g = partnerGdp(iso); return g < 40 ? 1 : g < 300 ? 2 : 3; }
function canContract(iso){
  if (iso === S.player) return {ok:false, why:"это вы"};
  const x = C()[iso];
  if (x){
    if (x.owner) return {ok:false, why:"страна под вашим контролем"};
    if (S.wars.some(w=>w.enemy===iso)) return {ok:false, why:"идёт война"};
    if (x.sanction || x.sanctionsUs) return {ok:false, why:"действуют санкции"};
  }
  if (relOf(iso) < -10) return {ok:false, why:"нужны отношения от −10"};
  return {ok:true};
}
function contractQty(iso, r){ return S.contracts[iso+":"+r] || 0; }
function allContracts(){ return Object.entries(S.contracts).filter(([k,q])=>q>0).map(([k,q]) => { const [iso,r] = k.split(":"); return {iso, r, q}; }); }
function hasContract(iso){ return allContracts().some(c=>c.iso===iso); }
// projected monthly revenue from contracts + auto-sales (shown in the budget; real sales happen in tradeTurn)
function commodProjection(){
  let rev = 0;
  Object.keys(COMMOD).forEach(r => {
    if (!commodOpen(r)) return;
    const prod = prodOf(r); let avail = S.stock[r] + prod;
    allContracts().filter(c=>c.r===r && canContract(c.iso).ok).forEach(c => { const s = Math.min(c.q, avail); avail -= s; rev += s*contractPrice(c.iso, r); });
    if (S.autoSell[r]){ const sold = Math.max(0, Math.min(avail - COMMOD[r].reserve, prod)); rev += sold*commodPrice(r); }
  });
  return rev;
}
function minorTradeIncome(){ return Object.entries(S.partners).filter(([iso,p])=>p.trade && !C()[iso]).reduce((a,[iso]) => a + Math.min(me().gdp/12*0.0006, partnerGdp(iso)/12*0.004), 0); }
function tradeTurn(){
  let rev = 0; const short = {};
  allContracts().forEach(({iso, r, q}) => {
    const chk = canContract(iso);
    if (!chk.ok || !commodOpen(r)){ delete S.contracts[iso+":"+r]; addLog(`Контракт на поставку ${COMMOD[r].gen} в страну ${partnerName(iso)} расторгнут: ${chk.why||"нет доступа"}.`); return; }
    const ship = Math.min(q, S.stock[r]);
    if (ship < q) short[r] = true;
    S.stock[r] -= ship; rev += ship*contractPrice(iso, r);
    if (ship > 0){ const x = C()[iso]; if (x) x.rel = Math.min(100, x.rel + 0.3); else partner(iso).rel = Math.min(100, partner(iso).rel + 0.3); }
  });
  Object.keys(short).forEach(r => addLog(`Не хватило ${COMMOD[r].gen} для всех экспортных контрактов: часть поставок сорвана.`));
  Object.keys(COMMOD).forEach(r => { if (!S.autoSell[r] || !commodOpen(r)) return; const extra = S.stock[r] - COMMOD[r].reserve; if (extra > 0){ S.stock[r] -= extra; rev += extra*commodPrice(r); } });
  return rev;
}
function marketTurn(){
  Object.entries(COMMOD).forEach(([r,d]) => {
    const old = S.market[r];
    const v = clamp(old + (1 - old)*0.08 + rnd(-1,1)*d.vol*1.6, d.lo, d.hi);
    S.market[r] = v; S.mhist[r].push(v); S.mhist[r] = S.mhist[r].slice(-24);
    if (commodOpen(r) && Math.abs(v/old - 1) >= 0.08) addLog(`Мировые цены: ${d.name.toLowerCase()} ${v>old?"дорожает":"дешевеет"} на ${pct(Math.abs(v/old-1)*100)}.`);
  });
}
function canBuild(id){
  const b = BUILDINGS[id], r = b.req || {}, n = objCount(id) + queued(id);
  if (r.tech && !tech(r.tech)) return {ok:false, why:`нужна технология «${TECH.find(x=>x.id===r.tech).name}»`};
  if (r.res) for (const k in r.res) if (selfSuff(k) < r.res[k]) return {ok:false, why:`нужно ${RES.find(x=>x.id===k).name.toLowerCase()} от ${r.res[k]}%`};
  if (r.pop && me().pop < r.pop) return {ok:false, why:`нужно население от ${r.pop} млн`};
  if (r.cap) for (const k in r.cap) if (S.capital[k] < r.cap[k]) return {ok:false, why:`нужно накопленное ${k==="edu"?"образование":"инфраструктура"} ${r.cap[k]}`};
  if (b.max && n >= b.max) return {ok:false, why:`максимум ${b.max}`};
  if (b.perPop && n >= Math.floor(me().pop/b.perPop)+1) return {ok:false, why:"лимит по населению"};
  if (S.queue.length >= maxSlots()) return {ok:false, why:"все стройплощадки заняты"};
  if (S.treasury < buildTotal(id)) return {ok:false, why:"не хватает денег"};
  return {ok:true};
}
function armyUpkeepMonthly(){ const u = S.units; return me().army*0.004*gdppc()/12 + Object.entries(UNITS).reduce((a,[k,d])=>a + (u[k]||0)*d.upkeep/12, 0); }
function techMult(t){ return 1 + 0.25*t; }
function rawPower(){ const u = S.units; return me().army + Object.entries(UNITS).reduce((a,[k,d])=>a + (u[k]||0)*d.power, 0); }
function myPower(){ return rawPower() * techMult(me().tech) * (0.6 + 0.4*S.stability/100) * (1 + 0.1*tech("comms") + 0.2*tech("drones") + 0.2*tech("missile") + 0.2*tech("cyber")) * (ideo("nat")?1.2:1); }
function aiPower(c){ return c.army * 3 * techMult(c.tech); }
function hasPlant(unit){ return objCount(UNITS[unit].plant) > 0; }
function unitPrice(unit){ return UNITS[unit].price * (hasPlant(unit) ? 0.7 : 1.3); }
function armsBuyers(){ return Object.values(C()).filter(x=>!x.owner && x.rel>=40 && !S.wars.some(w=>w.enemy===x.id)); }
function armsExportIncome(){
  if (!armsBuyers().length) return 0;
  return Object.values(BUILDINGS).filter(b=>b.make).reduce((a,b) => {
    const id = Object.keys(BUILDINGS).find(k=>BUILDINGS[k]===b);
    if (!S.armsExport[b.make.unit]) return a;
    return a + objCount(id)*b.make.n*UNITS[b.make.unit].price*0.9*(1 + 0.5*tech("armsexport"));
  }, 0);
}
function railIncome(id){ const x = C()[id]; if (!x || x.owner || x.rel < 0) return 0; return Math.min(me().gdp, x.gdp)/12*0.004; }
function railCost(){ return me().gdp*0.012; }
function railTotal(){ return railCost() + matShort(RAIL_MAT).cost; }

function budget(){
  const c = me(), m = c.gdp/12;
  const K = S.capital;
  const compliance = (0.75 + 0.25*S.stability/100) * (lawOn("anticorr") ? 1.06 : 1) * (1 + (K.edu-33)*0.002 + (K.police-33)*0.001) * (1 + 0.05*tech("egov") + 0.05*tech("fintech"));
  const taxes = m * taxBurden()/100 * compliance;
  let trade = 0;
  const logi = 1 + 0.03*objCount("bridge") + 0.05*objCount("port");
  RES.forEach(r => {
    const bal = selfSuff(r.id) - 100;
    if (bal > 0) trade += m*0.00006*bal * (S.wars.length ? 0.8 : 1) * (1 + (K.infra-33)/150) * (1 + 0.2*tech("fintech")) * logi;
    else trade += m*0.00009*bal * (Object.values(C()).some(x=>x.sanctionsUs) ? 1.5 : 1);
  });
  const deals = Object.values(C()).filter(x=>x.trade && !x.owner).length;
  trade += m * 0.002 * deals * (1 + (K.infra-33)/150) * (ideo("dem")?1.25:1) * (1 + 0.1*objCount("airport"));
  trade += minorTradeIncome();
  const commod = commodProjection();
  const objects = Object.keys(BUILDINGS).reduce((a,id)=>a + objCount(id)*objIncome(id), 0);
  const upkeep = Object.keys(BUILDINGS).reduce((a,id)=>a + objCount(id)*objUpkeep(id), 0);
  const rail = Object.keys(S.rails).filter(id=>S.rails[id].done).reduce((a,id)=>a + railIncome(id), 0);
  const arms = armsExportIncome();
  const science = scienceCost();
  const sectors = SECTORS.reduce((a,s)=>a + m*0.01*S.sectors[s.id], 0) * (ideo("soc")?0.8:1);
  const intel = intelCost();
  const army = armyUpkeepMonthly();
  const laws = m * lawSum("cost");
  const interest = S.debt * 0.045 / 12;
  const war = m * 0.012 * S.wars.length;
  const income = taxes + Math.max(0,trade) + objects + rail + arms + commod;
  const spend = sectors + army + laws + interest + war + science + intel + upkeep + Math.max(0,-trade);
  return {taxes, trade, objects, upkeep, rail, arms, commod, science, intel, sectors, army, laws, interest, war, income, spend, net: income - spend};
}
function growthMonthly(){
  let g = 0.0015;
  const K = S.capital;
  g += (K.edu-33)*0.00005 + (K.infra-33)*0.00005 + (K.health-33)*0.00002;
  g -= 0.00025*Math.max(0, taxBurden()-15);
  g += 0.00025*S.buildings.factory*(1 + 0.5*tech("automation")) + BUILDINGS.highway.growth*objCount("highway");
  g += 0.00125*tech("ai") + 0.0004*tech("fusion") + 0.00025*tech("gene");
  g += ideo("tech") ? 0.00033 : ideo("soc") ? -0.00033 : 0;
  if (S.climatePact) g -= 0.0002;
  if (me().worldSanctions > 0) g -= 0.0015;
  g += 0.0003*Object.values(C()).filter(x=>x.trade && !x.owner).length;
  g -= 0.0008*Object.values(C()).filter(x=>x.sanctionsUs).length;
  g -= 0.002*S.wars.length;
  g -= 0.0006*deficits();
  g += lawSum("growth");
  g += modSum("growth");
  if (S.debt > me().gdp) g -= 0.001;
  return g;
}
function approvalTarget(){
  let t = 60 - (taxBurden()-14)*1.5;
  const K = S.capital;
  t += (K.health-33)*0.12 + (K.edu-33)*0.03 + (K.infra-33)*0.03 + (S.sectors.health-1)*1.5 - (S.sectors.police-1)*1;
  t -= S.wars.length*(ideo("nat")?5:10) + deficits()*3;
  t += ideo("dem")?5 : ideo("tech")?-3 : ideo("soc")?6 : ideo("auth")?-8 : 0;
  t += lawSum("appr") + modSum("approval") + objCount("metro") + 2*tech("telemed") + 2*tech("vaccines") + 3*tech("gene") + 5*tech("longevity");
  if (S.debt > me().gdp*0.9) t -= 5;
  return clamp(t, 0, 100);
}
function stabilityTarget(){
  let t = 25 + S.approval*0.5 + (S.capital.police-33)*0.15 + (S.sectors.police-1)*2 + lawSum("stab") + modSum("stability");
  t -= S.wars.length*4;
  t += ideo("dem")?-5 : ideo("auth")?15 : 0;
  return clamp(t, 0, 100);
}

function techCost(){ return me().gdp * 0.012 * me().tech; }
function recruitAmount(){ return Math.max(2, me().army*0.05); }
function recruitCost(){ const k = recruitAmount(); return k*0.004*gdppc() * (lawOn("conscription")?0.5:1) * (ideo("nat")?0.8:1); }
function improveCost(){ return Math.max(0.02, me().gdp*0.002); }
function canReach(c){ const r = me().region; return c.region === r || ADJ[r].includes(c.region); }
function controlled(){ return Object.values(C()).filter(c=>c.owner==="player"); }

/* ---------- Turn ---------- */
function nextMonth(){
  if (S.pendingEvent || S.over) return;
  const c = me();
  const before = {treasury:S.treasury, gdp:c.gdp, approval:S.approval, stability:S.stability};
  const startLog = S.log.length;

  // 1. budget
  const b = budget();
  const sales = tradeTurn();
  S.lastCommod = sales;
  S.treasury += b.net - b.commod + sales;
  if (sales > c.gdp*0.01) unlock("trader");
  if (new Set(allContracts().map(x=>x.iso)).size >= 8) unlock("partners");
  marketTurn();
  Object.values(S.partners).forEach(p => { if (p.improveCd > 0) p.improveCd--; p.rel += ((p.trade ? 20 : 0) - p.rel)*0.01 + rnd(-0.5,0.5); p.rel = clamp(p.rel, -100, 100); });
  if (S.treasury < 0){ S.debt += -S.treasury; addLog(`Дефицит бюджета покрыт займом: ${money(-S.treasury)}.`); S.treasury = 0; }

  // 2. construction delays, military production, railways
  S.queue.forEach(q => { if (Math.random() < 0.08){ const d = 20 + (Math.random()*25|0); q.left += d; q.total += d; addLog(`Стройка «${BUILDINGS[q.type].name}» задерживается на ${d} дн.: подрядчик сорвал сроки.`); } });
  Object.entries(BUILDINGS).forEach(([id,b]) => { if (b.make && objCount(id) && !(S.armsExport[b.make.unit] && armsBuyers().length)) S.units[b.make.unit] += objCount(id)*b.make.n; });
  Object.keys(S.rails).forEach(id => { if (S.rails[id].done && C()[id] && !C()[id].owner) C()[id].rel = Math.min(100, C()[id].rel + 0.5); });

  // 3. growth
  const g = growthMonthly() + rnd(-0.0008, 0.0008);
  c.gdp *= (1+g); c.pop *= 1.0006 + (S.capital.health-33)*0.00001 + 0.0001*tech("vaccines") + 0.0002*tech("longevity");
  SECTORS.forEach(s => { S.capital[s.id] += (S.sectors[s.id]*33.3 - S.capital[s.id]) * s.rate; });


  // 4. politics
  S.approval += (approvalTarget() - S.approval) * 0.15 + rnd(-0.6,0.6);
  S.stability += (stabilityTarget() - S.stability) * 0.15;
  S.approval = clamp(S.approval,0,100); S.stability = clamp(S.stability,0,100);

  // 5. world
  const warsBefore = S.wars.map(w=>w.enemy);
  aiTurn();
  S.wars.filter(w=>!warsBefore.includes(w.enemy)).forEach(w => advise("gen", `Тревога! ${C()[w.enemy].name} объявила нам войну. Войска приведены в готовность — жду приказов.`, {tab:"army", mood:"alert"}));

  // 6. wars
  warTurn();

  // 6b. intelligence, council, ideology cooldown
  S.intel.pts = Math.min(20, S.intel.pts + S.intel.level*0.8 + 0.2);
  Object.values(C()).forEach(x => {
    if (x.owner || x.rel > -40) return;
    if (Math.random() < 0.012*S.aggr){
      if (Math.random() < S.intel.level*0.25) addLog(`Контрразведка сорвала диверсию агентов страны ${x.name}.`);
      else { c.gdp *= 0.995; addLog(`Агенты страны ${x.name} устроили диверсию: ВВП −0,5%.`); }
    }
    if (x.worldSanctions > 0) x.worldSanctions--;
  });
  if (c.worldSanctions > 0){ c.worldSanctions--; if (!c.worldSanctions) addLog("Международные санкции против вас истекли."); }
  councilTurn();
  if (S.ideoCd > 0) S.ideoCd--;
  if (S.climatePact > 0) S.climatePact--;
  if (S.wars.length) S.flags.everWar = true;

  // 7. modifiers & cooldowns
  S.mods.forEach(m=>m.left--); S.mods = S.mods.filter(m=>m.left>0);
  Object.values(C()).forEach(x=>{ if (x.improveCd>0) x.improveCd--; });
  if (S.adCd>0) S.adCd--;
  if (S.council.propCd>0) S.council.propCd--;

  // 8. date
  S.turn++; S.month++; if (S.month>11){ S.month=0; S.year++; }

  // 9. elections
  if (!ideo("auth")) S.electionIn--;
  if (S.electionIn<=0){
    if (S.approval >= 50){ S.terms++; S.electionIn = 48; S.mods.push({stat:"approval",v:4,left:6}); addLog(`Вы победили на выборах с рейтингом ${pct(S.approval)}. Начинается срок № ${S.terms+1}.`); }
    else return endGame(false, "Вы проиграли выборы", `Рейтинг на день голосования: ${pct(S.approval)}. Для победы нужно 50%.`);
  }

  // 10. defeat checks
  S.lowStab = S.stability < 15 ? S.lowStab+1 : 0;
  if (S.lowStab >= 3) return endGame(false, "Революция", "Стабильность три месяца подряд была ниже 15%. Правительство свергнуто.");
  if (S.debt > c.gdp*1.6) return endGame(false, "Дефолт", "Госдолг превысил 160% ВВП. Страна объявила банкротство.");

  // 11. victory checks
  const rivals = Object.values(C()).filter(x=>!x.owner);
  const top = rivals.every(x => x.gdp < c.gdp);
  S.topMonths = top ? S.topMonths+1 : 0;
  if (controlled().length >= 8) return endGame(true, "Военная победа", "Под вашим контролем 8 стран.");
  if (S.topMonths >= 12) return endGame(true, "Экономическая победа", "Ваша страна 12 месяцев подряд — крупнейшая экономика мира.");
  if (S.terms >= 4 && !ideo("auth")) return endGame(true, "Победа на выборах", "Вы отработали четыре срока подряд — 16 лет у власти.");

  // 12. events
  S.eventCd--;
  if (S.eventCd <= 0 && Math.random() < 0.4){ S.pendingEvent = drawEvent(); S.eventCd = 2; }

  advisorsTurn();
  S.hist.gdp.push(c.gdp); S.hist.appr.push(S.approval);
  S.hist.gdp = S.hist.gdp.slice(-36); S.hist.appr = S.hist.appr.slice(-36);
  S.day = 1;
  S.last = {
    d:{treasury:S.treasury-before.treasury, gdp:c.gdp-before.gdp, approval:S.approval-before.approval, stability:S.stability-before.stability},
    lines: S.log.slice(0, Math.max(0, S.log.length - startLog)).map(l=>l.text).slice(0,6)
  };
  checkAchievements();
  save();
  render();
  if (S.pendingEvent){ pauseFor("event"); showReport(); }
  else { const d = S.last.d; toast(`${MONTHS[(S.month+11)%12]}: бюджет ${d.treasury>=0?"+":""}${money(d.treasury)}, рейтинг ${d.approval>=0?"+":""}${d.approval.toFixed(1).replace(".",",")}`); if (d.treasury > 0) sfx("coin"); }
}

function aiTurn(){
  const meC = me();
  Object.values(C()).forEach(c => {
    if (c.owner) return;
    c.gdp *= 1 + rnd(0.0006, 0.0026) - (c.sanction ? 0.0012 : 0) - (c.worldSanctions>0 ? 0.0015 : 0);
    // relations drift toward a baseline
    const base = c.ally ? 60 : c.trade ? 25 : 0;
    c.rel += (base - c.rel) * 0.02 + rnd(-1.2,1.2);
    if (S.wars.some(w=>w.enemy===c.id)) c.rel = -100;
    c.rel = clamp(c.rel,-100,100);
    if (c.trade && c.rel < 0){ c.trade = false; addLog(`${c.name} разорвала торговое соглашение.`); }
    if (c.ally && c.rel < 30){ c.ally = false; addLog(`${c.name} вышла из союза с вами.`); }
    // sanctions against us
    if (!c.sanctionsUs && c.rel < -50 && Math.random() < 0.04){ c.sanctionsUs = true; addLog(`${c.name} ввела санкции против вас.`); }
    if (c.sanctionsUs && c.rel > -20 && Math.random() < 0.15){ c.sanctionsUs = false; addLog(`${c.name} сняла санкции.`); }
    // war declared on us
    if (!S.wars.some(w=>w.enemy===c.id) && canReach(c) && c.rel < -65 && aiPower(c) > myPower()*1.3 && Math.random() < 0.02*S.aggr*(tech("missile")?0.5:1)){
      S.wars.push({enemy:c.id, progress:0, months:0});
      c.rel = -100; c.trade = false; c.ally = false;
      addLog(`⚠ ${c.name} объявила вам войну!`);
    }
  });
}

function warTurn(){
  const meC = me();
  S.wars.forEach(w => {
    const e = C()[w.enemy];
    const allies = Object.values(C()).filter(x=>x.ally && !x.owner && x.id!==e.id).reduce((a,x)=>a+aiPower(x)*0.3,0);
    const mine = myPower() + allies, theirs = aiPower(e)*(1.1 + rnd(-0.1,0.1))*(tech("cyber")?0.9:1);
    w.progress += (mine/(mine+theirs) - 0.5)*40 + rnd(-8,8);
    w.progress = clamp(w.progress,-100,100); w.months++;
    const loss = 1 - rnd(0.01,0.03)*(theirs/(mine+theirs));
    meC.army *= loss; Object.keys(S.units).forEach(k => S.units[k] = Math.floor(S.units[k]*loss));
    e.army *= 1 - rnd(0.01,0.03)*(mine/(mine+theirs));
  });
  S.wars.slice().forEach(w => {
    const e = C()[w.enemy];
    if (w.progress >= 100){
      e.owner = "player"; e.ally=false; e.trade=false; e.sanction=false; e.sanctionsUs=false;
      meC.gdp += e.gdp*0.6; meC.pop += e.pop; meC.army += e.army*0.3; S.units.tank += Math.round(e.army*0.6); S.units.heli += Math.round(e.army*0.08);
      RES.forEach(r => { if (e.prof[r.id] > 1) S.annexBonus[r.id] += Math.min(40,(e.prof[r.id]-1)*30); });
      S.wars = S.wars.filter(x=>x!==w);
      Object.values(C()).forEach(x => { if (!x.owner && x.region===e.region) x.rel -= 15; });
      addLog(`Победа! ${e.name} переходит под ваш контроль.`);
    } else if (w.progress <= -100){
      S.wars = S.wars.filter(x=>x!==w);
      meC.gdp *= 0.85; S.treasury = Math.max(0, S.treasury - meC.gdp*0.02);
      S.mods.push({stat:"approval",v:-15,left:12});
      e.rel = -60;
      addLog(`Поражение в войне с ${e.name}. Подписан унизительный мир: −15% ВВП.`);
    }
  });
}

function councilTurn(){
  const K = S.council;
  if (!K.res){
    K.next--;
    if (K.next <= 0){
      const pool = Object.values(C()).filter(x=>!x.owner);
      const type = pick(["sanctions","sanctions","warban","climate","aid"]);
      let target = null;
      if (type==="sanctions" || type==="warban"){
        const avgRel = pool.reduce((a,x)=>a+x.rel,0)/pool.length;
        target = (type==="sanctions" && (S.wars.length || avgRel < -15) && Math.random()<0.5) ? S.player : pick(pool).id;
      }
      K.res = {type, target, left:3, proposer:"world", myVote:null};
      addLog(`Совет наций вынес на голосование: «${resName(K.res)}».`);
    }
    return;
  }
  K.res.left--;
  if (K.res.left <= 0) resolveCouncil();
}
function resName(r){ const tn = r.target ? (r.target===S.player ? "вас" : C()[r.target].name) : ""; return RES_TYPES[r.type].name.replace("{X}", tn); }
function resolveCouncil(){
  const K = S.council, r = K.res;
  let yes = 0, no = 0;
  if (r.myVote==="yes") yes += 2; else if (r.myVote==="no") no += 2;
  Object.values(C()).forEach(x => {
    if (x.owner) return;
    let p;
    if (r.type==="sanctions" && r.target===S.player) p = clamp(0.3 - x.rel/150, 0.05, 0.95);
    else if (r.target===x.id) p = 0;
    else p = r.type==="warban" ? 0.6 : r.type==="climate" ? 0.55 : 0.5;
    if (r.proposer==="player") p = clamp(p + x.rel/250, 0.05, 0.95);
    if ((x.ally || x.rel>50) && r.myVote && r.target!==S.player) p = r.myVote==="yes" ? 0.85 : 0.15;
    if (r.target===x.id) { no++; return; }
    if (Math.random() < 0.12) return; // abstain
    if (Math.random() < p) yes++; else no++;
  });
  const passed = yes > no;
  addLog(`Совет наций: «${resName(r)}» — ${passed?"ПРИНЯТО":"отклонено"} (${yes} за, ${no} против).`);
  if (passed){
    if (r.proposer==="player") S.flags.resPassed = true;
    if (r.type==="sanctions"){
      if (r.target===S.player){
        me().worldSanctions = 24;
        Object.values(C()).forEach(x=>{ if (!x.owner && x.rel < 30){ x.sanctionsUs = true; x.trade = false; } });
      } else { const x = C()[r.target]; x.worldSanctions = 24; if (x.trade){ x.trade=false; addLog(`Торговля с ${x.name} прекращена из-за санкций.`); } }
    }
    if (r.type==="warban") K.banned[r.target] = true;
    if (r.type==="climate"){ S.climatePact = 24; S.mods.push({stat:"approval",v:3,left:12}); }
    if (r.type==="aid"){ const amt = me().gdp*(gdppc()>20 ? -0.003 : 0.005); S.treasury += amt; addLog(amt<0 ? `Взнос в фонд помощи: ${money(-amt)}.` : `Получена помощь фонда: ${money(amt)}.`); }
  }
  K.res = null; K.next = rnd(4,7)|0;
}
function opChance(op, target){
  let p = 0.45 + 0.1*S.intel.level + 0.1*tech("cyber") - 0.07*target.tech;
  if (op==="coup") p *= 0.5;
  return clamp(p, 0.05, 0.9);
}
function opAllowed(op, target){
  if (!target || target.owner) return false;
  if (op.id==="coup" && !(canReach(target) && target.gdp < me().gdp*0.5)) return false;
  if (op.id==="spy" && !S.research.current) return false;
  return S.intel.pts >= op.pts && S.treasury >= improveCost();
}
function runOp(opId, targetId){
  const op = OPS.find(o=>o.id===opId), x = C()[targetId];
  if (!opAllowed(op, x)) return toast("Операция сейчас недоступна.");
  S.intel.pts -= op.pts; S.treasury -= improveCost();
  if (Math.random() < opChance(op.id, x)){
    S.intel.ok++;
    if (op.id==="spy"){ S.research.prog[S.research.current] = (S.research.prog[S.research.current]||0) + 15; addLog(`Агенты добыли технологии в стране ${x.name}: +15 очков науки.`); }
    if (op.id==="sabotage"){ x.gdp *= 0.98; x.army *= 0.97; addLog(`Диверсия в стране ${x.name} удалась.`); }
    if (op.id==="opposition"){ x.gdp *= 0.99; if (Math.random()<0.25){ x.rel = Math.max(x.rel, 40); addLog(`В стране ${x.name} к власти пришла дружественная вам оппозиция.`); } else addLog(`Оппозиция в стране ${x.name} усилилась.`); }
    if (op.id==="coup"){ x.rel = 80; x.ally = true; x.trade = true; x.sanction = false; x.sanctionsUs = false; S.flags.coup = true; addLog(`Переворот в стране ${x.name}: новое правительство — ваш союзник.`); }
    checkAchievements(); save(); render();
    showOpReport(op, x, op.id==="opposition" && x.rel >= 40 ? "flip" : "ok", S.log[0].text);
  } else {
    if (Math.random() < 0.5){ x.rel = clamp(x.rel-25,-100,100); S.mods.push({stat:"approval",v:-3,left:6}); addLog(`Провал операции в стране ${x.name}: агенты раскрыты, скандал.`); checkAchievements(); save(); render(); showOpReport(op, x, "exposed", "Отношения с этой страной −25, рейтинг дома −3 на полгода."); }
    else { addLog(`Операция в стране ${x.name} не удалась, но следов не осталось.`); checkAchievements(); save(); render(); showOpReport(op, x, "clean", "Агенты потрачены, последствий нет."); }
  }
}
function endGame(win, title, text){
  ui.speed = 0;
  S.over = {win, title, text};
  if (win){ unlock("winner"); if (S.scenario==="zero" || S.scenario==="lastchance") unlock("hard"); }
  storageDel();
  render();
  showEnd();
}

/* synthesized sound effects: no audio files needed */
let AC = null;
function sfx(kind){
  if (!settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, type, vol, when) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.setValueAtTime(f, t + (when||0)); g.gain.setValueAtTime(vol || 0.05, t + (when||0)); g.gain.exponentialRampToValueAtTime(0.0001, t + (when||0) + d); o.connect(g).connect(AC.destination); o.start(t + (when||0)); o.stop(t + (when||0) + d + 0.02); };
    if (kind === "tap") tone(620, 0.045, "triangle", 0.035);
    else if (kind === "open") { tone(392, 0.07, "sine", 0.04); tone(587, 0.1, "sine", 0.035, 0.05); }
    else if (kind === "notify") { tone(880, 0.1, "sine", 0.045); tone(1320, 0.16, "sine", 0.035, 0.09); }
    else if (kind === "alert") { tone(330, 0.16, "square", 0.025); tone(247, 0.24, "square", 0.025, 0.15); }
    else if (kind === "success") { tone(523, 0.09, "triangle", 0.05); tone(659, 0.09, "triangle", 0.05, 0.08); tone(784, 0.22, "triangle", 0.05, 0.16); }
    else if (kind === "coin") { tone(1046, 0.06, "square", 0.025); tone(1568, 0.14, "square", 0.02, 0.05); }
  } catch(e){}
}

function advise(who, text, o){

function showNextAdvice(){

/* ---------- Actions ---------- */
function act(name, arg){
  const c = me();
  switch(name){
    case "build": {
      const chk = canBuild(arg); if (!chk.ok) return toast("Нельзя построить: " + chk.why + ".");
      const b = BUILDINGS[arg], mat = b.mat || {}, sh = matShort(mat), days = buildDays(arg);
      S.treasury -= buildCost(arg) + sh.cost; takeMat(mat);
      S.queue.push({type:arg, left:days, total:days});
      if (sh.cost > 0) addLog(`Для стройки «${b.name}» закуплены материалы по импорту: ${Object.entries(sh.miss).map(([r,q])=>`${COMMOD[r].name.toLowerCase()} ${Math.ceil(q)}`).join(", ")} на ${money(sh.cost)}.`);
      toast(`Начато строительство: ${b.name}`); break;
    }
    case "recruit": {
      const cost = recruitCost();
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; c.army += recruitAmount(); toast("Войска набраны."); break;
    }
    case "disband": c.army = Math.max(1, c.army*0.95); toast("Армия сокращена на 5%."); break;
    case "tech": {
      if (c.tech >= 5) return;
      const cost = techCost(); if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; c.tech++; toast(`Военные технологии: уровень ${c.tech}.`); break;
    }
    case "improve": {
      const t = C()[arg], cost = improveCost();
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; t.rel = clamp(t.rel + 12, -100, 100); t.improveCd = 3; toast(`Отношения с ${t.name} улучшены.`); break;
    }
    case "trade": { const t=C()[arg]; t.trade = !t.trade; addLog(t.trade ? `Подписано торговое соглашение с ${t.name}.` : `Торговое соглашение с ${t.name} расторгнуто.`); if(!t.trade) t.rel -= 10; break; }
    case "ally": { const t=C()[arg]; t.ally = !t.ally; addLog(t.ally ? `Заключён военный союз с ${t.name}.` : `Союз с ${t.name} расторгнут.`); if(!t.ally) t.rel -= 20; break; }
    case "sanction": {
      const t=C()[arg]; t.sanction = !t.sanction;
      if (t.sanction){ t.rel -= 30; t.trade = false; t.ally = false; addLog(`Вы ввели санкции против ${t.name}.`); if (Math.random()<0.6){ t.sanctionsUs = true; addLog(`${t.name} ответила зеркальными санкциями.`); } }
      else { t.rel += 10; addLog(`Санкции против ${t.name} сняты.`); }
      break;
    }
    case "war": {
      const t=C()[arg];
      S.wars.push({enemy:t.id, progress:0, months:0});
      t.rel = -100; t.trade=false; t.ally=false;
      Object.values(C()).forEach(x => { if (!x.owner && x.id!==t.id){ x.rel -= x.region===t.region ? 12 : 4; if (x.ally && x.rel<30) x.ally=false; } });
      S.mods.push({stat:"approval",v:-5,left:3});
      if (S.council.banned[t.id]){ S.mods.push({stat:"approval",v:-15,left:12}); Object.values(C()).forEach(x=>{ if(!x.owner) x.rel -= 20; }); addLog(`Нападение на ${t.name} нарушает резолюцию Совета наций: весь мир осуждает вас.`); }
      addLog(`Вы объявили войну стране ${t.name}.`);
      ui.tab = "army"; break;
    }
    case "peace": {
      const w = S.wars.find(x=>x.enemy===arg), t = C()[arg];
      const chance = 0.45 + w.progress/200;
      if (Math.random() < chance){ S.wars = S.wars.filter(x=>x!==w); t.rel = -50; addLog(`Подписан мир со страной ${t.name}.`); toast("Мир подписан."); }
      else { toast(`${t.name} отклонила мирное предложение.`); }
      break;
    }
    case "buyunit": {
      const u = UNITS[arg], cost = unitPrice(arg)*u.batch;
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; S.units[arg] += u.batch; toast(`Закуплено: ${u.name.toLowerCase()} +${u.batch}`); break;
    }
    case "sellunit": { const u = UNITS[arg]; const n = Math.min(S.units[arg], u.batch); S.units[arg] -= n; S.treasury += n*u.price*0.4; toast(`Списано и продано: ${n}`); break; }
    case "armsexport": { S.armsExport[arg] = !S.armsExport[arg]; break; }
    case "rail": {
      const x = C()[arg], cost = railTotal();
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; takeMat(RAIL_MAT); S.rails[arg] = {left:360, total:360, done:false}; x.rel = Math.min(100, x.rel+5);
      addLog(`Начато строительство железной дороги в страну ${x.name}.`); break;
    }
    case "sell": {
      const [r, frac] = arg.split(":"), q = Math.floor(S.stock[r]*(+frac));
      if (q < 1) return toast("На складе почти ничего нет.");
      const sum = q*commodPrice(r); S.stock[r] -= q; S.treasury += sum;
      toast(`Продано: ${COMMOD[r].name.toLowerCase()} ${q} ${COMMOD[r].unit} за ${money(sum)}`); break;
    }
    case "buy": {
      const d = COMMOD[arg], cost = d.buy*importPrice(arg);
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; S.stock[arg] += d.buy; toast(`Закуплено: ${d.name.toLowerCase()} +${d.buy} ${d.unit}`); break;
    }
    case "autosell": S.autoSell[arg] = !S.autoSell[arg]; break;
    case "pimprove": {
      const p = partner(arg), cost = improveCost()*0.5;
      if (S.treasury < cost || p.improveCd > 0) return;
      S.treasury -= cost; p.rel = clamp(p.rel + 12, -100, 100); p.improveCd = 3; toast(`Отношения с ${shortName(arg)} улучшены.`); break;
    }
    case "ptrade": { const p = partner(arg); p.trade = !p.trade; if (!p.trade) p.rel -= 8; addLog(p.trade ? `Подписано торговое соглашение с ${shortName(arg)}.` : `Торговое соглашение с ${shortName(arg)} расторгнуто.`); break; }
    case "contract": {
      const [iso, r, q] = arg.split(":"), key = iso+":"+r, before = S.contracts[key] || 0;
      if (+q > 0 && !canContract(iso).ok) return toast("Контракт невозможен: " + canContract(iso).why + ".");
      if (+q > 0) S.contracts[key] = +q; else delete S.contracts[key];
      if (!before && +q > 0) addLog(`Подписан контракт: ${q} ${COMMOD[r].unit} ${COMMOD[r].gen} в месяц для страны ${partnerName(iso)}.`);
      if (before && !(+q)) addLog(`Контракт на поставку ${COMMOD[r].gen} в страну ${partnerName(iso)} расторгнут.`);
      break;
    }
    case "ad": showAd(); return;
  }
  save(); render();
}

/* ---------- Daily progress: research, construction, railways ---------- */
function dayTick(){
  if (S.research.current){
    const rc = S.research.current, tc = TECH.find(x=>x.id===rc);
    S.research.prog[rc] = (S.research.prog[rc]||0) + rpMonthly()/30;
    if (S.research.prog[rc] >= tc.cost){ S.research.done[rc] = true; S.research.current = null; addLog(`Открыта технология «${tc.name}»: ${tc.desc}.`); advise("sec", `Учёные докладывают: открыта технология «${tc.name}» — ${tc.desc}. Какое исследование следующее?`, {tab:"science"}); sfx("success"); dirty = true; }
  }
  Object.keys(COMMOD).forEach(r => { S.stock[r] += prodOf(r)/30; });
  const speed = selfSuff("metal") < 60 ? 0.5 : 1;
  S.queue.forEach(q => q.left -= speed);
  const done = S.queue.filter(q=>q.left<=0);
  done.forEach(q => { S.buildings[q.type]++; addLog(`Построено: ${BUILDINGS[q.type].name}.`); advise("econ", `Объект сдан: ${BUILDINGS[q.type].name}. Уже работает на страну.`, {tab:"build"}); dirty = true; });
  if (done.length) S.queue = S.queue.filter(q=>q.left>0);
  Object.keys(S.rails).forEach(id => { const r = S.rails[id]; if (!r.done){ r.left -= 1; if (r.left<=0){ r.done = true; addLog(`Открыта железная дорога в страну ${C()[id].name}.`); toast(`Железная дорога: ${C()[id].name}`); dirty = true; } } });
}
let dirty = false;

/* ---------- Real-time clock ---------- */
let acc = 0, lastTs = 0, pausedBy = null;
function setSpeed(v){
  if (!S || S.over) return;
  if (v===3 && !speed3Unlocked()){ showSpeedOffer(); return; }
  if (S.pendingEvent && v>0){ showReport(); return; }
  ui.speed = v; if (v>0) ui.resumeSpeed = v;
  pausedBy = null; lastTs = performance.now(); updateClock();
}
function pauseFor(reason){ if (ui.speed>0){ ui.resumeSpeed = ui.speed; pausedBy = reason; } ui.speed = 0; updateClock(); }
function resumeAfter(reason){ if (pausedBy===reason){ pausedBy = null; ui.speed = ui.resumeSpeed; lastTs = performance.now(); } updateClock(); }
function tick(ts){
  requestAnimationFrame(tick);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(ts - lastTs, 1000); lastTs = ts;
  if (!S || !S.countries || S.over || ui.speed===0 || S.pendingEvent) return;
  if (ui.speed===3 && !speed3Unlocked()){ ui.speed = 2; ui.resumeSpeed = 2; toast("Время ×3 за рекламу закончилось. Скорость ×2."); render(); }
  acc += dt;
  const msDay = SPEED_MS[ui.speed];
  while (acc >= msDay){
    acc -= msDay;
    S.day = (S.day||1) + 1;
    dayTick();
    if (S.day > daysIn(S.month, S.year)){ acc = 0; nextMonth(); return; }
  }
  if (dirty){ dirty = false; save(); render(); }
  updateLive();
  updateClock();
}
function updateLive(){
  document.querySelectorAll("[data-qprog]").forEach(el => { const q = S.queue[+el.dataset.qprog]; if (q) el.style.width = ((1 - q.left/q.total)*100).toFixed(1)+"%"; });
  document.querySelectorAll("[data-qdays]").forEach(el => { const q = S.queue[+el.dataset.qdays]; if (q) el.textContent = Math.ceil(q.left) + " дн."; });
  const rc = S.research.current; if (rc){ const tc = TECH.find(x=>x.id===rc), pr = S.research.prog[rc]||0; document.querySelectorAll("[data-rprog]").forEach(el => el.style.width = Math.min(100, pr/tc.cost*100).toFixed(1)+"%"); document.querySelectorAll("[data-rdays]").forEach(el => el.textContent = `${Math.floor(pr)} / ${tc.cost} · осталось ~${Math.max(1, Math.ceil((tc.cost-pr)/(rpMonthly()/30)))} дн.`); }
}
function updateClock(){
  if (!S || !S.countries) return;
  const el = document.getElementById("clock-date"); if (el) el.textContent = fullDate();
  const bar = document.getElementById("clock-bar"); if (bar) bar.style.width = ((S.day-1 + acc/SPEED_MS[ui.speed||1]) / daysIn(S.month,S.year) * 100).toFixed(1) + "%";
  document.querySelectorAll("[data-speed]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.speed===ui.speed)));
  const hint = document.getElementById("clock-hint"); if (hint) hint.hidden = ui.speed!==0 || !!S.pendingEvent;
}
requestAnimationFrame(tick);
setInterval(() => { const tEl = document.querySelector('[data-speed="3"] .timer'); if (tEl) tEl.textContent = speed3MinutesLeft() + "м"; }, 30000);
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseFor("hidden"); else resumeAfter("hidden"); });
document.addEventListener("keydown", e => {
  if (e.code!=="Space" || /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName) || !S || !S.countries) return;
  e.preventDefault(); setSpeed(ui.speed===0 ? ui.resumeSpeed : 0);
});

function kpiFlash(){
  const now = {treasury:S.treasury, approval:S.approval}, prev = ui.kpiPrev;
  ui.kpiPrev = now; if (!prev) return;
  Object.keys(now).forEach(k => { const d = now[k] - prev[k]; if (Math.abs(d) < 1e-6) return;
    const el = document.querySelector(`[data-kpi="${k}"] .v`); if (el) el.classList.add(d > 0 ? "fl-up" : "fl-down"); });
}
function growthLabel(){ const g = growthMonthly()*12*100; return `<span class="${g>=0?"up":"down"}">${g>=0?"+":""}${pct(g,1)} в год</span>`; }
function sectorEffect(id){
  const d = S.capital[id]-33, m = me().gdp/12;
  const fmt = v => (v>=0?"+":"") + v.toFixed(1).replace(".",",");
  if (id==="edu"){ const g = d*0.00005*1200, tx = budget().taxes*d*0.002/(1 + (S.capital.edu-33)*0.002 + (S.capital.police-33)*0.001); return {text:`рост ${fmt(g)}% · налоги ${tx>=0?"+":"−"}${money(Math.abs(tx))}`, good:d>1, bad:d<-1}; }
  if (id==="infra"){ const g = d*0.00005*1200; return {text:`рост ${fmt(g)}% в год, экспорт ${fmt(d/1.5)}%`, good:d>1, bad:d<-1}; }
  if (id==="health"){ return {text:`рейтинг ${fmt(d*0.12)}, рост ${fmt(d*0.00002*1200)}%`, good:d>1, bad:d<-1}; }
  return {text:`стабильность ${fmt(d*0.15)}, налоги ${fmt(d*0.1)}%`, good:d>1, bad:d<-1};
}
function barClass(v){ return v>=65?"high":v>=40?"":v>=25?"mid":"low"; }

function spark(arr, color){
  if (arr.length < 2) return `<svg class="spark" viewBox="0 0 300 56"></svg>`;
  const min = Math.min(...arr), max = Math.max(...arr), span = (max-min) || 1;
  const pts = arr.map((v,i) => `${(i/(arr.length-1)*296+2).toFixed(1)},${(52 - (v-min)/span*48).toFixed(1)}`).join(" ");
  const lastPt = pts.split(" ").pop().split(",");
  return `<svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" style="stroke:${color}"/><circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="3" style="fill:${color}"/></svg>`;
}

/* ---------- World map (jsVectorMap world.js, MIT, loaded at runtime) ---------- */
let WORLD = null, worldFailed = false;
(function loadWorld(){
  const sources = ["world.js", "https://cdn.jsdelivr.net/npm/jsvectormap@1.6.0/dist/maps/world.js", "https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"];
  window.jsVectorMap = window.jsVectorMap || { addMap(name, data){ if (!WORLD){ WORLD = data; if (S && S.countries && ui.tab==="map") render(); } } };
  const tryLoad = i => {
    if (i >= sources.length){ worldFailed = true; if (S && S.countries && ui.tab==="map") render(); return; }
    const s = document.createElement("script");
    s.src = sources[i];
    s.onerror = () => tryLoad(i+1);
    s.onload = () => { if (!WORLD) tryLoad(i+1); };
    document.head.appendChild(s);
  };
  tryLoad(0);
})();
let regionNames = null;
function ruName(iso){ try { regionNames = regionNames || new Intl.DisplayNames(["ru"], {type:"region"}); return regionNames.of(iso.toUpperCase()); } catch(e){ return iso.toUpperCase(); } }
function mapClass(iso){
  const x = C()[iso];
  if (!x){ const p = S.partners[iso]; return p && (p.trade || hasContract(iso)) ? "m-trade" : p && p.rel <= -40 ? "m-hostile" : "m-minor"; }
  if (x.id === S.player) return "m-player";
  if (x.owner) return "m-own";
  if (S.wars.some(w=>w.enemy===x.id)) return "m-war";
  if (x.ally) return "m-ally";
  if (x.trade || hasContract(iso)) return "m-trade";
  if (x.rel <= -40 || x.sanctionsUs) return "m-hostile";
  if (x.rel >= 40) return "m-friend";
  return "m-neutral";
}
function mapSize(){ const w = WORLD.width || (WORLD.insets && WORLD.insets[0].width) || 900; const h = WORLD.height || (WORLD.insets && WORLD.insets[0].height) || 440; return [w,h]; }
function viewMap(){
  if (!ui.map) ui.map = {k:1, x:0, y:null};
  if (!ui.mapSel) ui.mapSel = S.player;
  let svg;
  if (WORLD){

  } else svg = `<div class="map-empty">${worldFailed ? "Не удалось загрузить карту. Проверьте интернет — список стран доступен во вкладке «Дипломатия»." : "Загружаем карту мира…"}</div>`;

// height of the visible viewBox: in landscape the map fills its box, so the viewBox takes the box's aspect ratio
function mapVH(){ return ui.mapVH || (WORLD ? mapSize()[1] : 440); }
function mapClamp(){
  const [w,h] = mapSize(), vh = mapVH(), m = ui.map;
  m.k = clamp(m.k, 1, 10);
  m.x = clamp(m.x, w - w*m.k, 0);
  if (h*m.k <= vh) m.y = (vh - h*m.k)/2;
  else m.y = m.y == null ? (vh - h*m.k)/2 : clamp(m.y, vh - h*m.k, 0);
}
function mapApply(){ const g = document.getElementById("map-g"); if (g){ mapClamp(); g.setAttribute("transform", `translate(${ui.map.x} ${ui.map.y}) scale(${ui.map.k})`); scheduleLabels(); } }

/* country name labels: centre of each country's largest outline, shown when it fits and doesn't overlap */
let LABELS = null, lblRaf = 0;
function computeLabels(){
  if (LABELS || !WORLD) return;
  const g = document.getElementById("map-g"); if (!g) return;
  const tmp = document.createElementNS("http://www.w3.org/2000/svg", "path");
  tmp.setAttribute("visibility", "hidden"); g.appendChild(tmp);
  const out = {};
  for (const [code, p] of Object.entries(WORLD.paths)){
    let best = null, ba = -1;
    String(p.path).split(/(?=M)/).forEach(d => {
      if (!d.trim()) return;
      tmp.setAttribute("d", d); let b; try { b = tmp.getBBox(); } catch(e){ return; }
      const a = b.width*b.height; if (a > ba){ ba = a; best = b; }
    });
    if (best && best.width > 0) out[code.toLowerCase()] = {x:best.x + best.width/2, y:best.y + best.height/2, w:best.width, h:best.height};
  }
  tmp.remove();
  if (Object.keys(out).length) LABELS = out;
}
function attachLabels(){
  computeLabels();
  const g = document.getElementById("map-g"); if (!g || !LABELS) return;
  const lg = document.createElementNS("http://www.w3.org/2000/svg", "g"); lg.id = "map-labels";
  Object.entries(LABELS).forEach(([iso, L]) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", L.x.toFixed(1)); t.setAttribute("y", L.y.toFixed(1)); t.dataset.iso = iso;
    const cls = iso===ui.mapSel ? "lb-sel" : iso===S.player ? "lb-me" : C()[iso] ? "lb-game" : "";
    if (cls) t.setAttribute("class", cls);
    t.textContent = partnerName(iso);
    lg.appendChild(t);
  });
  g.appendChild(lg);
  updateLabels();
}
function scheduleLabels(){ if (lblRaf) return; lblRaf = requestAnimationFrame(() => { lblRaf = 0; updateLabels(); }); }
function updateLabels(){
  const svg = document.getElementById("worldmap"), lg = document.getElementById("map-labels");
  if (!svg || !lg || !LABELS) return;
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  const [w] = mapSize(), upp = w / r.width, m = ui.map, k = m.k;
  const PX = r.width < 520 ? 9.5 : 11.5;
  lg.setAttribute("font-size", (PX*upp/k).toFixed(3));
  lg.setAttribute("stroke-width", (3*upp/k).toFixed(3));
  const items = [...lg.children].map(t => {
    const iso = t.dataset.iso, L = LABELS[iso];
    return { t, iso, sx:(L.x*k + m.x)/upp, sy:(L.y*k + m.y)/upp, sw:L.w*k/upp, sh:L.h*k/upp, tw:t.textContent.length*PX*0.56,
      pri: iso===ui.mapSel ? 4 : iso===S.player ? 3 : C()[iso] ? 2 : 1 };
  }).sort((a,b) => b.pri - a.pri || b.sw*b.sh - a.sw*a.sh);
  const placed = [];
  items.forEach(it => {
    const fits = it.pri >= 3 || it.sw >= it.tw*(it.pri === 2 ? 0.55 : 0.95);
    const vis = it.sx > -40 && it.sx < r.width + 40 && it.sy > -10 && it.sy < r.height + 10;
    let ok = fits && vis;
    if (ok){
      const box = [it.sx - it.tw/2 - 2, it.sy - PX*0.6, it.sx + it.tw/2 + 2, it.sy + PX*0.6];
      if (placed.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) ok = false; else placed.push(box);
    }
    it.t.style.display = ok ? "" : "none";
  });
}

function mapZoomAt(vx, vy, factor){ const m = ui.map, nk = clamp(m.k*factor, 1, 10); const px = (vx - m.x)/m.k, py = (vy - m.y)/m.k; m.k = nk; m.x = vx - px*nk; m.y = vy - py*nk; mapApply(); }
function attachMap(){
  const svg = document.getElementById("worldmap"); if (!svg) return;
  const [w, h] = mapSize(), wrap = document.getElementById("map-wrap"), wr = wrap.getBoundingClientRect();
  ui.mapVH = wr.width > 0 && wr.height > 0 ? w * wr.height / wr.width : h;
  svg.setAttribute("viewBox", `0 0 ${w} ${ui.mapVH.toFixed(2)}`);
  computeLabels();
  if (ui.mapFocus && LABELS && LABELS[ui.mapFocus]){
    const L = LABELS[ui.mapFocus], k = clamp(Math.min(w/(L.w*5), ui.mapVH/(L.h*5)), 1, 4);
    ui.map = {k, x: w*0.36 - L.x*k, y: ui.mapVH/2 - L.y*k};
  }
  ui.mapFocus = null;
  mapApply();
  attachLabels();
  const toView = (cx, cy) => { const r = svg.getBoundingClientRect(); return [(cx - r.left)/r.width*w, (cy - r.top)/r.height*mapVH()]; };
  const pts = new Map(); let moved = false, start = null, pinch = null;
  svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = false; start = [e.clientX, e.clientY];
    if (pts.size === 2){ const [a,b] = [...pts.values()]; pinch = {d: Math.hypot(a[0]-b[0], a[1]-b[1]), k: ui.map.k}; } });
  svg.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1){
      const r = svg.getBoundingClientRect(), s = w / r.width;
      ui.map.x += (e.clientX - prev[0])*s; ui.map.y += (e.clientY - prev[1])*s;
      if (Math.hypot(e.clientX-start[0], e.clientY-start[1]) > 4) moved = true;
      mapApply();
    } else if (pts.size === 2 && pinch){
      const [a,b] = [...pts.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
      const [vx,vy] = toView((a[0]+b[0])/2, (a[1]+b[1])/2);
      mapZoomAt(vx, vy, (pinch.k * d/pinch.d) / ui.map.k); moved = true;
    }
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (!moved && e.type==="pointerup"){ const el = document.elementFromPoint(e.clientX, e.clientY); const p = el && el.closest("path[data-iso]"); if (p){ ghostUntil = performance.now() + 450; ui.mapSel = p.dataset.iso; ui.cardHidden = false; render(); } } };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  svg.addEventListener("wheel", e => { e.preventDefault(); const [vx,vy] = toView(e.clientX, e.clientY); mapZoomAt(vx, vy, e.deltaY < 0 ? 1.2 : 1/1.2); }, {passive:false});
}
