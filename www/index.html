/* ================= Macroeconomics: social obligations, debt, central bank, inflation, unemployment ================= */
// rich countries: low neutral rate and inflation; poor: higher; trend growth converges (poor grow faster)
function devGap(){ return Math.max(0, 1 - gdppc()/45); }
function neutralRate(){ return 2 + 6*Math.max(0, 1 - gdppc()/40); }
function baseInfl(){ return 2 + 5*Math.max(0, 1 - gdppc()/40); }
function baseUnemp(){ return S.u0 || 6; }
function trendGrowthYear(){ return 0.014 + 0.04*devGap()*devGap(); }   // KG ~4,9%, RU ~2,3%, DE/US ~1,2%
function macroInit(s){
  const keep = S; S = s;
  s.cb = Math.round(neutralRate()*2)/2; s.infl = baseInfl(); s.print = 0; s.pens = 100; s.wages = 100;
  s.u0 = Math.round((4 + 5*devGap() + (hashIso(s.player)%5 - 2)*0.6)*10)/10; s.unemp = s.u0;
  S = keep;
}
function pensionCost(){ return me().gdp/12 * (0.022 + 0.018*Math.min(1, gdppc()/40)) * S.pens/100; }
function wageCost(){ return me().gdp/12 * 0.015 * S.wages/100; }
function debtRate(){ const d = S.debt/me().gdp; return clamp(0.02 + 0.35*S.cb/100 + Math.max(0, d - 0.6)*0.08 + (me().worldSanctions > 0 ? 0.02 : 0), 0.01, 0.35) * clamp(1 - 0.02*minDelta("finance"), 0.6, 1.3); }
function printIncome(){ return me().gdp/12 * 0.005 * (S.print||0); }
function inflTarget(b){
  const gdpM = me().gdp/12, def = b ? Math.max(0, -(b.net)/gdpM*100/12*12) : 0;   // deficit, % of GDP per year
  return clamp(baseInfl() + 0.25*def + 4*(S.print||0) + 3*S.wars.length - 0.9*(S.cb - neutralRate()) + 0.06*(S.pens - 100) + 0.04*(S.wages - 100)
    + (Object.values(C()).some(x => x.sanctionsUs) ? 1.5 : 0) + (powerBalance() < 0 ? 1 : 0), -1, 120);
}
function unempTarget(){
  return clamp(baseUnemp() + 0.4*(S.cb - neutralRate()) - 0.04*(S.wages - 100) - 0.02*Math.min(60, objCount("factory") + objCount("chem") + objCount("auto") + objCount("chips"))*5
    - (S.progs || []).length*0.15 + (deficits() > 1 ? 1 : 0), 1, 40);
}
function macroApproval(){ return -Math.max(0, S.infl - 5)*0.35 - Math.max(0, S.unemp - baseUnemp())*0.6 + Math.max(0, baseUnemp() - S.unemp)*0.3 + (S.pens - 100)*0.08 + (S.wages - 100)*0.04; }
function macroStab(){ return -Math.max(0, S.infl - 15)*0.3 - Math.max(0, S.unemp - 10)*0.5; }
function macroGrowth(){ return -Math.max(0, S.infl - 8)*0.00008 - (S.cb - neutralRate())*0.00007 - Math.max(0, S.unemp - 15)*0.00005; }
function macroMonth(b){
  S.infl += (inflTarget(b) - S.infl)*0.15 + rnd(-0.15, 0.15);
  S.unemp += (unempTarget() - S.unemp)*0.12 + rnd(-0.05, 0.05);
  // inflation erodes the real value of debt and of cash in the treasury
  const k = Math.max(0, S.infl)/1200;
  S.debt *= 1 - k*0.8; S.treasury *= 1 - k*0.3;
  if (S.infl > 40 && !S.flags.hyper){ S.flags.hyper = true; addLog("Гиперинфляция: цены растут на глазах, люди скупают доллары."); advise("econ", `Инфляция ${pct(S.infl)} в год! Поднимите ставку ЦБ и остановите печатный станок.`, {tab:"economy"}); }
  if (S.infl < 20) S.flags.hyper = false;
}

/* ---------- view ---------- */
function facEffectText(id){
  const F = FAC[id];
  if (F.mil){
    if (F.mil === "train") return `мощь армии +${(1.5*Math.min(10, facCount(id))).toFixed(1).replace(".",",")}%`;
    if (F.mil === "supply") return `расход боеприпасов −${3*Math.min(10, facCount(id))}%`;
    const cap = facCount(id)*MIL_CAP[F.mil], load = milLoad(F.mil);
    if (F.mil === "ammo") return load > cap ? `<span class="down">склады переполнены: портится ${money(load-cap)}</span>` : `занято ${money(load)} из ${money(cap)}`;
    const unit = F.mil === "troops" ? "тыс. военных" : F.mil === "ground" ? "машин" : "машин";
    return load > cap ? `<span class="down">не хватает мест: ${fmtN(load)} при ${fmtN(cap)} ${unit} — армия слабее</span>` : `занято ${fmtN(load)} из ${fmtN(cap)} ${unit}`;
  }
  const r = facR(id), parts = [];
  const L = {appr:"рейтинг", stab:"стабильность", growth:"рост", rp:"ОИ", tax:"налоги", pop:"население", tour:"туризм"};
  for (const k in F.fx){ const v = F.fx[k]*r*2; if (Math.abs(v) < 1e-9) continue; parts.push(k === "growth" ? `${L[k]} ${v>=0?"+":"−"}${Math.abs(v*1200).toFixed(2).replace(".",",")}%/год` : k === "pop" ? `${L[k]} ${v>=0?"+":"−"}${Math.abs(v*1200).toFixed(2).replace(".",",")}%/год` : k === "tax" || k === "tour" ? `${L[k]} ${v>=0?"+":"−"}${Math.abs(v*100).toFixed(1).replace(".",",")}%` : `${L[k]} ${v>=0?"+":"−"}${Math.abs(v).toFixed(1).replace(".",",")}`); }
  return parts.length ? `<span class="${r>0.005?"up":r<-0.005?"down":"muted"}">${parts.join(", ")}</span>` : `<span class="muted">как обычно</span>`;
}
function facCard(id){
  const F = FAC[id], n = facCount(id), prog = S.progs.find(p => p.id === id), chk = facCanStart(id), need = facNeed(id);
  const base = F.mil ? 1 : ((S.facBase && S.facBase[id]) || 1), cov = F.mil && !MIL_CAP[F.mil] ? null : facCov(id)/base, normN = need*base;
  return `<div class="fcard ${prog ? "busy" : ""}">
    <div class="f-ic">${isoIcon(F.look, 74)}</div>
    <div class="f-body">
      <div class="row"><b>${F.name}</b><span class="f-n num">${fmtN(id === "house" ? facGood(id) : n)}</span></div>
      ${cov !== null ? `<div class="bar ${cov < 0.9 ? "low" : cov < 0.995 ? "mid" : "high"}"><i style="width:${Math.min(100, cov*100).toFixed(0)}%"></i></div>
        <small class="muted">${F.mil ? "" : `норма ${fmtN(normN)} · `}обеспеченность ${Math.round(cov*100)}%</small>` : `<small class="muted">${F.desc}</small>`}
      ${F.mil && cov !== null ? `<small class="muted">${F.desc}</small>` : ""}
      <small>${facEffectText(id)}</small>
      ${prog ? `<div class="f-prog"><div class="bar"><i style="width:${((1 - prog.left/prog.total)*100).toFixed(1)}%"></i></div><small class="muted">+${fmtN(prog.n)} · ещё ${Math.ceil(prog.left)} дн.</small></div>`
        : `<button class="btn ${chk.ok ? "primary" : ""} sm" data-prog="${id}" ${chk.ok ? "" : "disabled"} title="${chk.ok ? "" : chk.why}">+${fmtN(facProgN(id))} · ${money(facProgCost(id))} · ${Object.entries(facProgMat(id)).map(([r,q]) => `${ic(r,"sm")}${fmtQ(q)}`).join(" ")} · ${facProgDays(id)} дн.</button>${chk.ok ? "" : `<small class="down">${chk.why}</small>`}`}
    </div></div>`;
}
function viewFacilities(){
  const cat = S.facCat || "edu", total = Object.keys(FAC).reduce((a,id)=>a + (FAC[id].mil ? 0 : facCount(id)), 0);
  const renov = cat === "housing" ? (() => { const bad = S.facBad||0, prog = S.progs.find(p => p.id === "renov"), chk = facCanStart("renov"), share = bad/Math.max(1, facCount("house"));
    return `<div class="fcard bad"><div class="f-ic">${isoIcon("renov", 74)}</div><div class="f-body">
      <div class="row"><b>Аварийное жильё</b><span class="f-n num down">${fmtN(bad)}</span></div>
      <small class="muted">${pct(share*100,1)} домов в аварийном состоянии — каждый месяц их становится больше. Это бьёт по рейтингу.</small>
      ${prog ? `<div class="f-prog"><div class="bar"><i style="width:${((1 - prog.left/prog.total)*100).toFixed(1)}%"></i></div><small class="muted">расселяем ${fmtN(prog.n)} · ещё ${Math.ceil(prog.left)} дн.</small></div>`
        : bad >= 1 ? `<button class="btn ${chk.ok?"primary":""} sm" data-prog="renov" ${chk.ok?"":"disabled"}>Расселить ${fmtN(facProgN("renov"))} · ${money(facProgCost("renov"))}</button>${chk.ok ? "" : `<small class="down">${chk.why}</small>`}` : ""}
    </div></div>`; })() : "";
  return `<div class="panel fac-head">
      <div class="row"><h3>Объекты по стране</h3><span class="num muted">Госпрограмм: ${S.progs.length} / ${maxProgs()}</span></div>
      ${S.progs.length ? `<div class="bstats">${S.progs.map(p => `<span>${p.id === "renov" ? "Расселение" : FAC[p.id].name} +${fmtN(p.n)} <b class="num">${Math.ceil(p.left)} дн.</b></span>`).join("")}</div>` : ""}
      <div class="label">Норма растёт вместе с населением, а здания стареют. Выше нормы — бонусы, ниже — штрафы. Строят госпрограммы: целая партия сразу. Больше программ одновременно — выше финансирование Минстроя.</div>
    </div>
    <div class="filters fac-cats">${FAC_CATS.map(([id,n,icn]) => `<button class="chip" data-faccat="${id}" aria-pressed="${cat===id}">${ic(icn,"sm")}${n}</button>`).join("")}</div>
    <div class="fac-grid">${renov}${Object.keys(FAC).filter(id => FAC[id].cat === cat).map(facCard).join("")}</div>`;
}

function facCatCov(cat){
  if (cat === "defense") return (milFactor("troops") + milFactor("ground") + milFactor("air"))/3;
  const ids = Object.keys(FAC).filter(id => FAC[id].cat === cat); return ids.reduce((a,id)=>a + Math.min(1.5, facCov(id)/((S.facBase && S.facBase[id]) || 1)), 0)/ids.length;
}

const WEEKDAYS = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
function weekday(){ return WEEKDAYS[new Date(S.year, S.month, S.day || 1).getDay()]; }
function kpiDelta(kind){
  const L = S.last && S.last.d; const f1 = v => (v >= 0 ? "▲ +" : "▼ −") + Math.abs(v).toFixed(Math.abs(v) < 10 ? 1 : 0).replace(".", ",");
  let v = null, t = "";
  if (kind === "treasury" && L){ const prev = S.treasury - L.treasury; if (Math.abs(prev) > 1e-9){ v = L.treasury/Math.abs(prev)*100; t = f1(v) + "%"; } }
  else if (kind === "approval" && L){ v = L.approval; t = f1(v); }
  else if (kind === "stability" && L){ v = L.stability; t = f1(v); }
  else if (kind === "rp"){ v = rpMonthly(); t = "▲ +" + Math.round(v) + " в мес."; }
  else if (kind === "net"){ v = growthMonthly()*1200; t = f1(v) + "%/год"; }
  else if (kind === "gdp" && L){ v = L.gdp/Math.max(1e-9, me().gdp - L.gdp)*1200; t = f1(v) + "%/год"; }
  return t ? `<small class="kd ${v >= 0 ? "up" : "down"}">${t}</small>` : `<small class="kd muted">—</small>`;

function netLvl(iso){ return (S.net && S.net[iso]) || 0; }
function ciLevel(){ return clamp(S.intel.level*0.22 + 0.03*minDelta("security") + ((S.ciBoost||0) > 0 ? 0.2 : 0), 0, 0.9); }
function netCost(){ return improveCost()*0.5; }
function netGrow(iso){
  const x = C()[iso]; if (!x || x.owner) return;
  if (netLvl(iso) >= 5) return toast("Сеть уже максимальная.");
  if (S.intel.pts < 2 || S.treasury < netCost()) return toast("Не хватает агентов или денег.");
  S.intel.pts -= 2; S.treasury -= netCost(); if (!S.net) S.net = {};
  if (Math.random() < 0.85 - 0.04*x.tech){ S.net[iso] = netLvl(iso) + 1; addLog(`Агентурная сеть в стране ${x.name} расширена до уровня ${S.net[iso]}.`); }
  else { x.rel = clamp(x.rel - 8, -100, 100); addLog(`Вербовка в стране ${x.name} сорвалась: связной задержан, отношения −8.`); }
  save(); render();
}
function intelReport(iso){
  const x = C()[iso], n = netLvl(iso); if (!x) return "";
  if (!n) return `<p class="muted" style="margin:0">Агентуры в этой стране нет — данные только из открытых источников. Расширьте сеть, чтобы видеть больше.</p>`;
  const err = [0.5, 0.3, 0.2, 0.12, 0.06, 0.02][n], est = v => { const h = (hashIso(iso + S.turn) % 100)/100 - 0.5; return v*(1 + h*err*2); };
  const intent = x.rel < -65 && aiPower(x) > myPower()*1.3 ? ["down","может напасть: настроены враждебно и сильнее нас"] : x.rel < -40 ? ["warn","враждебны, но к войне не готовы"] : x.rel > 40 ? ["up","настроены дружественно"] : ["muted","угрозы не видно"];
  return `<div class="bstats"><span>Мощь армии ≈ <b class="num">${Math.round(est(aiPower(x))).toLocaleString("ru-RU")}</b></span><span>Личный состав ≈ <b class="num">${troops(est(x.army))}</b></span><span>Технологии <b class="num">${x.tech}/5</b></span><span>ВВП ≈ <b class="num">${money(est(x.gdp))}</b></span></div>
    <div class="row"><span>Намерения</span><span class="${intent[0]}">${intent[1]}</span></div>
    ${n >= 3 ? `<div class="row"><span>Отношение их руководства к нам</span><span class="num">${x.rel > 0 ? "+" : ""}${Math.round(x.rel)}</span></div>` : ""}
    ${n >= 4 ? `<div class="row"><span>Их санкции</span><span>${x.sanctionsUs ? "действуют против нас" : "нет"}</span></div>` : ""}
    <small class="muted">Точность данных ±${Math.round(err*100)}%: чем сильнее сеть, тем точнее.</small>`;
}
function intelMonth(){
  if ((S.ciBoost||0) > 0) S.ciBoost--;
  Object.keys(S.net||{}).forEach(iso => { const x = C()[iso];
    if (!x || x.owner){ delete S.net[iso]; return; }
    S.rp += S.net[iso] >= 2 ? 0.4*S.net[iso]*x.tech : 0;
    if (Math.random() < 0.015*x.tech){ S.net[iso] = Math.max(0, S.net[iso] - 1); addLog(`Контрразведка страны ${x.name} вскрыла часть нашей сети: уровень ${S.net[iso]}.`); if (!S.net[iso]) delete S.net[iso]; } });
  // foreign espionage against us
  Object.values(C()).forEach(x => {
    if (x.owner || x.rel > -25 || (x.expelled||0) > 0){ if (x.expelled > 0) x.expelled--; return; }
    if (Math.random() < 0.02*S.aggr){
      if (Math.random() < ciLevel()){ (S.ciLog = S.ciLog || []).unshift({d:dateStr(), iso:x.id, caught:true}); addLog(`Контрразведка раскрыла шпионов страны ${x.name}.`); advise("intel", `Мы взяли шпионскую сеть страны ${x.name}. Можно выслать их дипломатов — во вкладке «Контрразведка».`, {tab:"intel"}); }
      else { const v = Math.round(5 + x.tech*3); S.rp = Math.max(0, S.rp - v); (S.ciLog = S.ciLog || []).unshift({d:dateStr(), iso:x.id, caught:false, rp:v}); addLog(`Утечка: агенты страны ${x.name} похитили наши разработки (−${v} ОИ).`); }
      S.ciLog = S.ciLog.slice(0, 8);
    }
  });
}
function expel(iso){

}

}

  const tabs = `<div class="filters gov-tabs">${[["net","Агентура","users"],["rep","Разведка","intel"],["ops","Операции","alert"],["ci","Контрразведка","stability"]].map(([t,l,i]) => `<button class="chip" data-itab="${t}" aria-pressed="${tab===t}">${ic(i,"sm")}${l}</button>`).join("")}</div>`;
  const pickT = `<select class="select" data-inteltarget aria-label="Страна">${targets.map(c=>`<option value="${c.id}" ${c.id===ui.intelTarget?"selected":""}>${esc(c.name)}${netLvl(c.id) ? ` · сеть ${netLvl(c.id)}` : ""}</option>`).join("")}</select>`;
  let body = "";
  if (tab === "net"){
    const nets = Object.entries(S.net||{}).filter(([i]) => C()[i]).sort((a,b) => b[1]-a[1]);
    body = `<div class="panel"><div class="row">${pickT}<button class="btn primary" data-netgrow="${ui.intelTarget}" ${S.intel.pts < 2 || S.treasury < netCost() || netLvl(ui.intelTarget) >= 5 ? "disabled" : ""}>Расширить сеть · 2 агента · ${money(netCost())}</button></div>
      <div class="label">Сеть в стране (до 5 уровней) повышает успех операций на 6% за уровень, даёт точную разведку, а с уровня 2 — донесения: очки исследований каждый месяц. Развитые страны чаще вскрывают чужих агентов.</div>
      ${nets.length ? nets.map(([i, l]) => `<div class="row net-row"><span>${flag(i)} ${esc(C()[i].name)}</span><span class="net-dots">${[1,2,3,4,5].map(k => `<i class="${k <= l ? "on" : ""}"></i>`).join("")}</span><button class="btn sm" data-ctry="${i}" data-ctabgo="intel">Открыть ›</button></div>`).join("") : `<p class="muted" style="margin:0">Агентурных сетей пока нет.</p>`}</div>`;
  } else if (tab === "rep"){
    body = `<div class="panel"><div class="row">${pickT}<span class="num muted">сеть ${netLvl(ui.intelTarget)}/5</span></div>${x ? `<h3>${flag(x.id)} ${esc(x.name)}: разведсводка</h3>${intelReport(x.id)}` : ""}</div>`;
  } else if (tab === "ops"){
    body = `<div class="panel"><div class="row">${pickT}<span class="num muted">сеть ${netLvl(ui.intelTarget)}/5 · +${netLvl(ui.intelTarget)*6}% к успеху</span></div><div class="label">Провал раскрывается в половине случаев: отношения с целью −25 и скандал дома.</div></div>${x ? opCards(x) : ""}`;
  } else {
    const hostile = Object.values(C()).filter(c => !c.owner && c.rel <= -25).sort((a,b) => a.rel - b.rel);
    body = `<div class="panel"><div class="row"><h3>Контрразведка: ${Math.round(ciLevel()*100)}%</h3><button class="btn" data-ciboost ${(S.ciBoost||0) > 0 || S.treasury < improveCost() ? "disabled" : ""}>${(S.ciBoost||0) > 0 ? `Проверка идёт: ${S.ciBoost} мес.` : `Проверка госаппарата · ${money(improveCost())}`}</button></div>
      <div class="label">Шанс поймать чужих агентов. Растёт от финансирования спецслужб и Службы безопасности (Власть → Министерства). Враждебные страны (отношения ниже −25) пытаются красть наши разработки.</div>
      ${hostile.length ? hostile.map(c => `<div class="row net-row"><span>${flag(c.id)} ${esc(c.name)} <small class="muted">${Math.round(c.rel)}</small></span>${(c.expelled||0) > 0 ? `<span class="pill state">дипломаты высланы: ${c.expelled} мес.</span>` : `<button class="btn sm" data-expel="${c.id}">Выслать дипломатов</button>`}</div>`).join("") : `<p class="muted" style="margin:0">Враждебных разведок не видно.</p>`}
      ${(S.ciLog||[]).length ? `<h3>Последние случаи</h3>${S.ciLog.map(e => `<div class="row"><small class="muted">${e.d}</small><small class="${e.caught ? "up" : "down"}">${e.caught ? "раскрыты агенты" : `утечка −${e.rp} ОИ`} · ${esc(partnerName(e.iso))}</small></div>`).join("")}` : ""}</div>`;
  }
  return head + tabs + body;
}

function viewIdeology(){
  const parl = parliament();
  return `<div class="panel" style="grid-column:1/-1">
    <h3>Идеология и парламент</h3>
    <div class="parl">${parl.map(([n,v,mine],i)=>`<span style="width:${v}%" class="p${i} ${mine?"mine":""}" title="${esc(n)} ${Math.round(v)}%"></span>`).join("")}</div>
    <div class="parl-legend">${parl.map(([n,v,mine],i)=>`<span><i class="p${i}"></i>${esc(n)} <span class="num">${Math.round(v)}%</span></span>`).join("")}</div>
    <div class="label">${majority() ? "У вашей партии большинство: законы проходят свободно." : "Нет большинства: каждый закон стоит −2 рейтинга на уступки коалиции."}</div>
    <div class="ideo-grid">${IDEOLOGIES.map(i=>`<button class="ideo ${ideo(i.id)?"on":""}" data-ideology="${i.id}" ${ideo(i.id)||S.ideoCd>0?"disabled":""}><b>${i.name}</b><small>${i.desc}</small>${ideo(i.id)?`<span class="pill good">Сейчас</span>`:""}</button>`).join("")}</div>
    <div class="label">${S.ideoCd>0 ? `Сменить идеологию можно через ${S.ideoCd} мес.` : "Смена идеологии: стабильность −20 и рейтинг −5 на полгода, следующая смена через 2 года."}</div>
  </div>`;
}

function viewCouncil(){
  const K = S.council, r = K.res;
  const targets = Object.values(C()).filter(x=>!x.owner).sort((a,b)=>a.name.localeCompare(b.name,"ru"));
  if (!ui.propTarget || !C()[ui.propTarget] || C()[ui.propTarget].owner) ui.propTarget = targets[0] && targets[0].id;
  return `<div class="panel">
    <div class="row"><h3>Совет Безопасности ООН</h3>${Object.keys(K.banned).length ? `<span class="label">Запрещено нападать: ${Object.keys(K.banned).map(id=>esc(C()[id].name)).join(", ")}</span>` : ""}</div>
    ${r ? `<div class="resolution">
        <span class="stamp">Голосование через ${r.left} мес. · ${r.proposer==="player"?"ваша инициатива":"инициатива совета"}</span>
        <b>${esc(resName(r))}</b>
        <small class="muted">${esc(RES_TYPES[r.type].desc.replace("{X}", r.target===S.player?"вас":(r.target?C()[r.target].name:"")))}</small>
        <div class="seg" role="group" aria-label="Ваш голос">${[["yes","За"],["abstain","Воздержаться"],["no","Против"]].map(([v,l])=>`<button data-vote="${v}" aria-pressed="${(r.myVote||"abstain")===v}">${l}</button>`).join("")}</div>
        <small class="muted">Ваш голос считается за два. Союзники и друзья (отношения выше +50) голосуют вместе с вами.</small>
      </div>`
      : `<p class="muted" style="margin:0">Сейчас голосований нет. Следующая сессия примерно через ${K.next} мес.</p>
        <div class="row"><select class="select" data-proptarget aria-label="Цель санкций">${targets.map(c=>`<option value="${c.id}" ${c.id===ui.propTarget?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
        <button class="btn" data-propose ${K.propCd>0||S.treasury<improveCost()*2?"disabled":""}>${K.propCd>0?`Через ${K.propCd} мес.`:`Предложить санкции · ${money(improveCost()*2)}`}</button></div>`}
  </div>`;
}

function viewAchievements(compact){
  const got = achCache || (achCache = achGet());
  const n = ACHIEVEMENTS.filter(a=>got[a.id]).length;
  return `<div class="panel" ${compact?"":'style="grid-column:1/-1"'}>
    <div class="row"><h3>${ic("trophy","sm")} Достижения</h3><span class="num">${n} / ${ACHIEVEMENTS.length}</span></div>
    <div class="ach-grid">${ACHIEVEMENTS.map(a=>`<div class="ach ${got[a.id]?"on":""}"><b>${a.name}</b><small>${a.desc}</small></div>`).join("")}</div>
  </div>`;
}

function showUnitInfo(id){

  else if (a){ stats = `<div class="ui-stats"><span><small>Цена партии</small><b class="num">${money(a.price*a.batch)}</b></span><span><small>Партия</small><b class="num">${a.batch.toLocaleString("ru-RU")} ${a.unit}</b></span><span><small>На складе</small><b class="num">${Math.floor(S.ammo[id]||0).toLocaleString("ru-RU")} ${a.unit}</b></span></div>`; }

  </div></div>`;
}
function showCredits(){

  const lics = [...new Set(rows.map(([,x]) => x.lic).filter(Boolean))];
  modalRoot.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Источники фото"><div class="sheet credits">
    <h2>Источники фото</h2>
    <p class="muted">Фотографии техники используются по свободным лицензиям. Все изображения обрезаны и сжаты для игры. Часть изображений создана нейросетью; если за основу взято чужое фото, автор указан. Знаки различия на фото не означают одобрения игры кем-либо.</p>
    <div class="cr-list">${rows.map(([n,x]) => `<div class="cr-row"><b>${esc(n)}</b><small>${esc(x.lic ? `${x.by} — ${x.lic}` : x.by)}</small></div>`).join("")}</div>

    <button class="btn primary" data-close>Закрыть</button>

function fxGeom(a, b){ const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1, off = Math.min(70, len*0.22); return {a, b, c:{x: mx - dy/len*off, y: my + dx/len*off}}; }

    const L = LABELS[ui.mapFocus], k = clamp(Math.min(w/(L.w*5), ui.mapVH/(L.h*5)), 1, 4);

}

  if (inOrg(o.id)) return {ok:false, why:"вы уже участник"};
  const x = me();
  if (o.only && !o.only.includes(S.player)) return {ok:false, why:"только для стран региона"};
  if (o.regions && !o.regions.includes(x.region) && !(o.also||[]).includes(S.player)) return {ok:false, why:`только для региона: ${o.regions.join(", ")}`};
  if (o.rival && inOrg(o.rival)) return {ok:false, why:`несовместимо с членством в ${ORG_BY[o.rival].name}`};
  if (o.ideo && !ideo(o.ideo)) return {ok:false, why:"нужна демократия"};
  if (o.minGdp && x.gdp < o.minGdp) return {ok:false, why:`нужен ВВП от ${money(o.minGdp)}`};
  if (o.minOil && x.prof.oil < o.minOil) return {ok:false, why:"мало нефти"};
  const ms = orgMembers(o);
  if (ms.some(i => S.wars.some(w => w.enemy === i))) return {ok:false, why:"вы воюете с участником"};
  const avg = ms.length ? ms.reduce((a,i)=>a + C()[i].rel, 0)/ms.length : 100;
  if (avg < o.minRel) return {ok:false, why:`средние отношения с участниками ${Math.round(avg)}, нужно от +${o.minRel}`};
  if (S.orgCd && S.orgCd[o.id] > 0) return {ok:false, why:`повторная заявка через ${S.orgCd[o.id]} мес.`};

const DAILY_KEY = "president-daily-v1";
function dailyGet(){ try { return JSON.parse(localStorage.getItem(DAILY_KEY)) || {}; } catch(e){ return {}; } }
function dailySet(o){ try { localStorage.setItem(DAILY_KEY, JSON.stringify(o)); } catch(e){} }
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); };
function dailyState(){
  const d = dailyGet(), now = Date.now(), today = dayKey(now), yest = dayKey(now - 864e5);
  const ready = d.last !== today;
  const streak = d.last === today || d.last === yest ? (d.streak || 0) : 0;   // missed a day: start over
  const next = new Date(); next.setHours(24, 0, 0, 0);
  return {ready, streak, day: ready ? (streak % 7) + 1 : ((streak - 1) % 7) + 1, msLeft: next - now};
}

];

const PAPER_RULES = [
  [/объявила вам войну|объявили войну/i, 10, "Война"], [/Мир с|мирн|капитуляц/i, 9, "Мир"], [/переворот|к власти пришла/i, 9, "Политика"],
  [/санкци/i, 7, "Санкции"], [/вступила в организацию|исключена из организации|вышла из организации/i, 7, "Мир"], [/ракетный удар|ядерн/i, 9, "Безопасность"],
  [/закон|Принят|Отменён/i, 5, "Власть"], [/Построено|Госпрограмма завершена|Расселено/i, 4, "Стройка"], [/союз|пакт|посольство|визит/i, 5, "Дипломатия"],
  [/Назначен|министр/i, 4, "Правительство"], [/кредит|Инвестиции|помощь/i, 3, "Экономика"], [/шпион|контрразведк|агент|разработки/i, 5, "Спецслужбы"],
  [/Подписано торговое|контракт|продажа|закупк/i, 3, "Торговля"]
];
function paperScore(text){ for (const [re, w, rub] of PAPER_RULES) if (re.test(text)) return [w, rub]; return [1, "Новости"]; }
function makeIssue(before){
  const c = me(), n = Math.min(60, (S.logN || 0) - (S.issueMark || 0)), lines = S.log.slice(0, n).map(l => l.text).filter(t => !/Ежедневный подарок/.test(t));
  S.issueMark = S.logN || 0;
  const scored = lines.map(t => { const [w, rub] = paperScore(t); return {t, w, rub}; }).sort((a,b) => b.w - a.w);
  const g = (c.gdp/before.gdp - 1)*100, apd = S.approval - before.approval;
  const lead = scored[0] && scored[0].w >= 4 ? scored[0] : {t: g >= 0 ? `Экономика ${c.name.split(" ").map(genWord).join(" ")} выросла на ${pct(Math.abs(g)*12, 1)} в пересчёте на год` : `Экономика ${c.name.split(" ").map(genWord).join(" ")} замедляется: спад ${pct(Math.abs(g)*12, 1)} в год`, rub:"Экономика"};
  const others = scored.filter(x => x !== lead).slice(0, 4);
  const world = [];
  const growth = Object.values(C()).filter(x => !x.owner && x.id !== S.player && S.prevGdp && S.prevGdp[x.id]).map(x => [x, x.gdp/S.prevGdp[x.id] - 1]).sort((a,b) => b[1] - a[1]);
  if (growth[0]) world.push(`${growth[0][0].name} — лидер роста месяца: экономика +${pct(growth[0][1]*100, 2)}.`);
  const mk = Object.keys(COMMOD).filter(r => commodOpen(r)).map(r => { const h = S.mhist[r]; return [r, h.length > 1 ? h[h.length-1]/h[h.length-2] - 1 : 0]; }).sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]))[0];
  if (mk && Math.abs(mk[1]) > 0.01) world.push(`Биржа: ${COMMOD[mk[0]].name.toLowerCase()} ${mk[1] > 0 ? "дорожает" : "дешевеет"} на ${pct(Math.abs(mk[1])*100, 1)}.`);
  const hostile = Object.values(C()).filter(x => !x.owner && x.rel < -60).sort((a,b) => a.rel - b.rel)[0];
  if (hostile) world.push(`Аналитики: отношения с ${hostile.name} на грани — ${Math.round(hostile.rel)}.`);
  if (S.wars.length) world.push(`Фронт: ${S.wars.map(w => `${C()[w.enemy].name} — ${w.progress >= 0 ? "наше преимущество" : "противник давит"}`).join("; ")}.`);
  S.prevGdp = Object.fromEntries(Object.values(C()).map(x => [x.id, x.gdp]));
  const issue = {no: (S.issueNo = (S.issueNo || 0) + 1), date: `${MONTHS[(S.month+11)%12]} ${S.month === 0 ? S.year - 1 : S.year}`, lead, others, world,
    poll: {appr: Math.round(S.approval), d: apd, stab: Math.round(S.stability)}, read: false,
    money: {net: S.treasury - before.treasury, gdp: g}};
  S.papers = [issue, ...(S.papers || [])].slice(0, 6);
}
function genWord(w){
  if (w === w.toUpperCase()) return w;
  if (w === "Египет") return "Египта";
  return /ия$/.test(w) ? w.replace(/ия$/, "ии") : /ая$/.test(w) ? w.replace(/ая$/, "ой") : /ея$/.test(w) ? w.replace(/ея$/, "еи") : /[шкгжч]а$/.test(w) ? w.slice(0,-1) + "и"
    : /а$/.test(w) ? w.slice(0,-1) + "ы" : /ь$/.test(w) ? w.slice(0,-1) + "и" : /й$/.test(w) ? w.slice(0,-1) + "я" : /[бвгджзклмнпрстфхцчшщ]$/.test(w) ? w + "а" : w;
}

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && (el.dataset.cb !== undefined || el.dataset.pens !== undefined || el.dataset.wages !== undefined)){
    const k = el.dataset.cb !== undefined ? "cb" : el.dataset.pens !== undefined ? "pens" : "wages"; S[k] = +el.value;
    const lbl = document.querySelector(`[data-${k}v]`); if (lbl) lbl.textContent = (k === "cb" ? (+el.value).toFixed(1).replace(".",",") : el.value) + "%"; return; }
  if (el.dataset && el.dataset.musicvol !== undefined){ settings.musicVol = +el.value; settingsSave(); musicVolume(); const lbl = el.previousElementSibling; if (lbl) lbl.textContent = el.value + "%"; return; } if (!el.dataset || !el.dataset.tax) return;
  S.taxes[el.dataset.tax] = +el.value;
  const lbl = document.querySelector(`[data-taxv="${el.dataset.tax}"]`) || el.previousElementSibling; if (lbl) lbl.textContent = el.value + "%";
});
document.addEventListener("change", e => { const d = e.target.dataset || {}; if (d.tax || d.cb !== undefined || d.pens !== undefined || d.wages !== undefined){ save(); render(); } if (d.inteltarget !== undefined){ ui.intelTarget = e.target.value; render(); } if (d.proptarget !== undefined){ ui.propTarget = e.target.value; } });

function newGame(id){
  const scen = ui.scenario || "normal";
  const countries = {};
  COUNTRY_DATA.forEach(([cid,name,region,pop,gdp,army,prof]) => {
    const pc = gdp/pop;
    countries[cid] = { id:cid, name, region, pop, gdp, army, prof:{food:prof[0],oil:prof[1],metal:prof[2],power:prof[3]},
      tech: clamp(Math.round(1 + pc/40), 1, 3), rel:0, trade:false, ally:false, sanction:false, sanctionsUs:false, owner:null, improveCd:0 };
  });
  const mine = countries[id];
  Object.values(countries).forEach(c => { if (c.id===id) return; let r = rnd(-25,25);
    if (c.region===mine.region) r += 15; else if (ADJ[mine.region].includes(c.region)) r += 5; c.rel = Math.round(clamp(r,-60,60)); });
  mine.owner = "player";
  S = { countries, player:id, turn:0, year:2027, month:0,
    treasury: mine.gdp*0.05, debt: mine.gdp*0.4, approval:55, stability:60,
    taxes:{inc:13,corp:20,vat:12,exc:5,eco:2}, sectors:{health:1,edu:1,infra:1,police:1},
    laws:{}, buildings:{farm:0,oil:0,mine:0,power:0,factory:0}, queue:[], mods:[], wars:[], log:[],
    hist:{gdp:[mine.gdp], appr:[55]}, terms:0, electionIn:48, lowStab:0, topMonths:0, adCd:0, eventCd:3,
    annexBonus:{food:0,oil:0,metal:0,power:0}, gdp0:null, resV2:true, capital:{health:33,edu:33,infra:33,police:33}, research:{current:null, done:{}, prog:{}}, science:1, over:null, last:null, pendingEvent:null };
  migrate(S); S.scenario = scen;
  /* equal start: every country begins with the same monthly surplus (0,1% of GDP) */
  S.budFix = 0; { const m = mine.gdp/12, b = budget(); S.budFix = (0.012*m - b.net)/m; }
  if (scen==="zero"){ S.treasury = 0; S.debt = mine.gdp*0.9; S.approval = 40; S.stability = 45; }
  if (scen==="crisis"){ Object.values(countries).forEach(c=>c.gdp*=0.9); S.mods.push({stat:"growth",v:-0.003,left:12},{stat:"approval",v:-5,left:12}); }
  if (scen==="coldwar"){ S.aggr = 3; Object.values(countries).forEach(c=>{ if (c.id!==id) c.rel = Math.random()<0.5 ? -55 + rnd(-10,10) : 35 + rnd(-10,10); }); }
  if (scen==="lastchance"){ S.debt = mine.gdp*1.4; S.electionIn = 12; S.approval = 42; S.stability = 50; }
  S.gdp0 = mine.gdp;
  S.hist.appr = [S.approval];
  addLog(`Вы приняли присягу как глава государства ${mine.name}. Сценарий: «${SCENARIOS.find(s=>s.id===scen).name}». Выборы через ${S.electionIn} мес.`);
  ui.tab = "map"; ui.mapSel = null; ui.map = {k:1,x:0,y:null}; ui.mapFocus = id; ui.pins = null; ui.mapMode = "pol"; ui.speed = 0; pausedBy = null;
  save(); render();
  let tutSeen = false; try { tutSeen = !!localStorage.getItem(TUT_KEY); } catch(e){}
  if (!tutSeen) setTimeout(() => showTutorial(0), 350);
  else setTimeout(() => advise("sec", `Добро пожаловать в кабинет, господин президент. ${mine.name} ждёт ваших решений.`, {tab:null}), 400);
}

/* ---------- Native shell (Android app via Capacitor) ---------- */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (NATIVE){
  const NP = window.Capacitor.Plugins || {};
  document.documentElement.classList.add("native");
  try { NP.StatusBar && NP.StatusBar.hide(); } catch(e){}
  if (NP.App){
    NP.App.addListener("backButton", () => {
      if (document.getElementById("offline")) return;
      if (modalRoot.innerHTML){ const x = modalRoot.querySelector("[data-close],[data-close-offer]"); if (x) x.click(); return; }
      if (ui.more){ ui.more = false; render(); return; }
      if (S && S.countries && !S.over && ui.tab !== "map"){ ui.tab = "map"; render(); return; }
      if (NP.App.minimizeApp) NP.App.minimizeApp(); else NP.App.exitApp();
    });
    NP.App.addListener("pause", () => { pauseFor("hidden"); if (S) save(); });
  }
}
// the game requires an internet connection (ads, purchases, map): block the screen while offline
function netGate(){
  let el = document.getElementById("offline");
  if (navigator.onLine !== false){ if (el){ el.remove(); resumeAfter("offline"); } return; }
  if (el) return;
  el = document.createElement("div"); el.id = "offline"; el.className = "modal"; el.style.zIndex = 50;
  el.innerHTML = `<div class="sheet" style="align-items:center;text-align:center;max-width:420px"><span class="stamp">Нет сети</span><h2>Нужно подключение к интернету</h2><p class="muted" style="margin:0">Игра работает только онлайн. Включите мобильный интернет или Wi-Fi.</p><button class="btn primary" data-netretry>Проверить снова</button></div>`;
  document.body.appendChild(el); pauseFor("offline");
}
window.addEventListener("online", netGate); window.addEventListener("offline", netGate);
document.addEventListener("click", e => { if (e.target.closest("[data-netretry]")){ netGate(); if (!navigator.onLine) toast("Сети всё ещё нет."); } });

/* ---------- Boot ---------- */
if (load()) { ui.tab = "map"; ui.mapFocus = S.player; render(); if (S.pendingVictory) setTimeout(showVictory, 300); } else { S = null; renderStart(); }
netGate();
})();
