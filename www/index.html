const WIN_TOP = 8, RECORDS_KEY = "president-records-v1";
function friendShare(){ const a = Object.values(C()).filter(x => x.id !== S.player); return a.length ? a.filter(x => x.owner || x.puppet || x.ally || x.rel >= 50).length/a.length : 0; }
function techShare(){ const m = TECH.reduce((a, t) => a + (t.max||1), 0); return TECH.reduce((a, t) => a + tlv(t.id), 0)/m; }
function worldUnited(){ const a = Object.values(C()).filter(x => x.id !== S.player); return a.length > 0 && a.every(x => x.owner || x.puppet || x.union); }
function winDone(w){ const max = typeof w.max === "function" ? w.max() : w.max; return w.val() >= max && (!w.ok || w.ok()); }
function winCheck(){ S.wins = S.wins || {}; WINS.forEach(w => { if (S.wins[w.id] || !winDone(w)) return; S.wins[w.id] = {year:S.year, month:S.month}; (ui.winQ = ui.winQ || []).push(w.id); addLog(`🏆 ${w.name}: вы получили титул «${w.rank}».`); unlock("winner"); if (S.scenario==="zero" || S.scenario==="lastchance") unlock("hard"); });
  if ((ui.winQ||[]).length){ pauseFor("win"); setTimeout(showWin, 80); } }
function winScore(final){ const wins = Object.keys(S.wins||{}).length, a = Object.values(C()), own = a.filter(x => x.owner && x.id !== S.player).length, pup = a.filter(x => x.puppet || x.union).length, g = S.gdp0||me().gdp, k = g >= 2000 ? 1 : g >= 300 ? 1.5 : 2.5, y = clamp(1.5 - S.turn/12/80, 0.6, 1.5);
  return Math.round((1000*wins + 150*own + 80*pup + (final ? 3000 : 0))*k*y); }
function winBanner(stamp, title, rank, text, stats, btns){ return `<div class="modal" role="dialog" aria-modal="true"><div class="sheet win-banner"><div class="win-rays" aria-hidden="true"></div>
    <svg class="win-crown" viewBox="0 0 64 48" aria-hidden="true"><path d="M6 40 3 12l15 12L32 4l14 20 15-12-3 28z" fill="url(#g-win)" stroke="#6E4A10" stroke-width="2" stroke-linejoin="round"/><rect x="6" y="40" width="52" height="6" rx="2" fill="#B8862B"/><defs><linearGradient id="g-win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#D9A441"/></linearGradient></defs></svg>
    <span class="stamp">${stamp}</span><h2>${esc(title)}</h2>${rank ? `<div class="win-rank">${esc(rank)}</div>` : ""}<p>${esc(text)}</p><div class="win-stats">${stats}</div>${btns}</div></div>`; }
function winStats(final){ const a = Object.values(C()), own = a.filter(x => x.owner && x.id !== S.player).length, pup = a.filter(x => x.puppet || x.union).length, st = (n, v) => `<span><small>${n}</small><b class="num">${v}</b></span>`;
  return st("Лет у власти", Math.floor(S.turn/12)) + st("Присоединено", own) + st("Сателлиты", pup) + st("Побед", Object.keys(S.wins||{}).length) + st("Счёт", winScore(final).toLocaleString("ru-RU")); }
function showWin(){ if (!S || S.over) return; const q = ui.winQ || []; if (!q.length) return resumeAfter("win"); if (modalRoot.innerHTML){ setTimeout(showWin, 800); return; }
  const id = q.shift(), w = WINS.find(x => x.id === id); sfx("success"); save();
  modalRoot.innerHTML = winBanner("Поздравляем!", w.name, w.rank, w.text, winStats(false), `<div class="win-btns"><button class="btn primary" data-act="winon">Продолжить игру</button><button class="btn" data-act="winmenu">Главное меню</button></div><small class="muted">Осталась главная цель: объединить весь мир.</small>`); }
function winFinal(){ S.wins = S.wins || {}; const a = Object.values(C()), own = a.filter(x => x.owner && x.id !== S.player).length, pup = a.filter(x => x.puppet || x.union).length, all = WINS.every(w => S.wins[w.id]);
  const peace = (S.peaceJ || 0) + a.filter(x => x.union).length >= 0.7*(a.length - 1), rank = all ? "Легенда человечества" : peace ? "Объединитель народов" : pup > own ? "Мировой гегемон" : "Император Земли";
  S.overRank = rank; S.overScore = winScore(true); recordAdd(rank, S.overScore);
  endGame(true, "Вы объединили мир!", peace ? `Народы мира сами выбрали общее государство: ${S.peaceJ || 0} стран вошли в него на референдумах. История запомнит не завоевателя, а того, кто объединил людей без войны.` : pup > own ? `Весь мир признал вашу власть: ${own} стран присоединены, ${pup} управляются вашими людьми. Ни одно государство больше не спорит с ${me().name}.` : `Над всеми столицами мира поднят один флаг. Страна ${me().name} ${Math.floor(S.turn/12)} лет шла к этой цели и дошла.`); }
function recordsGet(){ try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || []; } catch(e){ return []; } }
function recordAdd(rank, score){ const r = recordsGet(); r.push({n:me().name, id:S.player, rank, score, years:Math.floor(S.turn/12), wins:Object.keys(S.wins||{}).length}); r.sort((a, b) => b.score - a.score); try { localStorage.setItem(RECORDS_KEY, JSON.stringify(r.slice(0, WIN_TOP))); } catch(e){} return r.findIndex(x => x.score === score) + 1; }
function recordsPanel(){ const r = recordsGet(); return r.length ? `<div class="panel"><h3>Рекорды</h3>${r.map((x, i) => `<div class="row"><span>${i + 1}. ${flag(x.id)} <b>${esc(x.n)}</b> · ${esc(x.rank)}<br><small class="muted">${x.years} лет, побед: ${x.wins}</small></span><span class="num">${x.score.toLocaleString("ru-RU")}</span></div>`).join("")}</div>` : ""; }
function endGame(win, title, text){
  ui.speed = 0;
  S.over = {win, title, text};
  if (win){ unlock("winner"); if (S.scenario==="zero" || S.scenario==="lastchance") unlock("hard"); }
  if (!win && Object.keys(S.wins||{}).length) recordAdd(`${Object.keys(S.wins).length} ${plural(Object.keys(S.wins).length, "победа", "победы", "побед")}, затем поражение`, winScore(false));
  storageDel();
  render();
  showEnd();
}

/* synthesized sound effects: no audio files needed */
let AC = null;
function sfx(kind){
  if (!settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime;
    const tone = (f, d, type, vol, when) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.setValueAtTime(f, t + (when||0)); g.gain.setValueAtTime(vol || 0.05, t + (when||0)); g.gain.exponentialRampToValueAtTime(0.0001, t + (when||0) + d); o.connect(g).connect(AC.destination); o.start(t + (when||0)); o.stop(t + (when||0) + d + 0.02); };
    if (kind === "tap") tone(620, 0.045, "triangle", 0.035);
    else if (kind === "open") { tone(392, 0.07, "sine", 0.04); tone(587, 0.1, "sine", 0.035, 0.05); }
    else if (kind === "notify") { tone(880, 0.1, "sine", 0.045); tone(1320, 0.16, "sine", 0.035, 0.09); }
    else if (kind === "alert") { tone(330, 0.16, "square", 0.025); tone(247, 0.24, "square", 0.025, 0.15); }
    else if (kind === "success") { tone(523, 0.09, "triangle", 0.05); tone(659, 0.09, "triangle", 0.05, 0.08); tone(784, 0.22, "triangle", 0.05, 0.16); }
    else if (kind === "boom") { const len = 0.9, buf = AC.createBuffer(1, AC.sampleRate*len, AC.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/d.length, 2.5); const src = AC.createBufferSource(), lp = AC.createBiquadFilter(), g = AC.createGain(); lp.type = "lowpass"; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(120, t + len); g.gain.value = 0.35; src.buffer = buf; src.connect(lp).connect(g).connect(AC.destination); src.start(t); tone(55, 0.6, "sine", 0.12); }
    else if (kind === "alarm") { [0, 0.5].forEach(o => { const os = AC.createOscillator(), g = AC.createGain(); os.type = "sawtooth"; os.frequency.setValueAtTime(520, t + o); os.frequency.linearRampToValueAtTime(880, t + o + 0.4); g.gain.setValueAtTime(0.0001, t + o); g.gain.exponentialRampToValueAtTime(0.03, t + o + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.45); os.connect(g).connect(AC.destination); os.start(t + o); os.stop(t + o + 0.5); }); }
    else if (kind === "cash") { [1318, 1568, 2093].forEach((f, i) => tone(f, 0.12, "triangle", 0.035, i*0.055)); tone(2637, 0.25, "sine", 0.02, 0.17); }
    else if (kind === "cargo") { tone(140, 0.12, "sine", 0.07); tone(220, 0.1, "triangle", 0.03, 0.04); }
    else if (kind === "approach") { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(760, t + 0.45); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.03, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.52); }
    else if (kind === "coin") { tone(1046, 0.06, "square", 0.025); tone(1568, 0.14, "square", 0.02, 0.05); }
  } catch(e){}
}

/* advisor messages: inbox + one notification card at a time */
const advRoot = document.createElement("div"); advRoot.id = "adv-root"; document.body.appendChild(advRoot);
let advQueue = [], advShown = null, advTimer = 0;
function advise(who, text, o){
  o = o || {};
  if (!S) return;
  S.advCd = S.advCd || {};
  if (o.key){ if (S.advCd[o.key] > 0) return; S.advCd[o.key] = o.cd == null ? 6 : o.cd; }
  const m = {who, text, tab:o.tab||null, mood:o.mood||null, lesson:o.lesson||null, t:dateStr(), read:false};
  S.inbox = [m, ...(S.inbox||[])].slice(0, 40);
  advQueue.push(m); if (advQueue.length > 4) advQueue = advQueue.slice(-4);
  if (!advShown) showNextAdvice();
}
function flushAdvice(){
  if (advShown && (ui.tab !== "map" || modalRoot.innerHTML)){ clearTimeout(advTimer); advQueue.unshift(advShown); advShown = null; advRoot.innerHTML = ""; return; }
  if (!advShown && advQueue.length && ui.tab === "map" && !modalRoot.innerHTML) setTimeout(showNextAdvice, 400); }
function showNextAdvice(){
  clearTimeout(advTimer);
  if (S && S.countries && (ui.tab !== "map" || modalRoot.innerHTML)){ advShown = null; advRoot.innerHTML = ""; return; }
  advShown = advQueue.shift() || null;
  if (!advShown || !document.body.classList.contains("in-game")){ advRoot.innerHTML = ""; advShown = null; return; }
  const m = advShown, a = ADVISORS[m.who];
  advRoot.innerHTML = `<div class="adv-card ${m.mood==="alert"?"alert":""}" role="status">
    ${portrait(m.who, 52, m.mood)}
    <div class="adv-txt"><b>${a.name}</b><small>${a.role}</small><p>${esc(m.text)}</p></div>
    <div class="adv-btns">${m.lesson ? `<button class="btn primary" data-lesson="${m.lesson}">Показать</button>` : m.tab ? `<button class="btn primary" data-advgo="${m.tab}">Открыть</button>` : ""}<button class="adv-x" data-advx aria-label="Скрыть">${ic("close","sm")}</button></div>
  </div>`;
  m.read = true;
  sfx(m.mood === "alert" ? "alert" : "notify"); if (m.mood === "alert") buzz(60);

/* background music: a real track from music/ when bundled, otherwise generative ambient made with Web Audio */
const MUSIC_FILE = "music/theme.mp3";
const music = {on:false, mode:null, timer:0, next:0, step:0, audio:null, master:null, lp:null};
const musicGain = () => (settings.musicVol ?? 55) / 100;
function musicStart(){
  if (!settings.music || music.on || document.hidden) return;
  music.on = true;
  const a = new Audio(MUSIC_FILE); a.loop = true; a.volume = 0.55*musicGain(); a.preload = "auto";
  a.addEventListener("canplaythrough", () => { if (music.on && !music.mode){ music.mode = "file"; music.audio = a; a.play().catch(() => { music.mode = null; synthStart(); }); } }, {once:true});
  a.addEventListener("error", () => { if (music.on && !music.mode) synthStart(); }, {once:true});
  try { a.load(); } catch(e){ synthStart(); }
  setTimeout(() => { if (music.on && !music.mode) synthStart(); }, 1800);
}
function synthStart(){
  if (music.mode) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
    music.mode = "synth";
    music.master = AC.createGain(); music.master.gain.setValueAtTime(0.0001, AC.currentTime); music.master.connect(AC.destination);
    music.master.gain.exponentialRampToValueAtTime(0.5*musicGain() + 0.0001, AC.currentTime + 4);
    music.lp = AC.createBiquadFilter(); music.lp.type = "lowpass"; music.lp.frequency.value = 2200; music.lp.connect(music.master);
    const d = AC.createDelay(); d.delayTime.value = 0.34; const fb = AC.createGain(); fb.gain.value = 0.32; const wet = AC.createGain(); wet.gain.value = 0.3;
    music.lp.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(music.master);
    music.next = AC.currentTime + 0.15; music.step = 0;
    music.timer = setInterval(musicSchedule, 180);
  } catch(e){ music.mode = null; }
}
// warm, hopeful loop: Am – F – C – G with a soft bell arpeggio
const PROG = [[57,60,64],[53,57,60],[48,52,55],[55,59,62],[57,60,64],[53,57,60],[50,53,57],[52,55,59]];
const mtof = m => 440*Math.pow(2, (m-69)/12);
function mnote(f, t, dur, type, vol, attack){ const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(music.lp); o.start(t); o.stop(t + dur + 0.05); }
function musicSchedule(){
  if (!music.on || music.mode !== "synth") return;
  const beat = 60/72, half = beat/2;
  while (music.next < AC.currentTime + 0.7){
    const t = music.next, bar = Math.floor(music.step/8), chord = PROG[bar % PROG.length], pos = music.step % 8;
    if (pos === 0){
      chord.forEach(m => { mnote(mtof(m), t, beat*4.8, "triangle", 0.03, 1.4); mnote(mtof(m)*1.004, t, beat*4.8, "sine", 0.022, 1.8); });
      mnote(mtof(chord[0]-12), t, beat*4.2, "sine", 0.05, 0.3);
    }
    const pat = [0, null, 1, 2, null, 1, 2, null], pi = pat[pos];
    if (pi !== null && Math.random() < 0.8){ const m = chord[pi] + 12 + (Math.random() < 0.18 ? 12 : 0); mnote(mtof(m), t, beat*2.4, "sine", 0.026, 0.008); mnote(mtof(m)*2, t, beat*0.9, "sine", 0.006, 0.005); }
    if (pos === 4) mnote(mtof(chord[0]-24), t, beat*1.2, "sine", 0.035, 0.03);
    music.next += half; music.step++;
  }
}
function musicStop(){
  music.on = false; clearInterval(music.timer);
  if (music.audio){ try { music.audio.pause(); } catch(e){} }
  if (music.master){ const m = music.master; try { m.gain.setTargetAtTime(0.0001, AC.currentTime, 0.35); } catch(e){} setTimeout(() => { try { m.disconnect(); } catch(e){} }, 1600); }

}
function musicVolume(){ const v = musicGain(); if (music.audio) music.audio.volume = 0.55*v; if (music.master) music.master.gain.setTargetAtTime(0.5*v + 0.0001, AC.currentTime, 0.2); }

// the first match fully in view; one hidden or cut off at the edge of a window is scrolled into view once
function tutTarget(sel){
  if (!sel) return null;
  const list = [...document.querySelectorAll(sel)].filter(el => { const r = el.getBoundingClientRect(); return r.width > 2 && r.height > 2 && getComputedStyle(el).visibility !== "hidden"; });
  const fixed = el => !!el.closest(".dock, .map-tools, .map-side, .topbar, .hud, header");
  const full = el => { const r = el.getBoundingClientRect(); return fixed(el) || (r.top >= 40 && r.bottom <= innerHeight - 64); };
  const part = el => { const r = el.getBoundingClientRect(); return r.bottom > 0 && r.top < innerHeight; };
  const vis = list.find(full); if (vis) return vis;
  if (list[0] && tutTarget.scrolled !== sel){ tutTarget.scrolled = sel; list[0].scrollIntoView({block:"center", behavior:"smooth"}); setTimeout(() => { tutLayer.dataset.key = ""; tutPaint(); }, 450); }
  return list.find(part) || null;
}

  const below = !r || r.top + r.height/2 < innerHeight/2, bw = Math.min(360, innerWidth - 24);
  const bx = r ? clamp(r.left + r.width/2 - bw/2, 12, innerWidth - bw - 12) : (innerWidth - bw)/2;
  const by = r ? (below ? Math.min(innerHeight - 150, r.bottom + pad + 12) : null) : 72;
  const pos = by != null ? `top:${by}px` : `bottom:${Math.max(12, innerHeight - r.top + pad + 12)}px`;
  const a = ADVISORS[who] || ADVISORS.sec;

}

/* ---------- Actions ---------- */
function act(name, arg){
  const c = me();
  switch(name){
    case "build": {
      const chk = canBuild(arg); if (!chk.ok) return toast("Нельзя построить: " + chk.why + ".");
      const b = BUILDINGS[arg], mat = b.mat || {}, days = buildDays(arg);
      S.treasury -= buildCost(arg); takeMat(mat);
      S.queue.push({type:arg, left:days, total:days});
      toast(`Начато строительство: ${b.name}`); break;
    }
    case "recruit": {
      const cost = recruitCost();
      if (c.army >= draftCap()) return toast("Призывной резерв исчерпан: армии не хватает людей.");
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; c.army += recruitAmount(); toast("Войска набраны."); break;
    }
    case "disband": c.army = Math.max(1, c.army*0.95); toast("Армия сокращена на 5%."); break;
    case "tech": {
      if (c.tech >= 5) return;
      const cost = techCost(); if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; c.tech++; toast(`Военные технологии: уровень ${c.tech}.`); break;
    }
    case "improve": {
      const t = C()[arg], cost = improveCost();
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; t.rel = clamp(t.rel + 12, -100, 100); t.improveCd = 3; infAdd(t, INF_BUMP.improve); toast(`Отношения с ${t.name} улучшены.`); break;
    }
    case "trade": { const t=C()[arg]; t.trade = !t.trade; if (t.trade) flashMap(t.id, "good"); addLog(t.trade ? `Подписано торговое соглашение с ${t.name}.` : `Торговое соглашение с ${t.name} расторгнуто.`); if(!t.trade) t.rel -= 10; break; }
    case "ally": { const t=C()[arg]; t.ally = !t.ally; addLog(t.ally ? `Заключён военный союз с ${t.name}.` : `Союз с ${t.name} расторгнут.`); if(!t.ally){ t.rel -= 20; t.union = false; if (S.refs) delete S.refs[arg]; } break; }
    case "sanction": {
      const t=C()[arg]; t.sanction = !t.sanction;
      if (t.sanction){ t.rel -= 30; t.trade = false; t.ally = false; addLog(`Вы ввели санкции против ${t.name}.`); if (Math.random()<0.6){ t.sanctionsUs = true; addLog(`${t.name} ответила зеркальными санкциями.`); } }
      else { t.rel += 10; addLog(`Санкции против ${t.name} сняты.`); }
      break;
    }
    case "war": {
      const t=C()[arg]; ui.warConfirm = null; orgOnAttack(t.id);
      if (t.nap){ t.nap = false; infamyAdd(10); Object.values(C()).forEach(x => { if (!x.owner && x.id !== t.id) x.rel -= 5; }); addLog(`Вы нарушили пакт о ненападении с ${t.name}. Мир больше не верит вашему слову.`); }
      t.emb = false;
      startWar(t.id, true); flashMap(t.id, "bad"); ui.hqWar = t.id;
      t.rel = -100; t.trade=false; t.ally=false;
      Object.values(C()).forEach(x => { if (!x.owner && x.id!==t.id){ x.rel -= x.region===t.region ? 12 : 4; if (x.ally && x.rel<30) x.ally=false; } });
      S.mods.push({stat:"approval",v:-5,left:3});
      if (S.council.banned[t.id]){ S.mods.push({stat:"approval",v:-15,left:12}); Object.values(C()).forEach(x=>{ if(!x.owner) x.rel -= 20; }); addLog(`Нападение на ${t.name} нарушает резолюцию Совета наций: весь мир осуждает вас.`); }
      addLog(`Вы объявили войну стране ${t.name}.`); infamyAdd(S.council.banned[t.id] ? 18 : 9);
      ui.tab = "hq"; sfx("alarm"); break;
    }
    case "peace": { showPeace(arg); return; }
    case "buyunit": { orderUnits(arg, KINDS[MODELS[arg].kind].batch); break; }
    case "sellunit": { const m = MODELS[arg], n = Math.min(S.units[arg]||0, KINDS[m.kind].batch); if (n < 1) return; S.units[arg] -= n; S.treasury += n*m.price*0.4; toast(`Списано и продано: ${m.name} ×${n}`); break; }
    case "buyammo": { orderAmmo(arg, AMMO[arg].batch); break; }
    case "prodset": { const [pid, id] = arg.split("|"); S.prod[pid] = S.prod[pid] === id ? null : id; S.prodAcc[pid] = 0; break; }
    case "prodexport": { S.prodExport[arg] = !S.prodExport[arg]; break; }
    case "rail": {
      const x = C()[arg], cost = railTotal();
      if (!railMatOk()) return toast(`Нужно ${fmtQ(RAIL_MAT.steel)} тыс. т стали и ${fmtQ(RAIL_MAT.wood)} тыс. т древесины на складе.`);
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; takeMat(RAIL_MAT); S.rails[arg] = {left:360, total:360, done:false}; x.rel = Math.min(100, x.rel+5);
      addLog(`Начато строительство железной дороги в страну ${x.name}.`); break;
    }
    case "sell": {
      const [r, frac] = arg.split(":"), want = Math.min(S.stock[r], niceQ(S.stock[r]*(+frac))), q = Math.min(want, expRoom(r));
      if (want < 1) return toast("На складе почти ничего нет.");
      if (q < 1) return toast("Предел экспорта на этот месяц исчерпан.");
      const sum = q*commodPrice(r); S.stock[r] -= q; S.treasury += sum; expUse(r, sum);
      toast(`Продано: ${COMMOD[r].name.toLowerCase()} ${fmtQ(q)} ${COMMOD[r].unit} за ${money(sum)}`); break;
    }
    case "buy": {
      const best = suppliers(arg)[0]; if (!best) return toast("Сейчас никто не продаёт этот товар.");
      orderGoods(best.iso, arg, COMMOD[arg].buy); break;
    }
    case "autosell": S.autoSell[arg] = !S.autoSell[arg]; break;
    case "pimprove": {
      const p = partner(arg), cost = improveCost()*0.5;
      if (S.treasury < cost || p.improveCd > 0) return;
      S.treasury -= cost; p.rel = clamp(p.rel + 12, -100, 100); p.improveCd = 3; toast(`Отношения с ${shortName(arg)} улучшены.`); break;
    }
    case "ptrade": { const p = partner(arg); p.trade = !p.trade; if (!p.trade) p.rel -= 8; addLog(p.trade ? `Подписано торговое соглашение с ${shortName(arg)}.` : `Торговое соглашение с ${shortName(arg)} расторгнуто.`); break; }
    case "scipact": { const t = C()[arg]; t.sci = !t.sci; addLog(t.sci ? `Подписан договор о научном сотрудничестве с ${t.name}.` : `Научный союз с ${t.name} расторгнут.`); if (!t.sci) t.rel -= 5; break; }
    case "import": {
      const [iso, r, q] = arg.split(":"), key = iso+":"+r, before = S.imports[key] || 0;
      if (+q > 0 && !canContract(iso).ok) return toast("Закупка невозможна: " + canContract(iso).why + ".");
      if (+q > 0) S.imports[key] = +q; else delete S.imports[key];
      if (!before && +q > 0){ addLog(`Подписан договор на закупку: ${fmtQ(+q)} ${COMMOD[r].unit} ${COMMOD[r].gen} в месяц у страны ${partnerName(iso)}.`); flashMap(iso, "info"); }
      if (before && !(+q)) addLog(`Закупка ${COMMOD[r].gen} у страны ${partnerName(iso)} прекращена.`);
      break;
    }
    case "orderone": { const [iso, r] = arg.split(":"); orderGoods(iso, r, COMMOD[r].buy); break; }
    case "ordermat": { orderForBuilding(arg); break; }
    case "contract": {
      const [iso, r, q] = arg.split(":"), key = iso+":"+r, before = S.contracts[key] || 0;
      if (+q > 0 && !canContract(iso).ok) return toast("Контракт невозможен: " + canContract(iso).why + ".");
      if (+q > 0) S.contracts[key] = +q; else delete S.contracts[key];
      if (!before && +q > 0) flashMap(iso, "good");
      if (!before && +q > 0) addLog(`Подписан контракт: ${fmtQ(+q)} ${COMMOD[r].unit} ${COMMOD[r].gen} в месяц для страны ${partnerName(iso)}.`);
      if (before && !(+q)) addLog(`Контракт на поставку ${COMMOD[r].gen} в страну ${partnerName(iso)} расторгнут.`);
      break;
    }
    case "ad": showAd(); return;
  }
  save(); render();
}

/* ---------- Daily progress: research, construction, railways ---------- */
function dayTick(){
  S.rp += rpMonthly()/30;
  researchDay();
  facDay();
  if ((S.day||1) % 5 === 0) save();
  Object.keys(COMMOD).forEach(r => { S.stock[r] += prodOf(r)/30; });
  shipTick();
  wearyDay();
  if ((S.day||1) % 3 === 0){ goalsTick(); lessonsTick(); }
  if (S.wars.length){ S.wars.forEach(w => warDay(w)); warOutcomes(); if (ui.tab === "hq") dirty = true; else if (ui.tab === "map" && !BF.open) updateWarMap(); }
  const speed = (selfSuff("metal") < 60 ? 0.5 : 1) * (1 + 0.015*minDelta("housing"));
  S.queue.forEach(q => q.left -= speed);
  const done = S.queue.filter(q=>q.left<=0);
  done.forEach(q => { S.buildings[q.type]++; addLog(`Построено: ${BUILDINGS[q.type].name}.`); advise("econ", `Объект сдан: ${BUILDINGS[q.type].name}. Уже работает на страну.`, {tab:"build"}); flashMap(S.player, "good"); dirty = true; });
  if (done.length) S.queue = S.queue.filter(q=>q.left>0);

/* ---------- Real-time clock ---------- */
let acc = 0, lastTs = 0, pausedBy = null;
function setSpeed(v){
  if (!S || S.over) return;
  if (v===3 && !speed3Unlocked()){ showSpeedOffer(); return; }
  if (S.pendingEvent && v>0){ showReport(); return; }
  if (S.pendingVictory && v>0){ showVictory(); return; }
  ui.speed = v; if (v>0) ui.resumeSpeed = v;
  pausedBy = null; lastTs = performance.now(); updateClock();
}
function pauseFor(reason){ if (ui.speed>0){ ui.resumeSpeed = ui.speed; pausedBy = reason; } ui.speed = 0; updateClock(); }
function resumeAfter(reason){ if (pausedBy===reason){ pausedBy = null; ui.speed = ui.resumeSpeed; lastTs = performance.now(); } updateClock(); }
function tick(ts){
  requestAnimationFrame(tick);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(ts - lastTs, 1000); lastTs = ts;
  if (!S || !S.countries || S.over || ui.speed===0 || S.pendingEvent || S.pendingVictory || (BF.open && BF.open.cb)) return;   // a commanded field battle holds the map
  if (ui.speed===3 && !speed3Unlocked()){ ui.speed = 2; ui.resumeSpeed = 2; toast("Время ×3 за рекламу закончилось. Скорость ×2."); render(); }
  acc += dt;
  const msDay = SPEED_MS[ui.speed];
  while (acc >= msDay){
    acc -= msDay;
    S.day = (S.day||1) + 1;
    dayTick();
    if (S.day > daysIn(S.month, S.year)){ acc = 0; nextMonth(); return; }
  }
  if (BF.open){ if (dirty){ dirty = false; save(); } return; }   // the game screen is hidden under the battlefield
  if (dirty){ dirty = false; save(); render(); }
  updateLive();
  updateClock();
}
function updateLive(){
  if (ui.tab === "map" || document.getElementById("map-fx")) moveCargo();
  document.querySelectorAll("[data-qprog]").forEach(el => { const q = S.queue[+el.dataset.qprog]; if (q) el.style.width = ((1 - q.left/q.total)*100).toFixed(1)+"%"; });
  document.querySelectorAll("[data-qdays]").forEach(el => { const q = S.queue[+el.dataset.qdays]; if (q) el.textContent = Math.ceil(q.left) + " дн."; });
  document.querySelectorAll("[data-rqprog]").forEach(el => { const q = S.rq[+el.dataset.rqprog]; if (q) el.style.width = ((1 - q.left/q.total)*100).toFixed(1) + "%"; });
  document.querySelectorAll("[data-rqdays]").forEach(el => { const q = S.rq[+el.dataset.rqdays]; if (q) el.textContent = Math.ceil(q.left) + " дн."; });
  document.querySelectorAll("[data-rp]").forEach(el => el.textContent = Math.floor(S.rp).toLocaleString("ru-RU"));
}
function updateClock(){
  if (!S || !S.countries) return;
  const el = document.getElementById("clock-date"); if (el) el.textContent = fullDate();
  const wd = document.getElementById("clock-wd"); if (wd) wd.textContent = weekday();
  const bar = document.getElementById("clock-bar"); if (bar) bar.style.width = ((S.day-1 + acc/SPEED_MS[ui.speed||1]) / daysIn(S.month,S.year) * 100).toFixed(1) + "%";
  document.querySelectorAll("[data-speed]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.speed===ui.speed)));
  const hint = document.getElementById("clock-hint"); if (hint) hint.hidden = ui.speed!==0 || !!S.pendingEvent;
}
requestAnimationFrame(tick);
setInterval(() => { const tEl = document.querySelector('[data-speed="3"] .timer'); if (tEl) tEl.textContent = speed3MinutesLeft() + "м"; }, 30000);

function hintify(root){
  root.querySelectorAll(".panel").forEach(panel => {
    const cand = [...panel.querySelectorAll(".label, p.muted, small.muted, .muted.small, .tip-text")].filter(el => {
      if (el.closest(".ucard, .stock, button, .choice, .dcard, .mincard, .lawcard, .fcard, .org, .cand, .news, .log, .hint-src")) return false;
      if (el.querySelector("button, input, select, .bar, .num")) return false;
      if (el.closest(".panel") !== panel) return false;
      return el.textContent.trim().length > 60;
    });
    if (!cand.length) return;
    const txt = cand.map(el => el.innerHTML).join("<br><br>");
    cand.forEach(el => el.classList.add("hint-src"));
    const head = panel.querySelector("h3");
    const b = document.createElement("button"); b.className = "hint-i"; b.type = "button"; b.setAttribute("aria-label", "Пояснение"); b.textContent = "i"; b._hint = txt;
    if (head) head.appendChild(b); else { panel.classList.add("has-hint"); panel.prepend(b); }
  });

function softRender(html, opening){
  const old = app.querySelector(":scope > .game");

/* ================= Macroeconomics: social obligations, debt, central bank, inflation, unemployment ================= */
// rich countries: low neutral rate and inflation; poor: higher; trend growth converges (poor grow faster)
function devGap(){ return Math.max(0, 1 - gdppc()/45); }
function neutralRate(){ return 2 + 6*Math.max(0, 1 - gdppc()/40); }
function baseInfl(){ return 2 + 5*Math.max(0, 1 - gdppc()/40); }
function baseUnemp(){ return S.u0 || 6; }
function trendGrowthYear(){ return 0.014 + 0.04*devGap()*devGap(); }   // KG ~4,9%, RU ~2,3%, DE/US ~1,2%
function macroInit(s){
  const keep = S; S = s;
  s.cb = Math.round(neutralRate()*2)/2; s.infl = baseInfl(); s.print = 0; s.pens = 100; s.wages = 100;
  s.u0 = Math.round((4 + 5*devGap() + (hashIso(s.player)%5 - 2)*0.6)*10)/10; s.unemp = s.u0;
  S = keep;
}
function pensionCost(){ return me().gdp/12 * (0.022 + 0.018*Math.min(1, gdppc()/40)) * S.pens/100; }
function wageCost(){ return me().gdp/12 * 0.015 * S.wages/100; }
function debtRate(){ const d = S.debt/me().gdp; return clamp(0.02 + 0.35*S.cb/100 + Math.max(0, d - 0.6)*0.08 + (me().worldSanctions > 0 ? 0.02 : 0), 0.01, 0.35) * clamp(1 - 0.02*minDelta("finance"), 0.6, 1.3); }
function printIncome(){ return me().gdp/12 * 0.005 * (S.print||0); }
function inflTarget(b){
  const gdpM = me().gdp/12, def = b ? Math.max(0, -(b.net)/gdpM*100/12*12) : 0;   // deficit, % of GDP per year
  return clamp(baseInfl() + 0.25*def + 4*(S.print||0) + 3*S.wars.length - 0.9*(S.cb - neutralRate()) + 0.06*(S.pens - 100) + 0.04*(S.wages - 100)
    + (Object.values(C()).some(x => x.sanctionsUs) ? 1.5 : 0) + (powerBalance() < 0 ? 1 : 0), -1, 120);
}
function unempTarget(){
  return clamp(baseUnemp() + 0.4*(S.cb - neutralRate()) - 0.04*(S.wages - 100) - 0.02*Math.min(60, objCount("factory") + objCount("chem") + objCount("auto") + objCount("chips"))*5
    - (S.progs || []).length*0.15 + (deficits() > 1 ? 1 : 0) + popJobs(), 1, 40);
}
function macroApproval(){ return -Math.max(0, S.infl - 5)*0.35 - Math.max(0, S.unemp - baseUnemp())*0.6 + Math.max(0, baseUnemp() - S.unemp)*0.3 + (S.pens - 100)*0.08 + (S.wages - 100)*0.04; }
function macroStab(){ return -Math.max(0, S.infl - 15)*0.3 - Math.max(0, S.unemp - 10)*0.5; }
function macroGrowth(){ return -Math.max(0, S.infl - 8)*0.00008 - (S.cb - neutralRate())*0.00007 - Math.max(0, S.unemp - 15)*0.00005; }
function macroMonth(b){
  S.infl += (inflTarget(b) - S.infl)*0.15 + rnd(-0.15, 0.15);
  S.unemp += (unempTarget() - S.unemp)*0.12 + rnd(-0.05, 0.05);
  // inflation erodes the real value of debt and of cash in the treasury
  const k = Math.max(0, S.infl)/1200;
  S.debt *= 1 - k*0.8; S.treasury *= 1 - k*0.3;
  if (S.infl > 40 && !S.flags.hyper){ S.flags.hyper = true; addLog("Гиперинфляция: цены растут на глазах, люди скупают доллары."); advise("econ", `Инфляция ${pct(S.infl)} в год! Поднимите ставку ЦБ и остановите печатный станок.`, {tab:"economy"}); }
  if (S.infl < 20) S.flags.hyper = false;
}
function borrowAmount(){ return me().gdp*0.02; }
function repay(part){ const v = part === "all" ? Math.min(S.treasury, S.debt) : Math.min(S.treasury, S.debt, me().gdp*0.01); if (v <= 0) return toast("Нет свободных денег."); S.treasury -= v; S.debt -= v; addLog(`Погашено ${money(v)} госдолга.`); sfx("success"); save(); render(); }
function borrow(){
  const d = S.debt/me().gdp; if (d > 1.3) return toast("Кредиторы больше не дают денег.");
  const v = borrowAmount(); S.treasury += v; S.debt += v; addLog(`Выпущены облигации на ${money(v)} под ${pct(debtRate()*100,1)} годовых.`); save(); render();
}
function viewFinance(){
  const c = me(), d = S.debt/c.gdp, nr = neutralRate(), b = budget();

  const g = (growthMonthly())*1200;
  return `<div class="mgauges">

      ${gauge("Госдолг", d*100, "% ВВП", 40, 90, money(S.debt))}
    </div>
    <div class="grid2">
    <div class="panel">
      <h3>Центральный банк</h3>
      <div class="slider"><label>Ключевая ставка</label><span class="num"><b data-cbv>${S.cb.toFixed(1).replace(".",",")}%</b></span>
        <input type="range" min="0" max="30" step="0.5" value="${S.cb}" data-cb aria-label="Ключевая ставка"></div>
      <div class="label">Нейтральная ставка для вашей страны — ${pct(nr,1)}. Выше — инфляция падает, но тормозит рост, растут безработица и проценты по долгу. Ниже — наоборот.</div>
      <div class="row"><span>Печатный станок <small class="muted">· +0,5% ВВП в год в бюджет за уровень, инфляция +4%</small></span><span class="seg" role="group" aria-label="Эмиссия">${[0,1,2,3].map(l=>`<button data-print="${l}" aria-pressed="${(S.print||0)===l}">${["Нет","1","2","3"][l]}</button>`).join("")}</span></div>

      <div class="bar ${d > 0.9 ? "low" : d > 0.6 ? "mid" : "high"}"><i style="width:${Math.min(100, d/1.6*100)}%"></i></div>

      <div class="label">Чем больше долг, тем дороже новые займы. Выше 160% ВВП — дефолт и конец игры. Инфляция понемногу «съедает» долг, но бьёт по людям.</div>
    </div>

      <h3>Социальные обязательства</h3>

/* ---------- view ---------- */
function facEffectText(id){
  const F = FAC[id];
  if (F.mil){
    if (F.mil === "train") return `мощь армии +${(1.5*Math.min(10, facCount(id))).toFixed(1).replace(".",",")}%`;
    if (F.mil === "supply") return `расход боеприпасов −${3*Math.min(10, facCount(id))}%`;
    const cap = facCount(id)*MIL_CAP[F.mil], load = milLoad(F.mil);
    if (F.mil === "ammo") return load > cap ? `<span class="down">склады переполнены: портится ${money(load-cap)}</span>` : `занято ${money(load)} из ${money(cap)}`;
    const unit = F.mil === "troops" ? "тыс. военных" : F.mil === "ground" ? "машин" : "машин";
    return load > cap ? `<span class="down">не хватает мест: ${fmtN(load)} при ${fmtN(cap)} ${unit} — армия слабее</span>` : `занято ${fmtN(load)} из ${fmtN(cap)} ${unit}`;
  }
  const r = facR(id), parts = [];
  const L = {appr:"рейтинг", stab:"стабильность", growth:"рост", rp:"ОИ", tax:"налоги", pop:"население", tour:"туризм"};
  for (const k in F.fx){ const v = F.fx[k]*r*2; if (Math.abs(v) < 1e-9) continue; parts.push(k === "growth" ? `${L[k]} ${v>=0?"+":"−"}${Math.abs(v*1200).toFixed(2).replace(".",",")}%/год` : k === "pop" ? `${L[k]} ${v>=0?"+":"−"}${Math.abs(v*1200).toFixed(2).replace(".",",")}%/год` : k === "tax" || k === "tour" ? `${L[k]} ${v>=0?"+":"−"}${Math.abs(v*100).toFixed(1).replace(".",",")}%` : `${L[k]} ${v>=0?"+":"−"}${Math.abs(v).toFixed(1).replace(".",",")}`); }
  return parts.length ? `<span class="${r>0.005?"up":r<-0.005?"down":"muted"}">${parts.join(", ")}</span>` : `<span class="muted">как обычно</span>`;
}
function facCard(id){
  const F = FAC[id], n = facCount(id), prog = S.progs.find(p => p.id === id), chk = facCanStart(id), need = facNeed(id);
  const base = F.mil ? 1 : facNorm(id), cov = F.mil && !MIL_CAP[F.mil] ? null : facCov(id)/base, normN = need*base;
  return `<div class="fcard ${prog ? "busy" : ""}">
    <div class="f-ic">${isoIcon(F.look, 74)}</div>
    <div class="f-body">
      <div class="row"><b>${F.name}</b><span class="f-n num">${fmtN(id === "house" ? facGood(id) : n)}</span></div>
      ${cov !== null ? `<div class="bar ${cov < 0.9 ? "low" : cov < 0.995 ? "mid" : "high"}"><i style="width:${Math.min(100, cov*100).toFixed(0)}%"></i></div>
        <small class="muted">${F.mil ? "" : `норма ${fmtN(normN)} · `}обеспеченность ${Math.round(cov*100)}%</small>` : `<small class="muted">${F.desc}</small>`}
      ${F.mil && cov !== null ? `<small class="muted">${F.desc}</small>` : ""}
      <small>${facEffectText(id)}</small>
      ${prog ? `<div class="f-prog"><div class="bar"><i style="width:${((1 - prog.left/prog.total)*100).toFixed(1)}%"></i></div><small class="muted">+${fmtN(prog.n)} · ещё ${Math.ceil(prog.left)} дн.</small></div>`
        : `<button class="btn ${chk.ok ? "primary" : ""} sm" data-prog="${id}" ${chk.ok ? "" : "disabled"} title="${chk.ok ? "" : chk.why}">+${fmtN(facProgN(id))} · ${money(facProgCost(id))} · ${Object.entries(facProgMat(id)).map(([r,q]) => `${ic(r,"sm")}${fmtQ(q)}`).join(" ")} · ${facProgDays(id)} дн.</button>${chk.ok ? "" : `<small class="down">${chk.why}</small>`}`}
    </div></div>`;
}
function viewFacilities(){
  const cat = S.facCat || "edu", total = Object.keys(FAC).reduce((a,id)=>a + (FAC[id].mil ? 0 : facCount(id)), 0);
  const renov = cat === "housing" ? (() => { const bad = S.facBad||0, prog = S.progs.find(p => p.id === "renov"), chk = facCanStart("renov"), share = bad/Math.max(1, facCount("house"));
    return `<div class="fcard bad"><div class="f-ic">${isoIcon("renov", 74)}</div><div class="f-body">
      <div class="row"><b>Аварийное жильё</b><span class="f-n num down">${fmtN(bad)}</span></div>
      <small class="muted">${pct(share*100,1)} домов в аварийном состоянии — каждый месяц их становится больше. Это бьёт по рейтингу.</small>
      ${prog ? `<div class="f-prog"><div class="bar"><i style="width:${((1 - prog.left/prog.total)*100).toFixed(1)}%"></i></div><small class="muted">расселяем ${fmtN(prog.n)} · ещё ${Math.ceil(prog.left)} дн.</small></div>`
        : bad >= 1 ? `<button class="btn ${chk.ok?"primary":""} sm" data-prog="renov" ${chk.ok?"":"disabled"}>Расселить ${fmtN(facProgN("renov"))} · ${money(facProgCost("renov"))}</button>${chk.ok ? "" : `<small class="down">${chk.why}</small>`}` : ""}
    </div></div>`; })() : "";
  return `<div class="panel fac-head">
      <div class="row"><h3>Объекты по стране</h3><span class="num muted">Госпрограмм: ${S.progs.length}</span></div>
      ${S.progs.length ? `<div class="bstats">${S.progs.map(p => `<span>${p.id === "renov" ? "Расселение" : FAC[p.id].name} +${fmtN(p.n)} <b class="num">${Math.ceil(p.left)} дн.</b></span>`).join("")}</div>` : ""}
      <div class="label">Норма растёт вместе с населением и богатством страны, а здания стареют. Выше нормы — бонусы, ниже — штрафы. Строят госпрограммы: целая партия сразу.</div>
    </div>
    <div class="row"><span>Население <b class="num">${people(me().pop)}</b></span><span class="num ${popRate() < 1 ? "down" : ""}">${((popRate() - 1)*1200).toFixed(1).replace(".",",")}% в год</span></div>
    <div class="row"><span>Настроение людей</span><span class="num ${unrestStage() >= 2 ? "down" : ""}">${UNREST_NAME[unrestStage()]} · ${Math.round(S.unrest || 0)}</span></div>
    <div class="filters fac-cats">${NEEDS.map(([id,n,cs]) => { const v = needCov(id); return `<button class="chip" data-faccat="${cs[0]}" aria-pressed="${cs.includes(cat)}">${n} <b class="num ${v<0.9?"down":v>1.05?"up":""}">${Math.round(v*100)}%</b></button>`; }).join("")}</div>
    <div class="fac-grid">${renov}${Object.keys(FAC).filter(id => (NEEDS.find(n => n[2].includes(cat)) || [0,0,[cat]])[2].includes(FAC[id].cat)).map(facCard).join("")}</div>`;
}

function facCatCov(cat){
  if (cat === "defense") return (milFactor("troops") + milFactor("ground") + milFactor("air"))/3;
  const ids = Object.keys(FAC).filter(id => FAC[id].cat === cat); return ids.reduce((a,id)=>a + Math.min(1.5, facCov(id)/facNorm(id)), 0)/ids.length;
}

function kpiDelta(kind){
  const L = S.last && S.last.d; const f1 = v => (v >= 0 ? "▲ +" : "▼ −") + Math.abs(v).toFixed(Math.abs(v) < 10 ? 1 : 0).replace(".", ",");
  let v = null, t = "";
  if (kind === "treasury" && L){ const prev = S.treasury - L.treasury; if (Math.abs(prev) > 1e-9){ v = L.treasury/Math.abs(prev)*100; t = f1(v) + "%"; } }
  else if (kind === "approval" && L){ v = L.approval; t = f1(v); }
  else if (kind === "stability" && L){ v = L.stability; t = f1(v); }
  else if (kind === "rp"){ v = rpMonthly(); t = "▲ +" + Math.round(v) + " в мес."; }
  else if (kind === "net"){ v = growthMonthly()*1200; t = f1(v) + "%/год"; }
  else if (kind === "gdp" && L){ v = L.gdp/Math.max(1e-9, me().gdp - L.gdp)*1200; t = f1(v) + "%/год"; }
  return t ? `<small class="kd ${v >= 0 ? "up" : "down"}">${t}</small>` : `<small class="kd muted">—</small>`;
}

function netGrow(iso){

function intelReport(iso){
  const x = C()[iso], n = netLvl(iso); if (!x) return "";
  if (!n) return `<p class="muted" style="margin:0">Агентуры в этой стране нет — данные только из открытых источников. Расширьте сеть, чтобы видеть больше.</p>`;
  const err = [0.5, 0.3, 0.2, 0.12, 0.06, 0.02][n], est = v => { const h = (hashIso(iso + S.turn) % 100)/100 - 0.5; return v*(1 + h*err*2); };
  const intent = x.rel < -65 && aiPower(x) > myPower()*1.3 ? ["down","может напасть: настроены враждебно и сильнее нас"] : x.rel < -40 ? ["warn","враждебны, но к войне не готовы"] : x.rel > 40 ? ["up","настроены дружественно"] : ["muted","угрозы не видно"];
  return `<div class="bstats"><span>Мощь армии ≈ <b class="num">${Math.round(est(aiPower(x))).toLocaleString("ru-RU")}</b></span><span>Личный состав ≈ <b class="num">${troops(est(x.army))}</b></span><span>Технологии <b class="num">${x.tech}/5</b></span><span>ВВП ≈ <b class="num">${money(est(x.gdp))}</b></span></div>
    <div class="row"><span>Намерения</span><span class="${intent[0]}">${intent[1]}</span></div>
    ${n >= 3 ? `<div class="row"><span>Отношение их руководства к нам</span><span class="num">${x.rel > 0 ? "+" : ""}${Math.round(x.rel)}</span></div>` : ""}
    ${n >= 4 ? `<div class="row"><span>Их санкции</span><span>${x.sanctionsUs ? "действуют против нас" : "нет"}</span></div>` : ""}
    <small class="muted">Точность данных ±${Math.round(err*100)}%: чем сильнее сеть, тем точнее.</small>`;
}
function intelMonth(){
  if ((S.ciBoost||0) > 0) S.ciBoost--;
  Object.keys(S.net||{}).forEach(iso => { const x = C()[iso];
    if (!x || x.owner){ delete S.net[iso]; return; }
    S.rp += S.net[iso] >= 2 ? 0.4*S.net[iso]*x.tech : 0;
    if (Math.random() < 0.015*x.tech){ S.net[iso] = Math.max(0, S.net[iso] - 1); addLog(`Контрразведка страны ${x.name} вскрыла часть нашей сети: уровень ${S.net[iso]}.`); if (!S.net[iso]) delete S.net[iso]; } });
  // foreign espionage against us
  Object.values(C()).forEach(x => {
    if (x.owner || x.rel > -25 || (x.expelled||0) > 0){ if (x.expelled > 0) x.expelled--; return; }
    if (Math.random() < 0.02*S.aggr){
      if (Math.random() < ciLevel()){ (S.ciLog = S.ciLog || []).unshift({d:dateStr(), iso:x.id, caught:true}); addLog(`Контрразведка раскрыла шпионов страны ${x.name}.`); advise("intel", `Мы взяли шпионскую сеть страны ${x.name}. Можно выслать их дипломатов — во вкладке «Контрразведка».`, {tab:"intel"}); }
      else { const v = Math.round(5 + x.tech*3); S.rp = Math.max(0, S.rp - v); (S.ciLog = S.ciLog || []).unshift({d:dateStr(), iso:x.id, caught:false, rp:v}); addLog(`Утечка: агенты страны ${x.name} похитили наши разработки (−${v} ОИ).`); }
      S.ciLog = S.ciLog.slice(0, 8);
    }
  });
}
function expel(iso){
  const x = C()[iso]; if (!x || (x.expelled||0) > 0) return;
  x.expelled = 6; x.rel = clamp(x.rel - 10, -100, 100); S.mods.push({stat:"approval", v:2, left:3});
  addLog(`Дипломаты страны ${x.name} высланы. Их разведка на полгода парализована.`); save(); render();
}
function ciBoost(){
  if ((S.ciBoost||0) > 0 || S.treasury < improveCost()) return;
  S.treasury -= improveCost(); S.ciBoost = 6; addLog("Запущена проверка госаппарата: контрразведка усилена на полгода."); save(); render();
}
function opCards(x){
  return `<div class="dgrid">${OPS.map(op => { const ok = opAllowed(op, x);
    return `<button class="dcard ${ok ? "" : "off"}" data-opx="${op.id}:${x.id}" ${ok ? "" : "disabled"}>
      <span class="dc-pic" style="background:radial-gradient(circle at 30% 25%,#3A4F70,#141F3D)">${ic(op.id === "spy" ? "science" : op.id === "influence" ? "diplomacy" : op.id === "opposition" ? "users" : op.id === "coup" ? "politics" : "factory", "lg")}</span>
      <b>${op.name}</b><small>${op.desc} · ${op.pts} агентов · успех ${Math.round(opChance(op.id, x)*100)}%</small></button>`; }).join("")}</div>`;
}
function viewIntel(){
  const tab = ui.itab || "net";
  const targets = Object.values(C()).filter(x => !x.owner).sort((a,b) => a.name.localeCompare(b.name, "ru"));
  if (!ui.intelTarget || !C()[ui.intelTarget] || C()[ui.intelTarget].owner) ui.intelTarget = targets[0] && targets[0].id;
  const x = C()[ui.intelTarget];
  const head = `<div class="panel"><div class="row"><h3>Агенты: <span class="num">${S.intel.pts.toFixed(1).replace(".",",")} / 20</span></h3>
      <span class="seg" role="group" aria-label="Финансирование спецслужб">${[0,1,2,3].map(l=>`<button data-intellevel="${l}" aria-pressed="${S.intel.level===l}">${["0","Мин","Норм","Макс"][l]}</button>`).join("")}</span></div>
      <div class="bar"><i style="width:${S.intel.pts/20*100}%"></i></div>
      <div class="bstats"><span>Успешных операций <b class="num">${S.intel.ok}</b></span><span>Сетей за рубежом <b class="num">${Object.keys(S.net||{}).length}</b></span><span>Контрразведка <b class="num">${Math.round(ciLevel()*100)}%</b></span><span>Расход <b class="down num">−${money(intelCost())}</b>/мес</span></div></div>`;
  const tabs = `<div class="filters gov-tabs">${[["net","Агентура","users"],["rep","Разведка","intel"],["ops","Операции","alert"],["ci","Контрразведка","stability"]].map(([t,l,i]) => `<button class="chip" data-itab="${t}" aria-pressed="${tab===t}">${ic(i,"sm")}${l}</button>`).join("")}</div>`;
  const pickT = `<select class="select" data-inteltarget aria-label="Страна">${targets.map(c=>`<option value="${c.id}" ${c.id===ui.intelTarget?"selected":""}>${esc(c.name)}${netLvl(c.id) ? ` · сеть ${netLvl(c.id)}` : ""}</option>`).join("")}</select>`;
  let body = "";
  if (tab === "net"){
    const nets = Object.entries(S.net||{}).filter(([i]) => C()[i]).sort((a,b) => b[1]-a[1]);
    body = `<div class="panel"><div class="row">${pickT}<button class="btn primary" data-netgrow="${ui.intelTarget}" ${S.intel.pts < 2 || S.treasury < netCost() || netLvl(ui.intelTarget) >= 5 ? "disabled" : ""}>Расширить сеть · 2 агента · ${money(netCost())}</button></div>
      <div class="label">Сеть в стране (до 5 уровней) повышает успех операций на 6% за уровень, даёт точную разведку, а с уровня 2 — донесения: очки исследований каждый месяц. Развитые страны чаще вскрывают чужих агентов.</div>
      ${nets.length ? nets.map(([i, l]) => `<div class="row net-row"><span>${flag(i)} ${esc(C()[i].name)}</span><span class="net-dots">${[1,2,3,4,5].map(k => `<i class="${k <= l ? "on" : ""}"></i>`).join("")}</span><button class="btn sm" data-ctry="${i}" data-ctabgo="intel">Открыть ›</button></div>`).join("") : `<p class="muted" style="margin:0">Агентурных сетей пока нет.</p>`}</div>`;
  } else if (tab === "rep"){
    body = `<div class="panel"><div class="row">${pickT}<span class="num muted">сеть ${netLvl(ui.intelTarget)}/5</span></div>${x ? `<h3>${flag(x.id)} ${esc(x.name)}: разведсводка</h3>${intelReport(x.id)}` : ""}</div>`;
  } else if (tab === "ops"){
    body = `<div class="panel"><div class="row">${pickT}<span class="num muted">сеть ${netLvl(ui.intelTarget)}/5 · +${netLvl(ui.intelTarget)*6}% к успеху</span></div><div class="label">Провал раскрывается в половине случаев: отношения с целью −25 и скандал дома.</div></div>${x ? opCards(x) : ""}`;
  } else {
    const hostile = Object.values(C()).filter(c => !c.owner && c.rel <= -25).sort((a,b) => a.rel - b.rel);
    body = `<div class="panel"><div class="row"><h3>Контрразведка: ${Math.round(ciLevel()*100)}%</h3><button class="btn" data-ciboost ${(S.ciBoost||0) > 0 || S.treasury < improveCost() ? "disabled" : ""}>${(S.ciBoost||0) > 0 ? `Проверка идёт: ${S.ciBoost} мес.` : `Проверка госаппарата · ${money(improveCost())}`}</button></div>
      <div class="label">Шанс поймать чужих агентов. Растёт от финансирования спецслужб и Службы безопасности (Власть → Министерства). Враждебные страны (отношения ниже −25) пытаются красть наши разработки.</div>
      ${hostile.length ? hostile.map(c => `<div class="row net-row"><span>${flag(c.id)} ${esc(c.name)} <small class="muted">${Math.round(c.rel)}</small></span>${(c.expelled||0) > 0 ? `<span class="pill state">дипломаты высланы: ${c.expelled} мес.</span>` : `<button class="btn sm" data-expel="${c.id}">Выслать дипломатов</button>`}</div>`).join("") : `<p class="muted" style="margin:0">Враждебных разведок не видно.</p>`}
      ${(S.ciLog||[]).length ? `<h3>Последние случаи</h3>${S.ciLog.map(e => `<div class="row"><small class="muted">${e.d}</small><small class="${e.caught ? "up" : "down"}">${e.caught ? "раскрыты агенты" : `утечка −${e.rp} ОИ`} · ${esc(partnerName(e.iso))}</small></div>`).join("")}` : ""}</div>`;
  }
  return head + tabs + body;
}

  </div>`;

}

const photo = id => (UINFO[id] || AINFO[id]) ? `photos/${(UINFO[id] || AINFO[id]).f}.webp` : "";
function credit(x){ return x.lic ? `Фото: ${x.by} · ${x.lic}` : x.by; }
function showUnitInfo(id){
  const m = MODELS[id], a = AMMO[id], x = UINFO[id] || AINFO[id]; if (!x) return;
  let stats = "";
  if (m){ const k = KINDS[m.kind], buy = canBuyModel(id), prod = canProduceModel(id), n = S.units[id] || 0;
    stats = `<div class="ui-stats">
      <span><small>Производитель</small><b>${flag(m.origin)} ${esc(partnerName(m.origin))}</b></span>
      <span><small>Класс</small><b>${k.name}</b></span>
      <span><small>Поколение</small><b>${m.gen}</b></span>
      <span><small>Мощь</small><b class="num">${m.pw.toLocaleString("ru-RU")}</b></span>
      <span><small>⚔ Удар по земле</small><b class="num">${m.ga}</b></span>
      <span><small>✈ Удар по воздуху</small><b class="num">${m.aa}</b></span>
      <span><small>🛡 Защита</small><b class="num">${m.df}</b></span>
      <span><small>Цена за единицу</small><b class="num">${money(m.price)}</b></span>
      <span><small>Содержание</small><b class="num">${money(modelUpkeep(m)/12)}/мес</b></span>
      <span><small>В строю</small><b class="num">${n.toLocaleString("ru-RU")}</b></span>
      ${k.ammo ? `<span><small>Боеприпасы</small><b>${AMMO[k.ammo].short}</b></span>` : ""}
      ${m.req ? `<span><small>Требуется ВВП</small><b class="num">от ${money(m.req)}</b></span>` : ""}
    </div>
    <div class="label">${buy.ok ? `Закупка: ${money(buy.price)} за ед., доставка ${buy.days} дн.` : `Закупка: ${buy.why}`}${prod.ok ? " · можно производить у себя" : prod.why ? ` · своё производство: ${prod.why}` : ""}</div>`; }
  else if (a){ stats = `<div class="ui-stats"><span><small>Цена партии</small><b class="num">${money(a.price*a.batch)}</b></span><span><small>Партия</small><b class="num">${a.batch.toLocaleString("ru-RU")} ${a.unit}</b></span><span><small>На складе</small><b class="num">${Math.floor(S.ammo[id]||0).toLocaleString("ru-RU")} ${a.unit}</b></span></div>`; }
  modalRoot.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(m ? m.name : a.name)}"><div class="sheet uinfo">
    <figure class="ui-photo"><img src="${photo(id)}" alt="${esc(m ? m.name : a.name)}"><figcaption>${esc(credit(x))}</figcaption>${m && SPR.idx[id] != null ? `<canvas class="ui-3d" width="192" height="192" aria-label="3D-модель: потяните, чтобы повернуть"></canvas><span class="ui-3d-l">3D</span>` : ""}</figure>
    <div class="ui-body"><div class="row"><h2>${m ? `${flag(m.origin)} ${esc(m.name)}` : esc(a.name)}</h2>${m ? `<span class="gen g${m.gen}">${m.gen} пок.</span>` : ""}</div>
      <p>${x.d}</p>${stats}
      <div class="btns"><button class="btn" data-close>Закрыть</button><button class="btn link" data-credits>Источники фото</button></div></div>
  </div></div>`;
  if (m) sprTurntable(id);
}

function showCredits(){

  const lics = [...new Set(rows.map(([,x]) => x.lic).filter(Boolean))];
  modalRoot.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Источники фото"><div class="sheet credits">
    <h2>Источники фото</h2>
    <p class="muted">Фотографии техники используются по свободным лицензиям. Все изображения обрезаны и сжаты для игры. Часть изображений создана нейросетью; если за основу взято чужое фото, автор указан. Знаки различия на фото не означают одобрения игры кем-либо.</p>
    <div class="cr-list">${rows.map(([n,x]) => `<div class="cr-row"><b>${esc(n)}</b><small>${esc(x.lic ? `${x.by} — ${x.lic}` : x.by)}</small></div>`).join("")}</div>
    <h3>3D-модели</h3>

    <div class="cr-list">${CREDITS3D.map(([n,by,u]) => `<div class="cr-row"><b>${esc(MODELS[n] ? MODELS[n].name : n)}</b><small>${esc(by)} — CC BY 4.0 · ${esc(u)}</small></div>`).join("")}<div class="cr-row"><b>three.js</b><small>3D-движок поля боя — лицензия MIT · threejs.org</small></div></div>
    <h3>Лицензии</h3>

function viewArmy(){
  const c = me(), tab = S.armyTab || "ground";
  const wars = S.wars.map(w => { const e = C()[w.enemy]; const p = (w.progress+100)/2; return `<div class="panel">
    <div class="row"><h3>Война: ${flag(e.id)} ${esc(e.name)}</h3><span class="pill ${w.progress>=0?"good":"bad"}">${w.months} мес.</span></div>
    <div class="row"><span class="label">Мы</span><span class="num">${w.progress>0?"+":""}${Math.round(w.progress)}</span><span class="label">Противник</span></div>
    <div class="bar ${w.progress>=0?"high":"low"}"><i style="width:${p}%"></i></div>
    <div class="row"><span class="muted">Наша сила ${Math.round(myPower())} против ${Math.round(aiPower(e))}</span>
    <div class="btns"><button class="btn primary" data-tab="hq" onclick="void 0" data-hqgo="${e.id}">${ic("army","sm")} Штаб</button><button class="btn" data-act="peace" data-arg="${e.id}">Мирные переговоры</button></div></div></div>`; }).join("");
  const head = `<div class="panel army-head">
      <div class="row"><h3>Вооружённые силы</h3><span class="num">Мощь ${Math.round(myPower()).toLocaleString("ru-RU")}</span></div>
      <div class="bstats"><span>Личный состав <b class="num">${troops(c.army)}</b></span><span>Техники <b class="num">${Object.values(S.units).reduce((a,b)=>a+b,0).toLocaleString("ru-RU")}</b></span><span>Содержание <b class="down num">−${money(armyUpkeepMonthly())}</b>/мес</span><span>Модернизация <b class="num">${c.tech}/5</b></span></div>
      <div class="btns"><button class="btn" data-act="recruit" ${S.treasury<recruitCost()||me().army>=draftCap()?"disabled":""}>Призыв +${troops(recruitAmount())} · ${money(recruitCost())}</button><button class="btn" data-act="tech" ${c.tech>=5||S.treasury<techCost()?"disabled":""}>${c.tech>=5?"Модернизация: максимум":`Модернизация · ${money(techCost())}`}</button><button class="btn" data-act="disband">Сократить на 5%</button><button class="btn" data-tab="hq">${ic("army","sm")} Штаб и оккупация</button></div>
      ${garrisonTotal() ? `<div class="label">В гарнизонах: ${troops(garrisonTotal())}. На фронтах доступно: ${troops(freeArmy())}.</div>` : ""}
    </div>`;
  const tabs = `<div class="filters armytabs">${UCLS.map(([id,l]) => `<button class="chip" data-armytab="${id}" aria-pressed="${tab===id}">${pic("cls_" + id, "sm")}${l}</button>`).join("")}</div>`;
  let body = "";
  if (["ground","air","ad","navy"].includes(tab)){
    if (tab === "navy" && !hasCoast()) body = `<div class="panel"><p class="muted" style="margin:0">У страны нет выхода к морю — флот недоступен. Его можно получить, присоединив прибрежную страну.</p></div>`;
    else body = Object.entries(KINDS).filter(([,k]) => k.cls === tab).map(([kid, k]) => {
      const ms = MODEL_ROWS.map(r=>MODELS[r[0]]).filter(m => m.kind === kid);
      const have = ms.reduce((a,m)=>a+(S.units[m.id]||0), 0);
      return `<div class="panel"><div class="row"><h3>${ic(k.icon)} ${k.name}</h3><span class="num">${have.toLocaleString("ru-RU")} ед.</span></div>
        <div class="unit-grid">${ms.map(m => { const n = S.units[m.id]||0, buy = canBuyModel(m.id), prod = canProduceModel(m.id);
          return `<div class="ucard ${n?"have":""}">
            <button class="uc-photo" data-uinfo="${m.id}" aria-label="Подробнее: ${esc(m.name)}"><img src="${photo(m.id)}" alt="" loading="lazy" draggable="false"><span class="gen g${m.gen}">${m.gen} пок.</span><i class="uc-i" aria-hidden="true">i</i></button>
            <div class="uc-name"><b>${flag(m.origin)} ${m.name}</b></div>
            <div class="row uc-meta"><span class="uc-pw">Мощь <b class="num">${m.pw.toLocaleString("ru-RU")}</b></span><span class="num ${n?"":"muted"}">В строю: <b>${n.toLocaleString("ru-RU")}</b></span></div>
            <div class="btns">${buy.ok ? `<button class="btn primary sm" data-act="buyunit" data-arg="${m.id}" ${S.treasury < buy.price*k.batch ? "disabled" : ""}>+${k.batch} · ${money(buy.price*k.batch)} · ${buy.days} дн.</button>` : `<small class="${buy.own?"muted":"down"}">${buy.why}</small>`}
              ${n ? `<button class="btn sm" data-act="sellunit" data-arg="${m.id}">Списать ${Math.min(n, k.batch)}</button>` : ""}</div>
          </div>`; }).join("")}</div></div>`; }).join("");
  } else if (tab === "bases"){
    body = `<div class="panel"><div class="row"><h3>${ic("army")} Военная инфраструктура</h3><span class="num">боеготовность ${Math.round(milBaseMult()*100)}%</span></div><div class="label">Если войскам, технике или самолётам не хватает мест на базах, армия воюет слабее. Тренировочные комплексы и склады снабжения дают бонусы сверх нормы.</div></div><div class="fac-grid">${Object.keys(FAC).filter(id=>FAC[id].cat==="defense").map(facCard).join("")}</div>`;
  } else if (tab === "ammo"){
    const need = ammoNeedMonth(), sellers = ammoSellers();
    body = `<div class="panel"><div class="row"><h3>${ic("ammo")} Склад боеприпасов</h3>${sellers[0] ? `<span class="label">Поставщик: ${flag(sellers[0].iso)} ${esc(partnerName(sellers[0].iso))}, ~${sellers[0].days} дн.</span>` : `<span class="label down">Нет поставщиков (нужны отношения от +10)</span>`}</div>
      ${Object.entries(AMMO).map(([k,a]) => { const have = S.ammo[k]||0, months = need[k] > 0 ? have/need[k] : Infinity;
        return `<div class="stock ammo-row"><button class="am-photo" data-uinfo="${k}" aria-label="Подробнее: ${a.name}"><img src="${photo(k)}" alt="" loading="lazy"><i class="uc-i" aria-hidden="true">i</i></button><div class="am-body"><div class="row"><b>${a.name} <small class="muted">· ${ammoTier(k)}</small></b><span class="num">${Math.floor(have).toLocaleString("ru-RU")} ${a.unit}</span></div>
          <div class="bar ${months<2?"low":months<5?"mid":"high"}"><i style="width:${Math.min(100, (isFinite(months)?months:12)/12*100)}%"></i></div>
          <div class="row"><small class="muted">${isFinite(months) ? `Хватит примерно на ${months < 1 ? "меньше месяца" : Math.floor(months) + " мес."} войны` : "Сейчас не расходуется"}</small>
          ${k === "missile" && !tlv("am_missile") ? `<small class="down">нужно исследование «Ракеты I»</small>` : ""}<button class="btn sm" data-act="buyammo" data-arg="${k}" ${(k === "missile" && !tlv("am_missile")) || !sellers[0] || S.treasury < a.price*a.batch*(sellers[0]?sellers[0].price:1) ? "disabled" : ""}>+${a.batch.toLocaleString("ru-RU")} · ${money(a.price*a.batch*(sellers[0]?sellers[0].price:1.2))}</button></div></div></div>`; }).join("")}
      <div class="label">На войне каждый бой тратит боеприпасы. Кончатся снаряды — артиллерия замолчит. Свой завод боеприпасов строится в разделе «Стройка → Военные заводы».</div></div>`;
  } else {
    const plants = [...Object.keys(PLANT_CAP), "ammoplant"];
    body = plants.map(pid => { const n = objCount(pid), b = BUILDINGS[pid];
      if (pid === "ammoplant") return `<div class="panel"><div class="row"><h3>${ic("ammo")} ${b.name}</h3><span class="num">×${n}</span></div>
        ${n ? `<div class="bstats">${Object.entries(ammoPlantOut()).map(([k,q])=>`<span>${AMMO[k].short} <b class="num">+${Math.round(q).toLocaleString("ru-RU")}</b>/мес</span>`).join("")}<span>Стоимость <b class="down num">−${money(ammoPlantCost())}</b>/мес</span></div>` : `<p class="muted" style="margin:0">Нет завода. Строится в «Стройка → Военные заводы».</p>`}</div>`;
      const sel = S.prod[pid], cap = n ? plantCap(pid) : 0;
      const choices = prodChoices(pid), opts = choices.map(m => { const ok = canProduceModel(m.id); return `<button class="chip ${ok.ok?"":"off"}" data-act="prodset" data-arg="${pid}|${m.id}" aria-pressed="${sel===m.id}" ${ok.ok?"":`disabled title="${esc(ok.why)}"`}>${m.name}${ok.ok ? ` · ${Math.max(0, cap/m.price).toFixed(cap/m.price<1?2:0).replace(".",",")}/мес` : ""}</button>`; }).join("")
        + (pid === "samplant" ? ["sam","missile"].map(t => `<button class="chip" data-act="prodset" data-arg="${pid}|ammo:${t}" aria-pressed="${sel==="ammo:"+t}" ${n?"":"disabled"}>${AMMO[t].short} · ${n ? Math.floor(cap/AMMO[t].price).toLocaleString("ru-RU") : 0}/мес</button>`).join("") : "");
      return `<div class="panel"><div class="row"><h3>${ic(BUILD_ICON[pid]||"factory")} ${b.name}</h3><span class="num">×${n}</span></div>
        ${n ? `<div class="bstats"><span>Мощность <b class="num">${money(cap)}</b>/мес</span><span>Расход <b class="down num">−${sel ? money(cap*0.5) : "0 $"}</b>/мес + сталь</span></div>
          <div class="filters">${opts}</div>
          ${sel ? `<div class="row"><span>${S.prodExport[pid] ? "Продукция уходит на экспорт" : "Продукция идёт в свою армию"}${S.prodExport[pid] && armsBuyers().length ? ` · <span class="up num">+${money(cap*0.9*(1+0.5*tech("armsexport")))}/мес</span>` : ""}</span><button class="btn sm" data-act="prodexport" data-arg="${pid}">${S.prodExport[pid] ? "Оставлять себе" : "Продавать на экспорт"}</button></div>` : `<div class="label">Выберите, что выпускать.</div>`}`
          : `<p class="muted" style="margin:0">Нет завода. ${b.desc}. Строится в «Стройка → Военные заводы».</p>`}</div>`; }).join("")
      + `<div class="label" style="margin-top:4px">Производить можно технику своего блока, а чужую — по лицензии, при отношениях от +50 со страной-разработчиком. Новые поколения открывает наука (ветки «ВПК» и «Оборона»).</div>`;
  }
  return `${head}${wars ? `<div class="grid2" style="margin-top:10px">${wars}</div>` : ""}${tabs}<div class="army-body">${body}</div>`;
}
function dipRow(x){

const ORG_BY = Object.fromEntries(ORGS.map(o => [o.id, o]));
const ORG_DUES = {mil:0.0008, econ:0.0004, pol:0.0002, oil:0.0002};
function inOrg(id){ return !!(S.orgs && S.orgs[id]); }
function orgMembers(o){ return o.members.filter(i => i !== S.player && C()[i] && !C()[i].owner); }
function orgsOf(iso){ return ORGS.filter(o => iso === S.player ? inOrg(o.id) : o.members.includes(iso)); }
function sharedOrg(iso, kind){ return ORGS.some(o => inOrg(o.id) && (!kind || o.kind === kind) && o.members.includes(iso)); }
function orgCanJoin(o){
  if (inOrg(o.id)) return {ok:false, why:"вы уже участник"};
  const x = me();
  if (o.only && !o.only.includes(S.player)) return {ok:false, why:"только для стран региона"};
  if (o.regions && !o.regions.includes(x.region) && !(o.also||[]).includes(S.player)) return {ok:false, why:`только для региона: ${o.regions.join(", ")}`};
  if (o.rival && inOrg(o.rival)) return {ok:false, why:`несовместимо с членством в ${ORG_BY[o.rival].name}`};
  if (o.ideo && !ideo(o.ideo)) return {ok:false, why:"нужна демократия"};
  if (o.minGdp && x.gdp < o.minGdp) return {ok:false, why:`нужен ВВП от ${money(o.minGdp)}`};
  if (o.minOil && x.prof.oil < o.minOil) return {ok:false, why:"мало нефти"};
  const ms = orgMembers(o);
  if (ms.some(i => S.wars.some(w => w.enemy === i))) return {ok:false, why:"вы воюете с участником"};
  const avg = ms.length ? ms.reduce((a,i)=>a + C()[i].rel, 0)/ms.length : 100;
  if (avg < o.minRel) return {ok:false, why:`средние отношения с участниками ${Math.round(avg)}, нужно от +${o.minRel}`};
  if (S.orgCd && S.orgCd[o.id] > 0) return {ok:false, why:`повторная заявка через ${S.orgCd[o.id]} мес.`};
  return {ok:true};
}
function orgJoin(id){
  const o = ORG_BY[id], chk = orgCanJoin(o); if (!chk.ok) return toast(chk.why);
  if (!S.orgs) S.orgs = {}; S.orgs[id] = true;
  orgMembers(o).forEach(i => C()[i].rel = clamp(C()[i].rel + 8, -100, 100));
  if (o.rival) orgMembers(ORG_BY[o.rival]).forEach(i => { if (!o.members.includes(i)) C()[i].rel = clamp(C()[i].rel - 12, -100, 100); });
  addLog(`${me().name} вступила в организацию «${o.full}».`); advise("dipl", `Мы приняты в ${o.name}. ${o.fx[0].toUpperCase() + o.fx.slice(1)}.`, {tab:"diplomacy"}); sfx("success");

}
function orgLeave(id, quiet){

  delete S.orgs[id]; if (!S.orgCd) S.orgCd = {}; S.orgCd[id] = 12;
  orgMembers(o).forEach(i => C()[i].rel = clamp(C()[i].rel - 10, -100, 100));
  addLog(quiet ? `${me().name} исключена из организации «${o.full}».` : `${me().name} вышла из организации «${o.full}».`);
  if (!quiet){ save(); render(); }
}

function orgGrowth(){ let v = 0; ORGS.forEach(o => { if (inOrg(o.id)) v += o.id === "eu" ? 0.000125 : o.kind === "econ" ? 0.00008 : o.id === "brics" ? 0.00004 : 0; }); return v; }

const DAILY_KEY = "president-daily-v1";
function dailyGet(){ try { return JSON.parse(localStorage.getItem(DAILY_KEY)) || {}; } catch(e){ return {}; } }
function dailySet(o){ try { localStorage.setItem(DAILY_KEY, JSON.stringify(o)); } catch(e){} }
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); };
function dailyState(){
  const d = dailyGet(), now = Date.now(), today = dayKey(now), yest = dayKey(now - 864e5);
  const ready = d.last !== today;
  const streak = d.last === today || d.last === yest ? (d.streak || 0) : 0;   // missed a day: start over
  const next = new Date(); next.setHours(24, 0, 0, 0);
  return {ready, streak, day: ready ? (streak % 7) + 1 : ((streak - 1) % 7) + 1, msLeft: next - now};
}
const GIFTS = [
  {d:1, icon:"budget", name:"Бюджет", txt:() => `+${money(me().gdp*0.003)}`, give:k => { S.treasury += me().gdp*0.003*k; }},
  {d:2, icon:"science", name:"Наука", txt:() => "+25 ОИ", give:k => { S.rp += 25*k; }},
  {d:3, icon:"steel", name:"Материалы", txt:() => `+${fmtQ(niceQ(40*U("steel")))} тыс. т стали, +${fmtQ(niceQ(60*U("wood")))} тыс. т древесины`, give:k => { S.stock.steel += niceQ(40*U("steel"))*k; S.stock.wood += niceQ(60*U("wood"))*k; }},
  {d:4, icon:"intel", name:"Агенты", txt:() => "+4 агента", give:k => { S.intel.pts = Math.min(20, S.intel.pts + 4*k); }},
  {d:5, icon:"budget", name:"Крупный транш", txt:() => `+${money(me().gdp*0.006)}`, give:k => { S.treasury += me().gdp*0.006*k; }},

];
const hms = ms => { const s = Math.max(0, Math.floor(ms/1000)); return [Math.floor(s/3600), Math.floor(s%3600/60), s%60].map(v => String(v).padStart(2, "0")).join(":"); };
function claimGift(double){

  [/закон|Принят|Отменён/i, 5, "Власть"], [/Построено|Госпрограмма завершена|Расселено/i, 4, "Стройка"], [/союз|пакт|посольство|визит/i, 5, "Дипломатия"],
  [/Назначен|министр/i, 4, "Правительство"], [/кредит|Инвестиции|помощь/i, 3, "Экономика"], [/шпион|контрразведк|агент|разработки/i, 5, "Спецслужбы"],
  [/Подписано торговое|контракт|продажа|закупк/i, 3, "Торговля"]
];
function paperScore(text){ for (const [re, w, rub] of PAPER_RULES) if (re.test(text)) return [w, rub]; return [1, "Новости"]; }
function makeIssue(before){
  const c = me(), n = Math.min(60, (S.logN || 0) - (S.issueMark || 0)), lines = S.log.slice(0, n).map(l => l.text).filter(t => !/Ежедневный подарок/.test(t));
  S.issueMark = S.logN || 0;
  const scored = lines.map(t => { const [w, rub] = paperScore(t); return {t, w, rub}; }).sort((a,b) => b.w - a.w);
  const g = (c.gdp/before.gdp - 1)*100, apd = S.approval - before.approval;
  const lead = scored[0] && scored[0].w >= 4 ? scored[0] : {t: g >= 0 ? `Экономика ${c.name.split(" ").map(genWord).join(" ")} выросла на ${pct(Math.abs(g)*12, 1)} в пересчёте на год` : `Экономика ${c.name.split(" ").map(genWord).join(" ")} замедляется: спад ${pct(Math.abs(g)*12, 1)} в год`, rub:"Экономика"};
  const others = scored.filter(x => x !== lead).slice(0, 4);
  const world = [];
  const growth = Object.values(C()).filter(x => !x.owner && x.id !== S.player && S.prevGdp && S.prevGdp[x.id]).map(x => [x, x.gdp/S.prevGdp[x.id] - 1]).sort((a,b) => b[1] - a[1]);
  if (growth[0]) world.push(`${growth[0][0].name} — лидер роста месяца: экономика +${pct(growth[0][1]*100, 2)}.`);
  const mk = Object.keys(COMMOD).filter(r => commodOpen(r)).map(r => { const h = S.mhist[r]; return [r, h.length > 1 ? h[h.length-1]/h[h.length-2] - 1 : 0]; }).sort((a,b) => Math.abs(b[1]) - Math.abs(a[1]))[0];
  if (mk && Math.abs(mk[1]) > 0.01) world.push(`Биржа: ${COMMOD[mk[0]].name.toLowerCase()} ${mk[1] > 0 ? "дорожает" : "дешевеет"} на ${pct(Math.abs(mk[1])*100, 1)}.`);
  const hostile = Object.values(C()).filter(x => !x.owner && x.rel < -60).sort((a,b) => a.rel - b.rel)[0];
  if (hostile) world.push(`Аналитики: отношения с ${hostile.name} на грани — ${Math.round(hostile.rel)}.`);
  if (S.wars.length) world.push(`Фронт: ${S.wars.map(w => `${C()[w.enemy].name} — ${w.progress >= 0 ? "наше преимущество" : "противник давит"}`).join("; ")}.`);
  S.prevGdp = Object.fromEntries(Object.values(C()).map(x => [x.id, x.gdp]));
  const issue = {no: (S.issueNo = (S.issueNo || 0) + 1), date: `${MONTHS[(S.month+11)%12]} ${S.month === 0 ? S.year - 1 : S.year}`, lead, others, world,
    poll: {appr: Math.round(S.approval), d: apd, stab: Math.round(S.stability)}, read: false,
    money: {net: S.treasury - before.treasury, gdp: g}};
  S.papers = [issue, ...(S.papers || [])].slice(0, 6);
}
function genWord(w){
  if (w === w.toUpperCase()) return w;
  if (w === "Египет") return "Египта";
  return /ия$/.test(w) ? w.replace(/ия$/, "ии") : /ая$/.test(w) ? w.replace(/ая$/, "ой") : /ея$/.test(w) ? w.replace(/ея$/, "еи") : /[шкгжч]а$/.test(w) ? w.slice(0,-1) + "и"
    : /а$/.test(w) ? w.slice(0,-1) + "ы" : /ь$/.test(w) ? w.slice(0,-1) + "и" : /й$/.test(w) ? w.slice(0,-1) + "я" : /[бвгджзклмнпрстфхцчшщ]$/.test(w) ? w + "а" : w;
}

  let tutSeen = false; try { tutSeen = !!localStorage.getItem(TUT_KEY); } catch(e){}
  if (!tutSeen) setTimeout(() => showTutorial(0), 350);
  else setTimeout(() => advise("sec", `Добро пожаловать в кабинет, господин президент. ${mine.name} ждёт ваших решений.`, {tab:null}), 400);
}

/* ---------- Native shell (Android app via Capacitor) ---------- */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (NATIVE){
  const NP = window.Capacitor.Plugins || {};
  document.documentElement.classList.add("native");
  try { NP.StatusBar && NP.StatusBar.hide(); } catch(e){}
  if (NP.App){
    NP.App.addListener("backButton", () => {
      if (document.getElementById("offline")) return;
      if (BF.open){ closeBattle(); return; }
      if (modalRoot.innerHTML){ const x = modalRoot.querySelector("[data-close],[data-close-offer]"); if (x) x.click(); return; }
      if (ui.more){ ui.more = false; render(); return; }
      if (S && S.countries && !S.over && ui.tab !== "map"){ ui.tab = "map"; render(); return; }
      if (NP.App.minimizeApp) NP.App.minimizeApp(); else NP.App.exitApp();
    });
    NP.App.addListener("pause", () => { pauseFor("hidden"); if (S) save(); });
  }
}
// the game requires an internet connection (ads, purchases, map): block the screen while offline
function netGate(){
  let el = document.getElementById("offline");
  if (navigator.onLine !== false){ if (el){ el.remove(); resumeAfter("offline"); } return; }
  if (el) return;
  el = document.createElement("div"); el.id = "offline"; el.className = "modal"; el.style.zIndex = 50;
  el.innerHTML = `<div class="sheet" style="align-items:center;text-align:center;max-width:420px"><span class="stamp">Нет сети</span><h2>Нужно подключение к интернету</h2><p class="muted" style="margin:0">Игра работает только онлайн. Включите мобильный интернет или Wi-Fi.</p><button class="btn primary" data-netretry>Проверить снова</button></div>`;
  document.body.appendChild(el); pauseFor("offline");
}
window.addEventListener("online", netGate); window.addEventListener("offline", netGate);
document.addEventListener("click", e => { if (e.target.closest("[data-netretry]")){ netGate(); if (!navigator.onLine) toast("Сети всё ещё нет."); } });

/* ---------- Boot ---------- */
if (load()) { ui.tab = "map"; ui.mapFocus = S.player; render(); if (S.pendingVictory) setTimeout(showVictory, 300); } else { S = null; renderStart(); }
netGate();
})();
</script>
