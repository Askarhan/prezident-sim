  premium.speed3 = true; premiumSet(premium); closeModal();
  toast("Скорость ×3 открыта навсегда."); render(); pausedBy = null; setSpeed(3);
}
function adSpeed3(){
  let n = 3;
  const draw = () => { modalRoot.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="sheet"><div class="ad">
    <span class="stamp">Здесь будет рекламный ролик</span><span class="count num">${n}</span>
    <span class="muted">После ролика: ×3 на ${AD_SPEED_MINUTES} минут.</span></div></div></div>`; };
  draw();
  const tm = setInterval(() => { n--; if (n>0) return draw(); clearInterval(tm);
    const base = Math.max(Date.now(), premium.speed3Until || 0);
    premium.speed3Until = base + AD_SPEED_MINUTES*60000; premiumSet(premium); closeModal();
    toast(`Скорость ×3 на ${AD_SPEED_MINUTES} минут.`); render(); pausedBy = null; setSpeed(3); }, 1000);
}
let toastTimer;
function toast(text){
  let el = $(".toast"); if (!el){ el = document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = text; clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.remove(), 2200);
}

/* ---------- Events wiring ---------- */
// a tap on the map re-renders the card under the finger; swallow the click that the same tap fires afterwards
let ghostUntil = 0;
document.addEventListener("click", e => { if (performance.now() < ghostUntil){ ghostUntil = 0; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (ui.more && (!t || !t.closest(".rail"))){ ui.more = false; if (!t){ render(); return; } }
  if (!t) return;
  if (!t.dataset.tab && !t.dataset.setting) sfx("tap");
  if (t.dataset.start){ newGame(t.dataset.start); return; }
  if (t.dataset.startregion){ ui.startRegion = t.dataset.startregion; renderStart(); return; }
  if (t.dataset.dipregion){ ui.dipRegion = t.dataset.dipregion; render(); return; }
  if (t.dataset.tab){ ui.tab = t.dataset.tab; ui.more = false; ui.newConfirm = false; if (t.closest(".adv-card") || t.closest(".inbox-row")) {} render(); return; }
  if (t.dataset.advgo){ ui.tab = t.dataset.advgo; showNextAdvice(); render(); return; }
  if (t.hasAttribute("data-advx")){ showNextAdvice(); return; }
  if (t.dataset.setting){ settings[t.dataset.setting] = !settings[t.dataset.setting]; settingsSave(); sfx("tap"); render(); return; }
  if (t.dataset.tut){ const v = t.dataset.tut; if (v === "skip" || v === "done") tutDone(); else if (v === "restart"){ ui.tab = "map"; render(); showTutorial(0); } else showTutorial(+v.split(":")[1]); return; }
  if (t.hasAttribute("data-closereport")){ closeModal(); resumeAfter("report"); return; }
  if (t.hasAttribute("data-more")){ ui.more = !ui.more; render(); return; }
  if (t.hasAttribute("data-legend")){ ui.legend = !ui.legend; render(); return; }
  if (t.hasAttribute("data-cardx")){ ui.cardHidden = true; render(); return; }
  if (t.hasAttribute("data-cardshow")){ ui.cardHidden = false; render(); return; }
  if (t.dataset.speed !== undefined){ setSpeed(+t.dataset.speed); return; }
  if (t.dataset.buy==="speed3"){ buySpeed3(); return; }
  if (t.hasAttribute("data-adspeed")){ adSpeed3(); return; }
  if (t.hasAttribute("data-close-offer")){ closeModal(); resumeAfter("offer"); return; }
  if (t.dataset.mapzoom){ const [w] = WORLD ? mapSize() : [900,440], h = mapVH(); if (t.dataset.mapzoom==="reset") ui.map = {k:1,x:0,y:null}; else mapZoomAt(w/2, h/2, t.dataset.mapzoom==="in" ? 1.5 : 1/1.5); mapApply(); return; }
  if (t.dataset.mapgo){ ui.tab = "map"; ui.mapSel = t.dataset.mapgo; ui.cardHidden = false; ui.mapFocus = t.dataset.mapgo; render(); window.scrollTo(0,0); return; }
  if (t.dataset.buildcat){ S.buildCat = t.dataset.buildcat; save(); render(); return; }
  if (t.dataset.scenario){ ui.scenario = t.dataset.scenario; renderStart(); return; }
  if (t.dataset.intellevel !== undefined){ S.intel.level = +t.dataset.intellevel; save(); render(); return; }
  if (t.dataset.op){ runOp(t.dataset.op, ui.intelTarget); return; }
  if (t.dataset.vote){ S.council.res.myVote = t.dataset.vote==="abstain" ? null : t.dataset.vote; save(); render(); return; }
  if (t.hasAttribute("data-propose")){ S.treasury -= improveCost()*2; S.council.res = {type:"sanctions", target:ui.propTarget, left:3, proposer:"player", myVote:"yes"}; S.council.propCd = 12; addLog(`Вы внесли в Совет наций резолюцию о санкциях против ${C()[ui.propTarget].name}.`); save(); render(); return; }
  if (t.dataset.ideology){ S.ideology = t.dataset.ideology; S.ideoCd = 24; S.mods.push({stat:"stability",v:-20,left:6},{stat:"approval",v:-5,left:6}); if (ideo("nat")) Object.values(C()).forEach(x=>{ if(!x.owner) x.rel -= 10; }); addLog(`Государство перешло к идеологии «${IDEOLOGIES.find(i=>i.id===S.ideology).name}».`); save(); render(); return; }
  if (t.dataset.research){ S.research.current = t.dataset.research; save(); render(); return; }
  if (t.dataset.science !== undefined){ S.science = +t.dataset.science; save(); render(); return; }
  if (t.dataset.sector){ S.sectors[t.dataset.sector] = +t.dataset.level; save(); render(); return; }
  if (t.dataset.law){ if (!majority()){ S.mods.push({stat:"approval",v:-2,left:6}); addLog("Без большинства в парламенте закон прошёл только через уступки коалиции: рейтинг −2."); } S.laws[t.dataset.law] = !S.laws[t.dataset.law]; addLog(`${S.laws[t.dataset.law]?"Принят":"Отменён"} закон «${LAWS.find(l=>l.id===t.dataset.law).name}».`); checkAchievements(); save(); render(); return; }
  if (t.dataset.choice !== undefined){ chooseEvent(+t.dataset.choice); return; }
  if (t.hasAttribute("data-close")){ closeModal(); return; }
  const a = t.dataset.act; if (!a) return;
  if (a === "next"){ if (S.pendingEvent){ showReport(); return; } nextMonth(); return; }
  if (a === "continue"){ ui.tab="map"; ui.mapFocus = S.player; render(); return; }
  if (a === "wipe"){ storageDel(); S = null; renderStart(); return; }
  if (a === "restart"){ S = null; closeModal(); renderStart(); return; }
  if (a === "mainmenu"){ save(); ui.speed = 0; S = null; advRoot.innerHTML = ""; renderStart(); return; }
  if (a === "newconfirm"){ if (!ui.newConfirm){ ui.newConfirm = true; render(); return; } ui.newConfirm = false; storageDel(); S = null; advRoot.innerHTML = ""; renderStart(); return; }
  act(a, t.dataset.arg);
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.tax) return;
  S.taxes[el.dataset.tax] = +el.value;
  const lbl = el.previousElementSibling; if (lbl) lbl.textContent = el.value + "%";
});
document.addEventListener("change", e => { const d = e.target.dataset || {}; if (d.tax){ save(); render(); } if (d.inteltarget !== undefined){ ui.intelTarget = e.target.value; render(); } if (d.proptarget !== undefined){ ui.propTarget = e.target.value; } });

function newGame(id){
  const scen = ui.scenario || "normal";
  const countries = {};
  COUNTRY_DATA.forEach(([cid,name,region,pop,gdp,army,prof]) => {
    const pc = gdp/pop;
    countries[cid] = { id:cid, name, region, pop, gdp, army, prof:{food:prof[0],oil:prof[1],metal:prof[2],power:prof[3]},
      tech: clamp(Math.round(1 + pc/40), 1, 3), rel:0, trade:false, ally:false, sanction:false, sanctionsUs:false, owner:null, improveCd:0 };
  });
  const mine = countries[id];
  Object.values(countries).forEach(c => { if (c.id===id) return; let r = rnd(-25,25);
    if (c.region===mine.region) r += 15; else if (ADJ[mine.region].includes(c.region)) r += 5; c.rel = Math.round(clamp(r,-60,60)); });
  mine.owner = "player";
  S = { countries, player:id, turn:0, year:2027, month:0,
    treasury: mine.gdp*0.05, debt: mine.gdp*0.4, approval:55, stability:60,
    taxes:{inc:13,corp:20,vat:12}, sectors:{health:1,edu:1,infra:1,police:1},
    laws:{}, buildings:{farm:0,oil:0,mine:0,power:0,factory:0}, queue:[], mods:[], wars:[], log:[],
    hist:{gdp:[mine.gdp], appr:[55]}, terms:0, electionIn:48, lowStab:0, topMonths:0, adCd:0, eventCd:3,
    annexBonus:{food:0,oil:0,metal:0,power:0}, capital:{health:33,edu:33,infra:33,police:33}, research:{current:null, done:{}, prog:{}}, science:1, over:null, last:null, pendingEvent:null };
  migrate(S); S.scenario = scen;
  if (scen==="zero"){ S.treasury = 0; S.debt = mine.gdp*0.9; S.approval = 40; S.stability = 45; }
  if (scen==="crisis"){ Object.values(countries).forEach(c=>c.gdp*=0.9); S.mods.push({stat:"growth",v:-0.003,left:12},{stat:"approval",v:-5,left:12}); }
  if (scen==="coldwar"){ S.aggr = 3; Object.values(countries).forEach(c=>{ if (c.id!==id) c.rel = Math.random()<0.5 ? -55 + rnd(-10,10) : 35 + rnd(-10,10); }); }
  if (scen==="lastchance"){ S.debt = mine.gdp*1.4; S.electionIn = 12; S.approval = 42; S.stability = 50; }
  S.hist.appr = [S.approval];
  addLog(`Вы приняли присягу как глава государства ${mine.name}. Сценарий: «${SCENARIOS.find(s=>s.id===scen).name}». Выборы через ${S.electionIn} мес.`);
  ui.tab = "map"; ui.mapSel = id; ui.map = {k:1,x:0,y:null}; ui.mapFocus = id; ui.speed = 0; pausedBy = null;
  save(); render();
  let tutSeen = false; try { tutSeen = !!localStorage.getItem(TUT_KEY); } catch(e){}
  if (!tutSeen) setTimeout(() => showTutorial(0), 350);
  else setTimeout(() => advise("sec", `Добро пожаловать в кабинет, господин президент. ${mine.name} ждёт ваших решений.`, {tab:null}), 400);
}

/* ---------- Native shell (Android app via Capacitor) ---------- */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
if (NATIVE){
  const NP = window.Capacitor.Plugins || {};
  document.documentElement.classList.add("native");
  try { NP.StatusBar && NP.StatusBar.hide(); } catch(e){}
  if (NP.App){
    NP.App.addListener("backButton", () => {
      if (document.getElementById("offline")) return;
      if (modalRoot.innerHTML){ const x = modalRoot.querySelector("[data-close],[data-close-offer]"); if (x) x.click(); return; }
      if (ui.more){ ui.more = false; render(); return; }
      if (S && S.countries && !S.over && ui.tab !== "map"){ ui.tab = "map"; render(); return; }
      if (NP.App.minimizeApp) NP.App.minimizeApp(); else NP.App.exitApp();
    });
    NP.App.addListener("pause", () => { pauseFor("hidden"); if (S) save(); });
  }
}
// the game requires an internet connection (ads, purchases, map): block the screen while offline
function netGate(){
  let el = document.getElementById("offline");
  if (navigator.onLine !== false){ if (el){ el.remove(); resumeAfter("offline"); } return; }
  if (el) return;
  el = document.createElement("div"); el.id = "offline"; el.className = "modal"; el.style.zIndex = 50;
  el.innerHTML = `<div class="sheet" style="align-items:center;text-align:center;max-width:420px"><span class="stamp">Нет сети</span><h2>Нужно подключение к интернету</h2><p class="muted" style="margin:0">Игра работает только онлайн. Включите мобильный интернет или Wi-Fi.</p><button class="btn primary" data-netretry>Проверить снова</button></div>`;
  document.body.appendChild(el); pauseFor("offline");
}
window.addEventListener("online", netGate); window.addEventListener("offline", netGate);
document.addEventListener("click", e => { if (e.target.closest("[data-netretry]")){ netGate(); if (!navigator.onLine) toast("Сети всё ещё нет."); } });

/* ---------- Boot ---------- */
if (load()) { ui.tab = "map"; ui.mapFocus = S.player; render(); } else { S = null; renderStart(); }
netGate();
})();
</script>
