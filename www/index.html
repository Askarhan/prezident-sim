/* ---- government ---- */
.gov-tabs{margin:0 0 10px;position:sticky;top:-12px;z-index:2;background:#F2F6FC;padding:6px 0}
.gov-tabs .chip{display:inline-flex;align-items:center;gap:6px}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:#1E66D8;cursor:pointer;text-align:left}
.tax-row{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed #E3EAF5}
.tax-row:first-of-type{border-top:0}
.tax-row .face{font-size:28px;line-height:1;text-align:center;filter:drop-shadow(0 2px 3px rgb(0 0 0 / .18))}
.tax-main input{width:100%;accent-color:#F29A12}
.tax-main small{font-size:11px}
.pw-head{background:linear-gradient(135deg,#FFF8E6,#FFFFFF 60%)}
.pw-head.bad{background:linear-gradient(135deg,#FFE9E6,#FFFFFF 60%)}
.pw-head h3{display:flex;align-items:center;gap:8px;margin:0}
.pw-item{padding:5px 0;border-top:1px dashed #E3EAF5}
.pw-chip-row{align-items:flex-start;gap:10px;flex-wrap:wrap}
.pw-chip{border:1px solid #F2C14E;background:#FFF6DA;color:#5A3A00;border-radius:99px;padding:6px 12px;font:600 12px var(--f-body);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.pw-chip.bad{border-color:#E5484D;background:#FFE9E6;color:#7A1E1E}
.min-sum{margin-bottom:6px}
.min-blk{margin:14px 2px 8px;padding-left:10px;border-left:4px solid var(--mc,#C77DFF);font-size:15px}
.min-grid,.law-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.mincard{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start;background:#fff;border:1px solid #DCE5F2;border-left:4px solid var(--mc);border-radius:14px;padding:10px;box-shadow:0 2px 6px rgb(20 40 80 / .06)}
.min-face{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:12px}
.min-face .portrait{display:block;border-radius:12px}
.min-face .tier{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font:700 9px var(--f-body);font-style:normal;background:#1C2A44;color:#FFE27A;border-radius:99px;padding:1px 6px;white-space:nowrap}
.min-face .tier.t1{background:#8A97AD;color:#fff}
.min-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.min-name{display:inline-flex;align-items:center;gap:5px;font-size:13px}
.min-who{border:0;background:none;padding:0;font:500 12px var(--f-body);color:#1E66D8;text-align:left;cursor:pointer}
.minbar{display:flex;align-items:center;gap:3px}
.minbar .seg-i{flex:1;height:16px;min-width:8px;border:1px solid #D3DCEA;background:#EEF2F8;border-radius:4px;padding:0;cursor:pointer;position:relative}
.minbar .seg-i.on{background:linear-gradient(180deg,#FFC24A,#F29A12);border-color:#D98A0A}
.minbar .seg-i.def::after{content:"";position:absolute;right:-3px;top:-4px;bottom:-4px;width:2px;background:#1C2A44;border-radius:2px}
.minbar .mb-step{width:26px;height:26px;border-radius:8px;border:1px solid #D3DCEA;background:#fff;font:700 15px var(--f-body);line-height:1;cursor:pointer;padding:0}
.minbar .mb-step:disabled{opacity:.35}
.minbar .mb-lv{min-width:34px;text-align:right;font-size:12px}
.min-fx{font-size:11px;line-height:1.35}
.lawcard{background:#fff;border:1px solid #DCE5F2;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 2px 6px rgb(20 40 80 / .06)}
.lawcard.on{border-color:#1FB57A;box-shadow:0 0 0 2px rgb(31 181 122 / .25)}
.lawcard .switch{grid-row:auto;grid-column:auto;flex:none}
.lawcard .pro{color:#15935F;font-size:12px}
.lawcard .con{color:#D23B3B;font-size:12px}
.minpick{max-width:560px}
.minpick h2{margin:0}
.cand{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid #DCE5F2;border-radius:14px;background:#fff}
.cand .portrait{border-radius:12px;display:block}
.cand.cur{background:#F5F8FD}
.cand.star{border-color:#F2C14E;background:linear-gradient(135deg,#FFF8E1,#fff)}
.cand-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.cand-body small{font-size:11px}
.cand-body span{font-size:12px}
.cands{display:flex;flex-direction:column;gap:8px;margin-top:8px}
@media (max-width:700px){ .min-grid,.law-grid{grid-template-columns:1fr} }

/* ---- facilities ---- */
.build-mode{margin:0 0 10px}
.build-mode .chip,.fac-cats .chip{display:inline-flex;align-items:center;gap:6px}
.fac-cats{margin:10px 0}
.fac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.fcard{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:start;background:#fff;border:1px solid #DCE5F2;border-radius:16px;padding:10px;box-shadow:0 2px 6px rgb(20 40 80 / .06)}
.fcard.busy{border-color:#F2C14E;background:linear-gradient(135deg,#FFF9E8,#fff)}
.fcard.bad{border-color:#F0B4AE;background:linear-gradient(135deg,#FFF1EF,#fff)}
.f-ic{width:80px;height:80px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#EAF4FF,#D5E6F8);display:grid;place-items:center}
.f-ic .iso{filter:drop-shadow(0 3px 3px rgb(20 40 80 / .25))}
.f-body{display:flex;flex-direction:column;gap:5px;min-width:0}
.f-body b{font-size:13px}
.f-body small{font-size:11px;line-height:1.35}
.f-n{font:700 18px var(--f-data);color:#1C2A44}
.f-prog{display:flex;flex-direction:column;gap:3px}
@media (max-width:700px){ .fac-grid{grid-template-columns:1fr} }

/* ---- country window ---- */
.cbanner{position:relative;display:grid;grid-template-columns:86px 1fr 86px;align-items:center;gap:8px;margin:0 0 10px;padding:12px 8px 10px;border-radius:16px;
  background:linear-gradient(180deg,#1E4E8C,#163866);color:#fff;box-shadow:inset 0 -3px 0 rgb(0 0 0 / .2),0 6px 16px rgb(20 40 80 / .25)}
.cb-mid{text-align:center;min-width:0}
.cb-mid h2{margin:0 0 6px;font-size:20px;letter-spacing:.02em;text-shadow:0 2px 3px rgb(0 0 0 / .35)}
.cb-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.cb-stats span{display:inline-flex;align-items:center;gap:5px}
.cb-rel i{font-style:normal;font-size:18px}
.cb-rel{color:#FFE27A}
.cb-tags{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:6px}
.cb-flag{width:78px;height:52px;object-fit:cover;border-radius:4px;box-shadow:0 4px 10px rgb(0 0 0 / .35);justify-self:center}
.cb-flag.l{transform:perspective(160px) rotateY(18deg) rotate(-4deg)}
.cb-flag.r{transform:perspective(160px) rotateY(-18deg) rotate(4deg)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dcard{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:center;background:#FFFDF8;border:1px solid #E5DCC8;border-radius:14px;padding:8px 8px 10px;cursor:pointer;font:inherit;color:inherit;box-shadow:0 2px 6px rgb(60 40 10 / .08)}
.dcard:hover{border-color:#F2A93B}
.dcard.on{border-color:#1FB57A;box-shadow:0 0 0 2px rgb(31 181 122 / .25)}
.dcard.off{opacity:.55;cursor:not-allowed}
.dcard b{font-size:13px;line-height:1.2}
.dcard small{font-size:11px;color:var(--muted);line-height:1.3}
.dc-pic{position:relative;height:64px;border-radius:10px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgb(255 255 255 / .25)}
.dc-pic .ci,.dc-pic .ic{width:38px;height:38px;filter:drop-shadow(0 3px 4px rgb(0 0 0 / .35))}
.dc-pic .ic{color:#fff}
.dc-on{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:#1FB57A;color:#fff;font:700 12px/20px var(--f-body);font-style:normal}
.war-zone{margin-top:10px;border-color:#F0B4AE}
@media (max-width:700px){ .cbanner{grid-template-columns:56px 1fr 56px} .cb-flag{width:52px;height:36px} }

/* ---- organisations ---- */
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:10px}
.org{background:#fff;border:1px solid #DCE5F2;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 6px rgb(20 40 80 / .06)}
.org.on{border-color:#1FB57A;box-shadow:0 0 0 2px rgb(31 181 122 / .22)}
.org-head{display:flex;gap:10px;align-items:center}
.org-head>div{display:flex;flex-direction:column;min-width:0}
.org-head b{font-size:15px}
.org-head small{font-size:11px}
.org-badge{flex:none;filter:drop-shadow(0 3px 4px rgb(0 0 0 / .25))}
.org-flags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.org small{font-size:12px;line-height:1.35}
.cb-orgs{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:6px}
.cb-orgs span{font:700 10px var(--f-body);letter-spacing:.04em;padding:2px 7px;border-radius:99px;background:rgb(255 255 255 / .15);border:1px solid rgb(255 255 255 / .3)}
.cb-orgs span.mine{background:#FFD24A;color:#3A2400;border-color:#FFD24A}

/* ---- intelligence ---- */
.net-row{padding:6px 0;border-top:1px dashed #E3EAF5}
.net-dots{display:inline-flex;gap:4px}
.net-dots i{width:12px;height:12px;border-radius:50%;background:#DCE5F2;border:1px solid #C6D1E2}
.net-dots i.on{background:linear-gradient(180deg,#5AA9FF,#1F4E9C);border-color:#1F4E9C}

/* ---- daily gift + newspaper ---- */
.map-side{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:2}
.map-screen:has(.map-card) .map-side{display:none}
.side-btn{position:relative;width:60px;min-height:60px;border-radius:16px;border:0;background:#fff;box-shadow:0 3px 10px rgb(0 0 0 / .28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;cursor:pointer}
.side-btn .ci,.side-btn .ic{width:28px;height:28px}
.side-btn small{font:700 10px var(--f-data);color:#1C2A44}
.side-btn.gift.ready{background:linear-gradient(180deg,#FFE27A,#F29A12);animation:giftPulse 1.4s ease-in-out infinite}
.side-btn.gift.ready small{color:#3A2400}
@keyframes giftPulse{50%{transform:scale(1.07);box-shadow:0 0 0 6px rgb(255 210 74 / .35),0 3px 10px rgb(0 0 0 / .28)}}
.side-btn .badge{position:absolute;right:-4px;top:-4px}
.giftsheet{max-width:720px}
.giftsheet h2{display:flex;align-items:center;gap:8px;margin:0}
.gift-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
.gday{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:8px 4px;border-radius:14px;background:#F2F6FC;border:1px solid #DCE5F2}
.gday b{font-size:11px}
.gday small{font-size:10px;color:var(--muted)}
.gday .gic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 4px rgb(0 0 0 / .1)}
.gday.now{background:linear-gradient(180deg,#FFF3C4,#FFE27A);border-color:#F2A93B;box-shadow:0 0 0 3px rgb(242 169 59 / .3)}
.gday.got{opacity:.6}
.gday.big{background:linear-gradient(180deg,#F3E8FF,#E3CCFF);border-color:#B98AF0}
.gday.big.now{background:linear-gradient(180deg,#FFF3C4,#FFE27A)}
.gok{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:#1FB57A;color:#fff;font:700 11px/18px var(--f-body);font-style:normal}
.sheet.paper{max-width:760px;background:#F6F1E4;color:#231E14;font-family:Georgia,"Times New Roman",serif;border:1px solid #D8CDB4}
.np-top{display:flex;justify-content:space-between;align-items:center}
.np-top small{font:600 11px var(--f-data);color:#6B5E44;letter-spacing:.06em;text-transform:uppercase}
.np-mast{margin:4px 0 0;text-align:center;font:900 34px/1.05 Georgia,"Times New Roman",serif;letter-spacing:.01em}
.np-rule{display:flex;justify-content:space-between;border-top:3px double #231E14;border-bottom:1px solid #231E14;padding:3px 2px;margin:6px 0 10px;font:600 10px var(--f-data);text-transform:uppercase;letter-spacing:.08em}
.np-rub{display:block;font:700 10px var(--f-data);color:#A0322A;text-transform:uppercase;letter-spacing:.08em}
.np-lead h2{margin:2px 0 10px;font:800 24px/1.15 Georgia,serif;color:#231E14}
.np-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;border-top:1px solid #B9A57E;padding-top:10px}
.np-cols article{margin:0 0 10px}
.np-cols p{margin:2px 0;font-size:14px;line-height:1.4}
.np-box{background:#EDE4CF;border:1px solid #D8CDB4;border-radius:6px;padding:8px}
.np-arch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid #B9A57E;padding-top:8px;font:600 11px var(--f-data)}
@media (max-width:700px){ .gift-days{grid-template-columns:repeat(4,1fr)} .np-cols{grid-template-columns:1fr} .np-mast{font-size:26px} }

/* ---- macro ---- */
.mgauges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.mgauge{background:#fff;border:1px solid #DCE5F2;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 6px rgb(20 40 80 / .06)}
.mgauge b{font:700 22px var(--f-data);color:#1C2A44}
.mgauge small{font-size:11px}
.mgauge.good{border-color:#9ED8B8} .mgauge.good b{color:#15935F}
.mgauge.bad{border-color:#F0B4AE} .mgauge.bad b{color:#D23B3B}
@media (max-width:700px){ .mgauges{grid-template-columns:repeat(2,1fr)} }


/* ===================== HQ THEME v2 — по макету владельца =====================
   Near-black navy, square corners, hairline gold frames with corner ticks, bold Cyrillic serif for titles,
   solid monochrome HUD glyphs (grey at rest, gold when active), skyline silhouettes in headers. */
:root{
  --skyline:none;
  --paper:#0A111D; --panel:#101A2A; --panel-2:#15213A; --line:#263652; --line-2:#334766;
  --ink:#E8E3D6; --muted:#8E9AB0;
  --gold:#D4AF61; --gold-hi:#F1D592; --gold-lo:#8A6B2E; --on-gold:#1E1607;
  --accent:#D4AF61; --on-accent:#1E1607;
  --state:#8DB6E6; --state-soft:#16243C;
  --good:#4FBF7A; --warn:#E7B347; --bad:#E0584F;
  --glow:none;
  --f-serif:"PT Serif","Cormorant SC",Georgia,serif;
  --f-data:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --frame:inset 0 0 0 1px rgb(212 175 97 / .55);
  color-scheme:dark;
}
:root body{background:#0A111D;color:var(--ink)}
:root .num{font-variant-numeric:tabular-nums}

/* corner ticks: a thin gold frame with brighter L-shaped corners */
.gframe{position:relative}
.gframe::after,:root .window::after,:root .sheet::after,:root .cbanner::after{content:"";position:absolute;inset:3px;pointer-events:none;border-radius:2px;
  background:
    linear-gradient(var(--gold-hi),var(--gold-hi)) left top/14px 2px no-repeat, linear-gradient(var(--gold-hi),var(--gold-hi)) left top/2px 14px no-repeat,
    linear-gradient(var(--gold-hi),var(--gold-hi)) right top/14px 2px no-repeat, linear-gradient(var(--gold-hi),var(--gold-hi)) right top/2px 14px no-repeat,
    linear-gradient(var(--gold-hi),var(--gold-hi)) left bottom/14px 2px no-repeat, linear-gradient(var(--gold-hi),var(--gold-hi)) left bottom/2px 14px no-repeat,
    linear-gradient(var(--gold-hi),var(--gold-hi)) right bottom/14px 2px no-repeat, linear-gradient(var(--gold-hi),var(--gold-hi)) right bottom/2px 14px no-repeat;
  opacity:.85}

/* type */
:root .panel>h3,:root .panel>.row>h3,:root .branch h3,:root h3.min-blk{font-family:var(--f-serif)!important;font-size:18px!important;font-weight:700;text-transform:none;letter-spacing:0;color:var(--gold-hi)}
:root .label{text-transform:none;letter-spacing:0;font-size:12px;line-height:1.45;color:var(--muted)}
:root .stamp{color:var(--gold);letter-spacing:.04em}

/* HUD glyphs */
.hic{width:22px;height:22px;fill:currentColor;flex:none}

/* top bar */
:root .topbar{background:#0B1322;border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgb(0 0 0 / .5);gap:8px}
:root .tb-flag{background:#5A1414;border:1px solid var(--gold-lo);border-radius:4px}
:root .tb-kpis{gap:6px}
:root .tb-kpis .kpi{flex-direction:row;align-items:center;gap:9px;background:#111C2E;border:1px solid var(--line);border-radius:4px;padding:5px 10px;box-shadow:none}
:root .tb-kpis .kpi .kpi-ic{color:var(--gold);display:grid;place-items:center}
:root .tb-kpis .kpi .kpi-ic .hic{width:26px;height:26px}
:root .tb-kpis .kpi .kpi-t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
:root .tb-kpis .kpi .label{color:var(--muted);font-size:11px;letter-spacing:0}
:root .tb-kpis .kpi .v{color:var(--ink);font-family:var(--f-data);font-weight:600;font-size:16px}
:root .tb-kpis .kpi .kd{font:600 10.5px var(--f-data);white-space:nowrap}
:root .tb-time{background:#111C2E;border:1px solid var(--line);border-radius:4px;padding:4px 6px 4px 10px;gap:10px}
:root .tb-time .clock{min-width:120px}
:root .clock-row{display:flex;align-items:center;gap:8px;color:var(--gold)}
:root .clock-row .hic{width:24px;height:24px}
:root .tb-time .clock-top b{color:var(--ink);font:700 15px var(--f-data)}
:root .clock-wd{font-size:11px;color:var(--muted)}
:root .tb-time .clock-track{background:#0A111D;height:3px}
:root .tb-time .clock-track>i{background:var(--gold)}
:root .speeds{background:#0D1626;border:1px solid var(--line-2);border-radius:4px}
:root .speeds button{background:transparent;color:var(--ink)}
:root .speeds button+button{border-left-color:var(--line)}
:root .speeds button[aria-pressed="true"]{background:#1D2A44;color:var(--gold-hi);box-shadow:inset 0 -2px 0 var(--gold)}
:root .speeds button.locked{color:#56637A}
:root .tb-btn{background:#111C2E;border:1px solid var(--line);border-radius:4px;color:var(--muted);box-shadow:none}
:root .tb-sec{border-color:var(--gold-lo)}

/* dock: flat bar with hairline dividers, gold underline on the active tab */
:root .dock{background:#0B1322;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgb(0 0 0 / .5);gap:0;padding-top:0;padding-bottom:env(safe-area-inset-bottom,0px)}
:root .tile{flex:1 1 0;width:auto;max-width:150px;gap:2px;padding:7px 2px 6px;color:var(--muted);font:500 12px var(--f-body);letter-spacing:0;text-transform:none;border-left:1px solid #1A2538}
:root .tile:first-child{border-left:0}
:root .tile-ic{width:auto;height:30px;background:none;border:0;box-shadow:none;color:#A9B2C2}
:root .tile-ic .hic{width:28px;height:28px}
:root .tile[aria-current="page"]{color:var(--gold-hi);background:linear-gradient(180deg,#1A253A,#141E30);box-shadow:inset 0 -3px 0 var(--gold)}
:root .tile[aria-current="page"] .tile-ic{background:none;box-shadow:none;color:var(--gold)}
:root .tile .badge{top:2px;right:calc(50% - 26px)}
:root .badge{border:2px solid #0B1322}

/* windows */
:root .win-scrim{background:rgb(3 7 14 / .6);backdrop-filter:blur(2px)}
:root .window{background:#0C1525;border:1px solid var(--gold-lo);border-radius:4px;box-shadow:0 24px 60px rgb(0 0 0 / .65)}
:root .win-head{position:relative;background:#0F1A2C var(--skyline) right bottom/auto 92% no-repeat;border-bottom:1px solid var(--line);color:var(--ink);padding:8px 10px 8px 16px;box-shadow:none}
:root .win-head::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0F1A2C 35%,rgb(15 26 44 / .55) 75%,rgb(15 26 44 / .2));pointer-events:none}
:root .win-head>*{position:relative}
:root .win-head h2{font-family:var(--f-serif);font-size:26px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink);background:none;box-shadow:none;padding:0;text-shadow:0 2px 4px rgb(0 0 0 / .5)}
:root .win-ic{width:34px;height:34px;background:none;border:0;color:var(--muted)}
:root .win-ic .hic{width:30px;height:30px}
:root .win-x{width:44px;height:36px;background:#141F33;border:1px solid var(--line-2);border-radius:4px;color:var(--ink)}
:root .win-x:hover{border-color:var(--gold);color:var(--gold-hi);background:#1A2740}
:root .tip{background:#111C2E;border:1px solid var(--line);border-radius:4px}
:root .gov-tabs,:root .armytabs{background:#0C1525}

/* tabs: equal-width dark slabs, gold when active */
:root .gov-tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto}
:root .gov-tabs .chip{flex:1 1 0;min-width:max-content;justify-content:center;gap:12px;padding:10px 16px;border-radius:3px;font:500 15px var(--f-body)}
:root .gov-tabs .chip .ci,:root .gov-tabs .chip .ic{width:22px;height:22px;filter:grayscale(1) brightness(1.6) contrast(.8)}
:root .gov-tabs .chip[aria-pressed="true"] .ci,:root .gov-tabs .chip[aria-pressed="true"] .ic{filter:grayscale(1) brightness(.25)}

/* surfaces */
:root .panel{background:#101A2A;border:1px solid var(--line);border-radius:4px;box-shadow:none}
:root .country-card,:root .bcard,:root .unit,:root .qitem,:root .tech,:root .ideo,:root .scen,:root .choice,:root .resolution,:root .ach{background:#131F33!important;border-color:var(--line);border-radius:4px}
:root .country-card:hover,:root .bcard:hover,:root .unit:hover,:root .choice:hover{border-color:var(--gold)}
:root .tech.done{background:#13291F!important;border-color:var(--good)}
:root .ucard,:root .mincard,:root .lawcard,:root .fcard,:root .org,:root .cand,:root .mgauge,:root .dcard{background:#131F33;border-color:var(--line);border-radius:4px;box-shadow:none;color:var(--ink)}
:root .mincard{border-left:3px solid var(--mc)}
:root .ucard.have{border-color:var(--gold-lo)}
:root .lawcard.on,:root .org.on{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
:root .dcard:hover{border-color:var(--gold)}
:root .dc-pic,:root .f-ic,:root .mgauge,:root .side-btn,:root .gday,:root .gday .gic{border-radius:4px}
:root .f-ic{background:radial-gradient(circle at 50% 40%,#22344F,#121D30)}
:root .fcard.busy{background:linear-gradient(135deg,#2A2616,#131F33);border-color:var(--gold-lo)}
:root .fcard.bad{background:linear-gradient(135deg,#351C20,#131F33);border-color:#6E2E33}
:root .f-n,:root .mgauge b{color:var(--ink)}
:root .cand.cur{background:#101A2A} :root .cand.star{background:linear-gradient(135deg,#2E2614,#131F33);border-color:var(--gold)}
:root .pw-head{background:#101A2A} :root .pw-head.bad{background:linear-gradient(135deg,#351C20,#101A2A)}
:root .pw-chip{background:#1E1C14;border-color:var(--gold-lo);color:var(--gold-hi);border-radius:3px} :root .pw-chip.bad{background:#351C20;border-color:#6E2E33;color:#F0B4AE}
:root .minbar .seg-i{background:#0A111D;border-color:var(--line-2);border-radius:2px} :root .minbar .seg-i.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:var(--gold-lo)}
:root .minbar .seg-i.def::after{background:var(--ink)}
:root .minbar .mb-step{background:#0A111D;border-color:var(--line-2);color:var(--gold-hi);border-radius:3px}
:root .min-who,:root .linkbtn{color:var(--state)}
:root .net-dots i{background:#0A111D;border-color:var(--line-2)}
:root .net-row,:root .pw-item,:root .tax-row{border-top-color:#1E2B42}
:root .bar{background:#0A111D;border-radius:2px} :root .bar>i{border-radius:2px}
:root .rel{background:linear-gradient(90deg,#E0584F,#263652 50%,#4FBF7A)}
:root .pill{background:#0A111D;border-color:var(--line-2);border-radius:3px}

/* controls */
:root .btn{background:#141F33;border:1px solid var(--line-2);border-radius:3px;color:var(--ink);box-shadow:none}
:root .btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold-hi)}
:root .btn.primary{background:linear-gradient(180deg,#E6C67C,#C89D4E 55%,#AE8640);border-color:#8A6B2E;color:var(--on-gold);box-shadow:inset 0 1px 0 rgb(255 240 200 / .55),0 2px 0 #4D3A16}
:root .btn.primary:hover:not(:disabled){color:var(--on-gold);filter:brightness(1.05)}
:root .btn.danger{background:transparent;border-color:var(--bad);color:#F0A8A2}
:root .btn:disabled{opacity:.45}
:root .chip{background:#141F33;border:1px solid var(--line-2);border-radius:3px;color:var(--ink)}
:root .chip[aria-pressed="true"]{background:linear-gradient(180deg,#E6C67C,#C89D4E 55%,#AE8640);border-color:#8A6B2E;color:var(--on-gold);font-weight:700}
:root .seg{background:#0A111D;border-color:var(--line-2);border-radius:3px} :root .seg button{background:transparent;color:var(--ink)} :root .seg button+button{border-left-color:var(--line)}
:root .seg button[aria-pressed="true"]{background:linear-gradient(180deg,#E6C67C,#C89D4E);color:var(--on-gold)}
:root .switch{background:#0A111D;border-color:var(--line-2)} :root .switch::after{background:var(--ink)}
:root .select{background:#0A111D;color:var(--ink);border-color:var(--line-2);border-radius:3px}
:root .tax-main input,:root .slider input{accent-color:var(--gold)}

/* advisor cards, modals */
:root .adv-card{background:#101A2A;border:1px solid var(--gold-lo);border-radius:4px;box-shadow:0 14px 34px rgb(0 0 0 / .6)}
:root .adv-x{background:#141F33;border-color:var(--line-2);color:var(--ink);border-radius:3px}
:root .modal{background:rgb(3 7 14 / .62)}
:root .sheet{position:relative;background:#0D1727;border:1px solid var(--gold-lo);border-radius:4px;box-shadow:0 24px 60px rgb(0 0 0 / .65);color:var(--ink)}
:root .sheet h2{font-family:var(--f-serif);font-size:28px;font-weight:700;color:var(--gold-hi)}
:root .sheet blockquote{background:#0A111D;border-left-color:var(--gold)}
:root .sheet.dossier{background:#0D1727} :root .sheet.dossier blockquote{background:#0A111D;border-left-color:var(--state)}
:root .toast{background:#E6C67C;color:var(--on-gold);border-radius:4px}
:root .sheet.paper{background:#F2EBDA;color:#231E14;border-color:#C9B48A}
:root .sheet.paper::after{display:none}
:root .sheet.paper h2{font-family:Georgia,"Times New Roman",serif;color:#231E14;font-size:24px}
:root .sheet.paper .chip{background:#E6DCC3;color:#231E14;border-color:#C9B48A}

/* daily gift */
:root .giftsheet{background:#0D1727 var(--skyline) right 18px/auto 160px no-repeat}
:root .giftsheet>.row h2{display:flex;align-items:center;gap:12px}
:root .giftsheet>.row h2 .gtitle-ic{position:relative;width:54px;height:54px;color:var(--gold);display:grid;place-items:center}
:root .giftsheet>.row h2 .gtitle-ic .laurel{position:absolute;inset:0;width:54px;height:54px}
:root .giftsheet>.row h2 .gtitle-ic .hic{width:24px;height:24px}
:root .giftsheet p{font-family:var(--f-serif);color:var(--ink)!important;font-size:15px}
:root .gift-days{gap:10px}
:root .gday{position:relative;background:#101A2A;border:1px solid var(--line-2);padding:10px 6px 12px;gap:6px}
:root .gday small{font-family:var(--f-serif);color:var(--muted);font-size:12px}
:root .gday>small:first-child{color:var(--ink);font-weight:700;font-size:13px}
:root .gday b{font-family:var(--f-serif);font-size:15px;color:var(--ink)}
:root .gday .gic{position:relative;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1E2B42,#0A111D);box-shadow:inset 0 0 0 1px #2E3F5E,0 2px 6px rgb(0 0 0 / .5)}
:root .gday .gic .ci{width:34px;height:34px}
:root .gday .gic .laurel{position:absolute;inset:-12px;width:88px;height:88px;color:var(--gold)}
:root .gday.now{background:linear-gradient(180deg,#5A4518,#2E2410);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold-hi),0 0 18px rgb(212 175 97 / .35)}
:root .gday.now b{color:var(--gold-hi)}
:root .gday.big{background:linear-gradient(180deg,#2E2450,#18173A);border-color:#7E64C0}
:root .gday.big b{color:var(--gold-hi)}
:root .gday.got{opacity:.55}

/* map overlay */
:root .map-tools button,:root .side-btn{background:#101A2A;border:1px solid var(--line-2);border-radius:4px;color:var(--muted);box-shadow:0 4px 12px rgb(0 0 0 / .45)}
:root .side-btn small{color:var(--ink);font-family:var(--f-body);font-weight:500}
:root .side-btn.gift.ready{background:linear-gradient(180deg,#5A4518,#2E2410);border-color:var(--gold);color:var(--gold-hi)}
:root .side-btn.gift.ready small{color:var(--gold-hi)}
:root .side-btn .hic{width:28px;height:28px}
:root .map-modes>button,:root .res-modes button,:root .mode-leg{background:#101A2A;border-color:var(--line-2);border-radius:4px;color:var(--ink)}
:root .map-modes>button[aria-pressed="true"]{background:linear-gradient(180deg,#E6C67C,#C89D4E);color:var(--on-gold)}
:root .map-screen .legend{background:rgb(16 26 42 / .95);color:var(--ink);border-color:var(--line-2);border-radius:4px}
:root .map-card>.panel{background:rgb(16 26 42 / .97);border-color:var(--gold-lo)}
:root .card-x{background:#141F33;border-color:var(--line-2);color:var(--ink)}
:root .topbar .ci,:root .map-tools .ci,:root .map-modes .ci,:root .tb-btn .ci{filter:grayscale(1) brightness(1.5) contrast(.85)}

/* country banner */
:root .cbanner{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:18px 22px;border-radius:4px;
  background:#0F1A2C var(--skyline) right bottom/auto 100% no-repeat;border:1px solid var(--line-2);box-shadow:none}
:root .cbanner::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0F1A2C 40%,rgb(15 26 44 / .6) 80%,rgb(15 26 44 / .35));pointer-events:none;border-radius:4px}
:root .cbanner>*{position:relative}
:root .cb-flag{width:128px;height:86px;object-fit:cover;border-radius:2px;transform:none!important;box-shadow:0 6px 14px rgb(0 0 0 / .55)}
:root .cb-flag.r{width:104px;height:70px}
:root .cb-mid{text-align:left}
:root .cb-mid h2{font-family:var(--f-serif);font-size:30px;color:var(--ink);margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line-2);text-shadow:none}
:root .cb-mid h2 .cap{color:var(--gold-hi)}
:root .cb-stats{justify-content:flex-start;gap:0}
:root .cb-stats>span{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:0 18px;border-left:1px solid var(--line-2)}
:root .cb-stats>span:first-child{padding-left:0;border-left:0}
:root .cb-stats>span>.hic,:root .cb-stats>span>.cb-face{grid-row:1/3;width:26px;height:26px;color:var(--muted);font-size:24px;font-style:normal}
:root .cb-stats>span>b{font:600 18px var(--f-data);color:var(--ink)}
:root .cb-stats>span>small{font-size:12px;color:var(--muted)}
:root .cb-rel b{color:var(--gold-hi)!important}
:root .cb-orgs{justify-content:flex-start;margin-top:12px;gap:8px}
:root .cb-orgs span{background:transparent;border:1px solid var(--line-2);border-radius:3px;padding:4px 14px;font:700 12px var(--f-body);color:var(--ink)}
:root .cb-orgs span.mine{background:transparent;border-color:var(--gold-lo);color:var(--gold-hi)}
:root .cb-tags{justify-content:flex-start}

/* start screen */
:root .start-head{position:relative;background:#0F1A2C var(--skyline) right bottom/auto 70% no-repeat;border:1px solid var(--gold-lo);border-radius:4px;box-shadow:0 18px 40px rgb(0 0 0 / .5)}
:root .start-head::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0F1A2C 45%,rgb(15 26 44 / .4));pointer-events:none}
:root .start-head>*{position:relative}
:root .start-head h1{font-family:var(--f-serif);text-transform:none;letter-spacing:0;background:none!important;color:var(--gold-hi)!important;-webkit-text-fill-color:var(--gold-hi)}
:root .start-head p{color:var(--ink)!important}
:root .start-emblem{display:none}
:root .seal{color:var(--gold-hi);border-color:var(--gold-lo);background:#101A2A;border-radius:3px}
:root .continue{background:#101A2A;border-color:var(--gold-lo);border-radius:4px}
@media (max-width:820px){ :root .tb-kpis .kpi .kd{display:none} :root .tb-kpis .kpi .kpi-ic .hic{width:20px;height:20px} :root .tb-kpis .kpi .v{font-size:14px} :root .clock-wd{display:none}
  :root .win-head h2{font-size:21px} :root .tile{font-size:10.5px} :root .tile-ic .hic{width:23px;height:23px} :root .gov-tabs .chip{font-size:13px;padding:8px 10px;gap:8px}
  :root .cb-flag{width:84px;height:56px} :root .cb-flag.r{display:none} :root .cbanner{grid-template-columns:auto 1fr} :root .cb-mid h2{font-size:22px}
  :root .cb-stats{row-gap:8px;flex-wrap:wrap} :root .cb-stats>span{padding:0 10px} :root .cb-stats>span>b{font-size:15px} }
@media (max-width:820px) and (max-height:420px){ :root .tb-time .clock{min-width:96px} }
@media (prefers-reduced-motion:reduce){ :root .side-btn.gift.ready{animation:none} }

:root .big-act{display:inline-flex;align-items:center;gap:12px;padding:12px 26px;font:700 16px var(--f-serif)}
:root .big-act .hic{width:24px;height:24px}
:root .gov-tabs .chip .hic{width:24px;height:24px;color:#A9B2C2}
:root .gov-tabs .chip[aria-pressed="true"] .hic{color:var(--on-gold)}

:root .tb-time{flex:0 1 auto;min-width:0}
:root .tb-time .clock{min-width:0}
:root .clock-top{flex-wrap:nowrap;gap:8px}
:root .tb-time .clock-top b{white-space:nowrap}
:root .tb-kpis .kpi{padding:4px 8px;gap:7px}
:root .tb-kpis .kpi .kpi-t{overflow:hidden}
@media (max-width:1100px){ :root .clock-wd{display:none} }
@media (max-width:900px){ :root .clock-row>.hic{display:none} :root .tb-kpis .kpi .kpi-ic{display:none} }
:root .giftsheet{background-size:auto 130px}

@media (max-width:900px){ :root .cb-flag.r{display:none} :root .cbanner{grid-template-columns:auto 1fr;gap:16px;padding:14px 16px} :root .cb-flag{width:96px;height:64px}
  :root .cb-mid h2{font-size:24px;margin-bottom:8px;padding-bottom:8px} :root .cb-stats>span{padding:0 12px} :root .cb-stats>span>b{font-size:15px} :root .cb-stats>span>.hic{width:22px;height:22px} }
@media (max-height:500px){ :root .giftsheet{padding:12px 16px;background-size:auto 90px} :root .giftsheet>.row h2{font-size:22px} :root .giftsheet>.row h2 .gtitle-ic{width:40px;height:40px} :root .giftsheet>.row h2 .gtitle-ic .laurel{width:40px;height:40px}
  :root .giftsheet p{font-size:13px} :root .gift-days{margin:8px 0;gap:6px} :root .gday{padding:6px 4px 8px;gap:3px} :root .gday .gic{width:44px;height:44px} :root .gday .gic .ci{width:24px;height:24px}
  :root .gday .gic .laurel{inset:-8px;width:60px;height:60px} :root .gday b{font-size:13px} :root .gday small{font-size:11px} :root .big-act{padding:8px 16px;font-size:14px} }

/* ===== compact HUD (29.10): name · budget · research · date; slim dock; painted icons ===== */
.pic{display:inline-block;width:20px;height:20px;vertical-align:-5px;border-radius:50%;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px rgb(0 0 0 / .45))}
.pic.sm{width:17px;height:17px;vertical-align:-4px}
.pic.lg{width:40px;height:40px}
.pic.cal{border-radius:0;width:20px;height:20px}
:root .topbar{min-height:42px!important;padding-top:3px!important;padding-bottom:3px!important;gap:8px}
:root .tb-who{flex:1 1 auto!important;min-width:0}
:root .tb-name{display:flex!important}
:root .tb-name b{font-size:14px}
:root .tb-name .tb-sub{font-size:10.5px}
:root .tb-flag{position:relative}
:root .tb-flag .badge{position:absolute;top:-5px;right:-7px}
:root .tb-kpis{flex:0 0 auto!important;gap:6px}
:root .tb-kpis .kpi{flex:0 0 auto!important;flex-direction:row!important;align-items:center;gap:7px;height:36px;padding:2px 12px 2px 3px!important;border-radius:999px!important}
:root .tb-kpis .kpi .kpi-ic{width:30px;height:30px;display:grid;place-items:center;background:none!important;border:0!important;box-shadow:none!important}
:root .tb-kpis .kpi .kpi-ic .pic{width:30px;height:30px;vertical-align:0}
:root .tb-kpis .kpi .kpi-t{display:flex;flex-direction:column;line-height:1.05}
:root .tb-kpis .kpi .label{display:none!important}
:root .tb-kpis .kpi .v{font-size:15px!important}
:root .tb-kpis .kpi .kd{display:block!important;font-size:10px}
:root .tb-kpis .k-rp{display:flex!important}
:root .tb-time .clock-row{display:flex;align-items:center;gap:6px}
:root .tb-btn{width:36px!important;height:36px!important}
/* dock: ~44px tall */
:root .dock{padding-top:3px!important;padding-bottom:calc(3px + env(safe-area-inset-bottom,0px))!important;gap:2px}
:root .tile{gap:1px!important;font-size:10px!important;padding:1px 2px 0!important}
:root .tile-ic{height:24px!important;width:40px!important;border-radius:8px!important}
:root .tile-ic .hic,:root .tile-ic .ic{width:17px!important;height:17px!important}
:root .armytabs .chip{display:inline-flex;align-items:center;gap:6px}
@media (max-width:820px){ :root .tb-kpis .kpi .kd{display:none!important} :root .tb-name .tb-sub{display:none} }
@media (max-width:790px){ :root .tb-name{display:none!important} }

:root .tb-time{padding:2px 4px 2px 8px!important}
:root .tb-time .speeds button{height:30px!important}
:root .tb-time .clock{gap:2px!important}
:root .tile{padding-bottom:4px!important}
:root .win-head{padding-top:4px!important;padding-bottom:4px!important}
:root .win-head h2{font-size:22px!important}
:root .win-head .win-ic{transform:scale(.85)}
#adv-root{bottom:calc(52px + env(safe-area-inset-bottom,0px))!important}

/* ===== unit cards with photo + info sheet ===== */
:root .unit-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))!important;gap:10px}
:root .ucard{padding:0!important;overflow:hidden;gap:0!important}
:root .ucard>*:not(.uc-photo){margin:0 10px}
:root .uc-photo{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-bottom:1px solid var(--line);background:#0A111D;cursor:pointer}
:root .uc-photo img{width:100%;height:100%;object-fit:cover;display:block}
:root .uc-photo .gen{position:absolute;top:6px;left:6px;box-shadow:0 1px 4px rgb(0 0 0 / .5)}
:root .uc-i{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 italic 14px var(--f-serif);color:var(--gold-hi);background:rgb(8 14 26 / .78);border:1px solid var(--gold-lo);box-shadow:0 1px 4px rgb(0 0 0 / .6)}
:root .uc-name{padding-top:8px}
:root .uc-name b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root .uc-meta{margin-top:4px!important;font-size:12.5px}
:root .uc-pw b{color:var(--gold-hi)}
:root .ucard .btns{margin-top:8px!important;margin-bottom:10px!important}
:root .ammo-row{display:flex!important;flex-direction:row!important;gap:12px;align-items:stretch}
:root .am-photo{position:relative;flex:0 0 132px;aspect-ratio:16/9;padding:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#0A111D;align-self:center}
:root .am-photo img{width:100%;height:100%;object-fit:cover;display:block}
:root .am-photo .uc-i{width:20px;height:20px;font-size:12px;top:4px;right:4px}
:root .am-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
:root .sheet.uinfo{max-width:860px;width:min(96vw,860px);padding:0!important;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);overflow:hidden;max-height:92vh}
:root .ui-photo{margin:0;position:relative;background:#0A111D;min-height:100%}
:root .ui-photo img{width:100%;height:100%;object-fit:cover;display:block}
:root .ui-photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;font-size:10px;line-height:1.3;color:#C9D2E0;background:linear-gradient(transparent,rgb(0 0 0 / .8))}
:root .ui-body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:8px}
:root .ui-body h2{font-family:var(--f-serif);font-size:22px;margin:0;color:var(--ink)}
:root .ui-body p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink)}
:root .ui-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px 12px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
:root .ui-stats span{display:flex;flex-direction:column;min-width:0}
:root .ui-stats small{font-size:10.5px;color:var(--muted)}
:root .ui-stats b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root .btn.link{background:none;border-color:transparent;color:var(--gold-hi);text-decoration:underline}
:root .sheet.credits{max-width:760px;width:min(96vw,760px);max-height:90vh;overflow:auto}
:root .cr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px;margin:6px 0 12px}
:root .cr-row{display:flex;flex-direction:column;padding:4px 0;border-bottom:1px solid var(--line)}
:root .cr-row b{font-size:12.5px}
:root .cr-row small{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
:root .small{font-size:11px}
@media (max-height:420px){ :root .sheet.uinfo{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);max-height:96vh} :root .ui-body{padding:10px 12px;gap:6px} :root .ui-body h2{font-size:18px} :root .ui-body p{font-size:12.5px} :root .ui-stats{gap:3px 10px;padding:6px 0} }
:root .tb-name{overflow:hidden;min-width:0} :root .tb-name .tb-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block} :root .tb-time{flex:0 0 auto!important} :root .tb-btn{flex:0 0 auto!important}

/* ===== (i) hints instead of long explanations ===== */
.hint-src{display:none!important}
.hint-i{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:10px;vertical-align:3px;border-radius:50%;padding:0;font:700 italic 13px var(--f-serif);line-height:1;color:var(--gold-hi);background:rgb(8 14 26 / .6);border:1px solid var(--gold-lo);cursor:pointer;flex:none}
.panel.has-hint{position:relative}
.panel.has-hint>.hint-i{position:absolute;top:10px;right:10px;margin:0}
.hint-pop{position:fixed;z-index:200;padding:12px 14px;border-radius:4px;background:#131F33;border:1px solid var(--gold-lo);box-shadow:0 14px 34px rgb(0 0 0 / .6);color:var(--ink);font-size:13.5px;line-height:1.45;animation:winIn .15s ease-out}

/* ===== minister tips as dismissible bubbles ===== */
.tip-float{position:absolute;z-index:6;top:62px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));animation:tipIn .25s ease-out;transition:opacity .3s,transform .3s}
.tip-float.out{opacity:0;transform:translate(-50%,-8px)}
@keyframes tipIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
:root .tip-float .tip{margin:0!important;background:#16243A!important;border:1px solid var(--gold-lo)!important;box-shadow:0 14px 34px rgb(0 0 0 / .65);padding:8px 8px 8px 8px!important}
.tip-float .tip>div{flex:1;min-width:0}
.tip-x{flex:none;width:30px;height:30px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;align-self:flex-start}
.tip-x .ic{width:14px;height:14px}
.tip-open{flex:none;width:38px;height:38px;border-radius:50%;padding:0;margin-right:8px;border:1px solid var(--gold-lo);background:#101A2A;display:grid;place-items:center;overflow:hidden}
.tip-open .portrait{width:30px;height:30px}
@media (max-height:420px){ .tip-float{top:50px} :root .tip-float .tip .portrait{width:38px;height:38px} }

/* ===== slim bars (29.10, v2): top ~34px, dock ~34px ===== */
:root .topbar{min-height:34px!important;padding-top:2px!important;padding-bottom:2px!important;gap:6px!important}

:root .tb-kpis .kpi .v{font-size:13px!important;line-height:1.05}
:root .tb-kpis .kpi .kd{font-size:9px!important;line-height:1}
:root .tb-time{padding:1px 3px 1px 6px!important;gap:6px!important}
:root .tb-time .clock{gap:1px!important;min-width:0!important}
:root .tb-time .clock-top b{font-size:12px!important}
:root .tb-time .clock-row .pic{width:16px;height:16px}
:root .tb-time .clock-track{height:2px!important}
:root .tb-time .speeds button{height:26px!important;width:30px!important}
:root .tb-time .speeds button svg{transform:scale(.85)}
:root .tb-btn{width:30px!important;height:30px!important}
:root .tb-btn .hic{width:18px;height:18px}
:root .dock{padding-top:2px!important;padding-bottom:calc(2px + env(safe-area-inset-bottom,0px))!important}
:root .tile{flex-direction:row!important;gap:6px!important;height:30px;padding:0 6px!important;align-items:center;justify-content:center;font-size:11px!important}
:root .tile-ic{width:auto!important;height:auto!important;background:none!important;border:0!important;box-shadow:none!important}
:root .tile-ic .hic,:root .tile-ic .ic{width:16px!important;height:16px!important}
:root .tile .badge,:root .tile i.badge{top:-2px!important;right:2px!important;transform:scale(.75)}
:root .window{top:4px!important;bottom:4px!important}
:root .win-head{padding-top:2px!important;padding-bottom:2px!important;min-height:0}
:root .win-head h2{font-size:19px!important}
:root .win-head .win-ic{transform:scale(.7)}
:root .win-x,:root .tip-open{width:32px!important;height:32px!important}
:root .tip-open .portrait{width:26px!important;height:26px!important}
.tip-float{top:46px!important}
#adv-root{bottom:calc(40px + env(safe-area-inset-bottom,0px))!important}

:root .tb-name .tb-sub{display:none!important} :root .tb-name b{font-size:13.5px!important}
:root .tb-time{height:30px;box-sizing:border-box}
:root .tb-kpis .kpi .kd{display:none!important}
:root .topbar{min-height:0!important;box-sizing:border-box;height:36px}

const RARE_KINDS = new Set(["shorad","mrsam","lrsam","ew","srbm","drone","loiter","fighter"]);
function unitRare(m){ const sh = (RARE_KINDS.has(m.kind) ? 0.08 : 0) + (m.gen >= 3 ? 0.06 : 0); return sh ? m.price*sh/COMMOD_WORLD.rare : 0; }

function militaryProduction(){
  Object.keys(PLANT_CAP).forEach(pid => {
    const id = S.prod[pid]; if (!id || !objCount(pid)) return;
    if (id.startsWith("ammo:")){ const t = id.slice(5); if (t === "missile" && !tlv("am_missile")) return; const q = Math.floor(plantCap(pid)/AMMO[t].price); if ((S.stock.rare||0) < q*ammoRare(t)){ addLog(`${BUILDINGS[pid].name}: не хватает редкоземельных металлов для боеприпасов.`); return; } if (S.stock.steel < q*AMMO[t].steel){ addLog(`${BUILDINGS[pid].name}: не хватает стали для выпуска.`); return; } S.stock.steel -= q*AMMO[t].steel; S.stock.rare = (S.stock.rare||0) - q*ammoRare(t); S.ammo[t] = (S.ammo[t]||0) + q; return; }

      S.stock.steel -= KINDS[m.kind].steel; S.stock.rare = (S.stock.rare||0) - unitRare(m); S.prodAcc[pid] -= m.price; made++;

  });

}

function warGradient(w){

  if (!LABELS) return null;
  const A = LABELS[S.player], B = LABELS[w.enemy]; if (!A || !B) return null;
  const p = w.progress; if (Math.abs(p) < 1) return null;
  const capPt = iso => { const c = CAPITALS[iso]; const q = c && proj(c[1], c[2]); return q ? {x:q.x, y:q.y} : LABELS[iso]; };
  const tgt = p > 0 ? B : A, from = capPt(p > 0 ? S.player : w.enemy);
  let dx = tgt.x - from.x, dy = tgt.y - from.y; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
  const ext = (Math.abs(dx)*tgt.w + Math.abs(dy)*tgt.h)/2;
  return {iso: p > 0 ? w.enemy : S.player, x1: tgt.x - dx*ext, y1: tgt.y - dy*ext, x2: tgt.x + dx*ext, y2: tgt.y + dy*ext, f: Math.abs(p)/100, mine: p > 0,

}

  if (r === "power") return Math.max(0, 100 + powerBalance());

  const b = RES.find(x=>x.id===r).build; v += S.buildings[b]*4;
  Object.entries(BUILDINGS).forEach(([id,bd]) => { if (bd.use && bd.use[r]) v -= bd.use[r]*S.buildings[id]; });

// jsVectorMap "mill" projection (Miller cylindrical, central meridian from the map file)
function proj(lat, lon){
  const I = WORLD && WORLD.insets && WORLD.insets[0]; if (!I || !I.bbox) return null;
  const c = (WORLD.projection && WORLD.projection.centralMeridian) || 0, R = 6381372, rd = Math.PI/180;
  let dl = lon - c; if (dl < -180) dl += 360; if (dl > 180) dl -= 360;
  const X = R*dl*rd, Y = -R*Math.log(Math.tan((45 + 0.4*lat)*rd))/0.8, b = I.bbox;
  return {x:(X - b[0].x)/(b[1].x - b[0].x)*I.width + (I.left||0), y:(Y - b[0].y)/(b[1].y - b[0].y)*I.height + (I.top||0)};
}

function coinsMonthly(){ const n = objCount("goldmine"); return n ? 3*(1 - Math.pow(0.93, n))/(1 - 0.93)*(1 + 0.25*(Math.max(1, tlv("gold"))-1)) : 0; }

function importPrice(r){ return buyAdj()*COMMOD[r].world*S.market[r]*1.6*(Object.values(C()).some(x=>x.sanctionsUs) ? 1.3 : 1); }
function hashIso(s){ let h = 7; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h; }
function partner(iso){ if (!S.partners[iso]){ const h = hashIso(iso); S.partners[iso] = {rel:(h%46)-14, trade:false, improveCd:0}; } return S.partners[iso]; }

function canContract(iso){

function commodProjection(){
  let rev = 0;

    const prod = prodOf(r); let avail = S.stock[r] + prod;

function inTransit(r){ return (S.shipments||[]).filter(x=>x.dir==="in" && x.r===r && !x.cat).reduce((a,x)=>a+x.qty, 0); }
function cargoIcon(x){ return x.air ? "plane" : x.cat === "aid" ? "food" : x.cat === "unit" ? KINDS[MODELS[x.r].kind].icon : x.cat === "ammo" ? "ammo" : x.r; }

function sellerCap(iso, r){ return Math.max(0, partnerGdp(iso)*COMMOD[r].price*supplyProf(iso, r)/COMMOD_WORLD[r]*5); }

    for (const x of list){ if (left <= 0) break; const q = Math.min(left, Math.floor(sellerLeft(x.iso, r))); if (orderGoods(x.iso, r, q)){ any = true; left -= q; days = Math.max(days, x.days); } }

}
function marketTurn(){

function canBuild(id){

  if (r.coast && !hasCoast()) return {ok:false, why:"нужен выход к морю"};

  if (r.cap) for (const k in r.cap) if (S.capital[k] < r.cap[k]) return {ok:false, why:`нужно накопленное ${k==="edu"?"образование":"инфраструктура"} ${r.cap[k]}`};

  if (b.maxFn){ const mx = window[b.maxFn] ? window[b.maxFn]() : hydroMax(); if (n >= mx) return {ok:false, why: mx ? `рек хватает только на ${mx}` : "в стране нет подходящих рек"}; }

function armyUpkeepMonthly(){ return me().army*0.004*gdppc()/12 + unitsUpkeepYear(S.units)/12; }
function techMult(t){ return 1 + 0.25*t; }
function rawPower(){ return (S.occupied ? freeArmy() : me().army) + unitsPower(S.units); }
function myPower(){ return (S.fac ? milBaseMult() : 1) * (1 + 0.015*minDelta("defense")) * rawPower() * techMult(me().tech) * (0.6 + 0.4*S.stability/100) * (1 + 0.1*tech("comms") + 0.2*tech("drones") + 0.2*tech("missile") + 0.2*tech("cyber")) * (ideo("nat")?1.2:1); }
function aiPower(c){ return c.army * 3 * techMult(c.tech); }

function armsBuyers(){ return Object.values(C()).filter(x=>!x.owner && x.rel>=40 && !S.wars.some(w=>w.enemy===x.id)); }
function railIncome(id){ const x = C()[id]; if (!x || x.owner || x.rel < 0) return 0; return Math.min(me().gdp, x.gdp)/12*0.004; }
function railCost(){ return me().gdp*0.012; }
function railTotal(){ return railCost(); }
function railMatOk(){ return S.stock.wood >= RAIL_MAT.wood && S.stock.steel >= RAIL_MAT.steel; }

function budget(){
  const c = me(), m = c.gdp/12;
  const K = S.capital;
  const compliance = taxCompliance();
  const taxes = m * taxBurden()/100 * compliance;
  let trade = 0;
  const logi = 1 + 0.03*objCount("bridge") + 0.05*objCount("port");
  RES.forEach(r => {
    const bal = selfSuff(r.id) - 100;
    if (bal > 0) trade += m*0.00006*bal * (S.wars.length ? 0.8 : 1) * (1 + (K.infra-33)/150) * (1 + 0.2*tech("fintech")) * logi;
    else trade += m*0.00009*bal * (Object.values(C()).some(x=>x.sanctionsUs) ? 1.5 : 1);
  });
  const deals = Object.values(C()).filter(x=>x.trade && !x.owner).length;
  trade += m * 0.002 * deals * (1 + (K.infra-33)/150) * (ideo("dem")?1.25:1) * (1 + 0.1*objCount("airport")) * (1 + 0.02*minDelta("foreign") + lawSum("deal") + orgDealBonus());
  trade += minorTradeIncome();
  const commod = commodProjection();
  const imports = allImports().reduce((a,x)=>a + x.q*importPriceFrom(x.iso, x.r), 0);
  const objects = Object.keys(BUILDINGS).reduce((a,id)=>a + objCount(id)*objIncome(id), 0);
  const upkeep = Object.keys(BUILDINGS).reduce((a,id)=>a + objCount(id)*objUpkeep(id), 0) + (S.fac ? facUpkeep() : 0);
  const rail = Object.keys(S.rails).filter(id=>S.rails[id].done).reduce((a,id)=>a + railIncome(id), 0);
  const arms = armsExportIncome();
  const science = scienceCost();
  const milprod = prodSpendMonthly();
  const sectors = ministriesCost();
  const tourism = tourismIncome();
  const intel = intelCost();
  const army = armyUpkeepMonthly();
  const laws = m * lawSum("cost");
  const interest = S.debt * debtRate() / 12;
  const pens = S.pens ? pensionCost() : 0, wages = S.wages ? wageCost() : 0, print = S.print ? printIncome() : 0;
  const war = m * 0.012 * S.wars.length;
  const loans = loanIncome() + investIncome(), dipl = dipUpkeep() + orgDues();
  const other = m*(S.budFix||0);   // other revenue and spending of the state, set once at the start so every country begins with the same margin
  const income = taxes + Math.max(0,trade) + objects + rail + arms + commod + tourism + loans + print + Math.max(0, other);
  const spend = sectors + army + laws + interest + war + science + intel + upkeep + imports + milprod + dipl + pens + wages + Math.max(0,-trade) + Math.max(0, -other);
  return {other, taxes, tourism, loans, dipl, pens, wages, print, trade, objects, upkeep, rail, arms, commod, imports, milprod, science, intel, sectors, army, laws, interest, war, income, spend, net: income - spend};
}
function growthMonthly(){
  let g = (S.cb !== undefined ? trendGrowthYear()/12 + macroGrowth() : 0.0015);
  const K = S.capital;
  g += (K.edu-33)*0.00005 + (K.infra-33)*0.00005 + (K.health-33)*0.00002;
  g -= 0.00025*Math.max(0, taxBurden()-15.8);
  { const pb = powerBalance(); if (pb < 0) g -= Math.min(0.003, -pb*0.00002); }
  g += 0.00025*S.buildings.factory*(1 + 0.5*tech("automation")) + BUILDINGS.highway.growth*objCount("highway");
  g += 0.00125*tech("ai") + 0.0004*tech("fusion") + 0.00025*tech("gene");
  g += ideo("tech") ? 0.00033 : ideo("soc") ? -0.00033 : 0;
  if (S.climatePact) g -= 0.0002;
  if (me().worldSanctions > 0) g -= 0.0015;
  g += 0.0003*Object.values(C()).filter(x=>x.trade && !x.owner).length;
  g -= 0.0008*Object.values(C()).filter(x=>x.sanctionsUs).length;
  g -= 0.002*S.wars.length;
  g -= 0.00025*deficits();   // shortages are already paid for as imports in the budget; this is only the extra drag
  g += lawSum("growth") + facFx("growth") + orgGrowth() + (relig("secular") ? 0.00008 : relig("trad") ? -0.00008 : 0);
  g += modSum("growth");
  if (S.debt > me().gdp) g -= 0.001;
  return g;
}
function approvalTarget(){
  let t = 60 - taxPain() + (S.cb !== undefined ? macroApproval() : 0);
  { const pb = powerBalance(); if (pb < 0) t -= Math.min(10, -pb*0.08); }
  t += (inOrg("g20") ? 1 : 0) + (relig("dialog") ? 2 : relig("trad") ? 1 : 0) + facFx("appr") + 0.3*minDelta("housing") + 0.35*minDelta("culture") + 0.25*minDelta("sport") + 0.3*minDelta("ecology") + 0.2*minDelta("emergency") + 0.3*Math.min(10, objCount("solar"));
  const K = S.capital;
  t += (K.health-33)*0.12 + (K.edu-33)*0.03 + (K.infra-33)*0.03 + (S.sectors.health-1)*1.5 - (S.sectors.police-1)*1;
  t -= S.wars.length*(ideo("nat")?5:10) + deficits()*3;
  t += ideo("dem")?5 : ideo("tech")?-3 : ideo("soc")?6 : ideo("auth")?-8 : 0;
  t += lawSum("appr") + modSum("approval") + objCount("metro") + 2*tech("telemed") + 2*tech("vaccines") + 3*tech("gene") + 5*tech("longevity");
  if (S.debt > me().gdp*0.9) t -= 5;

}
function stabilityTarget(){
  let t = 25 + S.approval*0.5 + (S.capital.police-33)*0.15 + (S.sectors.police-1)*2 + lawSum("stab") + modSum("stability")
    + 0.5*minDelta("guard") + 0.3*minDelta("security") + 0.2*minDelta("justice") + 0.2*minDelta("emergency") + facFx("stab") + (relig("trad") ? 4 : 0) + (S.cb !== undefined ? macroStab() : 0);
  t -= S.wars.length*4;

}

function techCost(){ return me().gdp * 0.012 * me().tech; }
function recruitAmount(){ return Math.max(2, me().army*0.05); }
function recruitCost(){ const k = recruitAmount(); return k*0.004*gdppc() * (lawOn("conscription")?0.5:1) * (ideo("nat")?0.8:1); }
function improveCost(){ return Math.max(0.02, me().gdp*0.002); }
function nearReach(c){ const r = me().region; return c.region === r || ADJ[r].includes(c.region); }
function canReach(c){ return nearReach(c) || (unitsOf(["carrier"]) > 0 && hasCoast() && hasCoast(c.id)); }

/* ---------- Turn ---------- */
function uranMonthly(){ return (objCount("npp") + objCount("enrich")*0.5)*BUILDINGS.npp.cost*me().gdp*0.002/COMMOD_WORLD.uran; }
function uranTurn(){
  const need = uranMonthly(); if (!need){ S.uranOk = true; return; }
  const have = S.stock.uran||0;
  if (have >= need){ S.stock.uran = have - need; S.uranOk = true; return; }
  const lack = need - have, cost = lack*importPrice("uran"); S.stock.uran = 0;
  if (!Object.values(C()).some(x => x.sanctionsUs) && S.treasury > cost){ S.treasury -= cost; S.uranOk = true; addLog(`Уран для АЭС куплен на рынке: ${money(cost)}.`); }
  else { if (S.uranOk !== false) advise("econ", "Урана нет: атомные станции остановлены, энергии не хватает.", {mood:"alert", tab:"economy"}); S.uranOk = false; }
}
function nextMonth(){
  if (S.pendingEvent || S.over) return;

  const cm = coinsMonthly(); if (cm > 0){ S.coins = (S.coins||0) + cm; }

  if (S.treasury < 0){ S.debt += -S.treasury; addLog(`Дефицит бюджета покрыт займом: ${money(-S.treasury)}.`); S.treasury = 0; }

  militaryProduction();
  Object.keys(S.rails).forEach(id => { if (S.rails[id].done && C()[id] && !C()[id].owner) C()[id].rel = Math.min(100, C()[id].rel + 0.5); });

  // 3. growth
  const g = growthMonthly() + rnd(-0.0008, 0.0008);
  c.gdp *= (1+g); c.pop *= LAWS.some(l=>l.popFix && lawOn(l.id)) ? 1 + Math.min(0, lawSum("pop")) : 1.0006 + (S.capital.health-33)*0.00001 + 0.0001*tech("vaccines") + 0.0002*tech("longevity") + 0.000004*minDelta("sport") + lawSum("pop") + facFx("pop");

  intelMonth();

  // 6. wars, occupation, infamy

  nukeTurn(); enrichStrikeTurn();
  if (S.rpAdCd > 0) S.rpAdCd--;

  // 6b. intelligence, council, ideology cooldown

      if (Math.random() < ciLevel() || (x.expelled||0) > 0) addLog(`Контрразведка сорвала диверсию агентов страны ${x.name}.`);
      else { c.gdp *= 0.995; addLog(`Агенты страны ${x.name} устроили диверсию: ВВП −0,5%.`); flashMap(S.player, "bad"); advise("intel", `Диверсия! Агенты страны ${x.name} ударили по нашей промышленности. Усильте контрразведку.`, {tab:"intel", mood:"alert", key:"sabot", cd:3}); }
    }

  advisorsTurn();
  S.hist.gdp.push(c.gdp); S.hist.appr.push(S.approval);
  S.hist.gdp = S.hist.gdp.slice(-36); S.hist.appr = S.hist.appr.slice(-36);

    lines: S.log.slice(0, Math.max(0, S.log.length - startLog)).map(l=>l.text).slice(0,6)
  };

  else { const d = S.last.d; floatText(S.player, `${d.treasury>=0?"+":"−"}${money(Math.abs(d.treasury))}`, d.treasury >= 0 ? "cash big" : "loss big"); toast(`${MONTHS[(S.month+11)%12]}: бюджет ${d.treasury>=0?"+":""}${money(d.treasury)}, рейтинг ${d.approval>=0?"+":""}${d.approval.toFixed(1).replace(".",",")}`); if (d.treasury > 0) sfx("coin"); }
}

function aiTurn(){
  const meC = me();
  Object.values(C()).forEach(c => {
    if (c.owner) return;
    { const gp = Math.max(0, 1 - c.gdp/c.pop/45); c.gdp *= 1 + (0.014 + 0.04*gp*gp)/12 - 0.0003 + rnd(-0.0009, 0.0009) - (c.sanction ? 0.0012 : 0) - (c.worldSanctions>0 ? 0.0015 : 0); }
    // relations drift toward a baseline
    const base = c.ally ? 60 : c.trade ? 25 : 0;
    c.rel += (base - c.rel) * 0.02 + rnd(-1.2,1.2) + 0.15*minDelta("foreign") + lawSum("rel") + orgRelBonus(c.id) + (relig("dialog") ? 0.1 : 0) + (c.emb ? 0.3 : 0) + (S.abroad && S.abroad[c.id] ? 0.6 : 0);
    if (S.wars.some(w=>w.enemy===c.id)) c.rel = -100;
    c.rel = clamp(c.rel,-100,100);
    if (c.trade && c.rel < 0){ c.trade = false; addLog(`${c.name} разорвала торговое соглашение.`); }
    if (c.ally && c.rel < 30){ c.ally = false; addLog(`${c.name} вышла из союза с вами.`); }
    // sanctions against us
    if (!c.sanctionsUs && c.rel < -50 && Math.random() < 0.04){ c.sanctionsUs = true; addLog(`${c.name} ввела санкции против вас.`); }
    if (c.sanctionsUs && c.rel > -20 && Math.random() < 0.15){ c.sanctionsUs = false; addLog(`${c.name} сняла санкции.`); }
    // war declared on us
    if (!c.nap && !S.wars.some(w=>w.enemy===c.id) && canReach(c) && c.rel < -65 && aiPower(c) > myPower()*1.3 && Math.random() < 0.02*S.aggr*(1 + lawSum("aggro"))*orgDeterr(c)*(tech("missile")?0.6:1)*(deterrence() ? 0.15 : 1)){
      startWar(c.id, false);

    }
  });

    }

function councilTurn(){

  if (!K.res){
    K.next--;
    if (K.next <= 0){
      const pool = Object.values(C()).filter(x=>!x.owner);
      const type = pick(["sanctions","sanctions","warban","climate","aid"]);
      let target = null;
      if (type==="sanctions" || type==="warban"){
        const avgRel = pool.reduce((a,x)=>a+x.rel,0)/pool.length;
        target = (type==="sanctions" && (S.wars.length || avgRel < -15) && Math.random()<0.5) ? S.player : pick(pool).id;
      }
      K.res = {type, target, left:3, proposer:"world", myVote:null};
      addLog(`Совет наций вынес на голосование: «${resName(K.res)}».`);
    }
    return;
  }
  K.res.left--;
  if (K.res.left <= 0) resolveCouncil();
}
function resName(r){ const tn = r.target ? (r.target===S.player ? "вас" : C()[r.target].name) : ""; return RES_TYPES[r.type].name.replace("{X}", tn); }
function resolveCouncil(){
  const K = S.council, r = K.res;
  let yes = 0, no = 0;
  if (r.myVote==="yes") yes += 2; else if (r.myVote==="no") no += 2;
  Object.values(C()).forEach(x => {
    if (x.owner) return;
    let p;
    if (r.type==="sanctions" && r.target===S.player) p = clamp(0.3 - x.rel/150, 0.05, 0.95);
    else if (r.target===x.id) p = 0;
    else p = r.type==="warban" ? 0.6 : r.type==="climate" ? 0.55 : 0.5;
    if (r.proposer==="player") p = clamp(p + x.rel/250, 0.05, 0.95);
    if ((x.ally || x.rel>50) && r.myVote && r.target!==S.player) p = r.myVote==="yes" ? 0.85 : 0.15;
    if (r.target===x.id) { no++; return; }
    if (Math.random() < 0.12) return; // abstain
    if (Math.random() < p) yes++; else no++;
  });
  const passed = yes > no;
  addLog(`Совет наций: «${resName(r)}» — ${passed?"ПРИНЯТО":"отклонено"} (${yes} за, ${no} против).`);
  if (passed){
    if (r.proposer==="player") S.flags.resPassed = true;
    if (r.type==="sanctions"){
      if (r.target===S.player){
        me().worldSanctions = 24;
        Object.values(C()).forEach(x=>{ if (!x.owner && x.rel < 30){ x.sanctionsUs = true; x.trade = false; } });
      } else { const x = C()[r.target]; x.worldSanctions = 24; if (x.trade){ x.trade=false; addLog(`Торговля с ${x.name} прекращена из-за санкций.`); } }
    }
    if (r.type==="warban") K.banned[r.target] = true;
    if (r.type==="climate"){ S.climatePact = 24; S.mods.push({stat:"approval",v:3,left:12}); }
    if (r.type==="aid"){ const amt = me().gdp*(gdppc()>20 ? -0.003 : 0.005); S.treasury += amt; addLog(amt<0 ? `Взнос в фонд помощи: ${money(-amt)}.` : `Получена помощь фонда: ${money(amt)}.`); }
  }
  K.res = null; K.next = rnd(4,7)|0;
}
function opChance(op, target){
  let p = 0.45 + 0.1*S.intel.level + 0.1*tech("cyber") - 0.07*target.tech + 0.015*minDelta("security") + 0.06*netLvl(target.id);
  if (op==="coup") p *= 0.5;
  return clamp(p, 0.05, 0.9);
}
function opAllowed(op, target){
  if (!target || target.owner) return false;
  if (op.id==="coup" && !(canReach(target) && target.gdp < me().gdp*0.5)) return false;
  return S.intel.pts >= op.pts && S.treasury >= improveCost();
}
function runOp(opId, targetId){
  const op = OPS.find(o=>o.id===opId), x = C()[targetId];
  if (!opAllowed(op, x)) return toast("Операция сейчас недоступна.");
  S.intel.pts -= op.pts; S.treasury -= improveCost();
  if (Math.random() < opChance(op.id, x)){
    S.intel.ok++;
    if (op.id==="influence"){ x.rel = clamp(x.rel + 6, -100, 100); addLog(`Информационная кампания в стране ${x.name}: наш образ улучшился.`); }
    if (op.id==="spy"){ const v = 15 + x.tech*8; S.rp += v; addLog(`Агенты добыли разработки в стране ${x.name}: +${v} очков исследований.`); }
    if (op.id==="sabotage"){ x.gdp *= 0.98; x.army *= 0.97; addLog(`Диверсия в стране ${x.name} удалась.`); }
    if (op.id==="opposition"){ x.gdp *= 0.99; if (Math.random()<0.25){ x.rel = Math.max(x.rel, 40); addLog(`В стране ${x.name} к власти пришла дружественная вам оппозиция.`); } else addLog(`Оппозиция в стране ${x.name} усилилась.`); }
    if (op.id==="coup"){ x.rel = 80; x.ally = true; x.trade = true; x.sanction = false; x.sanctionsUs = false; S.flags.coup = true; addLog(`Переворот в стране ${x.name}: новое правительство — ваш союзник.`); }
    checkAchievements(); save(); render();
    showOpReport(op, x, op.id==="opposition" && x.rel >= 40 ? "flip" : "ok", S.log[0].text);
  } else {
    if (Math.random() < 0.5){ x.rel = clamp(x.rel-25,-100,100); S.mods.push({stat:"approval",v:-3,left:6}); addLog(`Провал операции в стране ${x.name}: агенты раскрыты, скандал.`); checkAchievements(); save(); render(); showOpReport(op, x, "exposed", "Отношения с этой страной −25, рейтинг дома −3 на полгода."); }
    else { addLog(`Операция в стране ${x.name} не удалась, но следов не осталось.`); checkAchievements(); save(); render(); showOpReport(op, x, "clean", "Агенты потрачены, последствий нет."); }
  }
}
function endGame(win, title, text){
  ui.speed = 0;
  S.over = {win, title, text};
  if (win){ unlock("winner"); if (S.scenario==="zero" || S.scenario==="lastchance") unlock("hard"); }
  storageDel();
  render();
  showEnd();
}

let AC = null;
function sfx(kind){
  if (!settings.sound) return;

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();

    const tone = (f, d, type, vol, when) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.setValueAtTime(f, t + (when||0)); g.gain.setValueAtTime(vol || 0.05, t + (when||0)); g.gain.exponentialRampToValueAtTime(0.0001, t + (when||0) + d); o.connect(g).connect(AC.destination); o.start(t + (when||0)); o.stop(t + (when||0) + d + 0.02); };
    if (kind === "tap") tone(620, 0.045, "triangle", 0.035);
    else if (kind === "open") { tone(392, 0.07, "sine", 0.04); tone(587, 0.1, "sine", 0.035, 0.05); }
    else if (kind === "notify") { tone(880, 0.1, "sine", 0.045); tone(1320, 0.16, "sine", 0.035, 0.09); }
    else if (kind === "alert") { tone(330, 0.16, "square", 0.025); tone(247, 0.24, "square", 0.025, 0.15); }
    else if (kind === "success") { tone(523, 0.09, "triangle", 0.05); tone(659, 0.09, "triangle", 0.05, 0.08); tone(784, 0.22, "triangle", 0.05, 0.16); }
    else if (kind === "boom") { const len = 0.9, buf = AC.createBuffer(1, AC.sampleRate*len, AC.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/d.length, 2.5); const src = AC.createBufferSource(), lp = AC.createBiquadFilter(), g = AC.createGain(); lp.type = "lowpass"; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(120, t + len); g.gain.value = 0.35; src.buffer = buf; src.connect(lp).connect(g).connect(AC.destination); src.start(t); tone(55, 0.6, "sine", 0.12); }
    else if (kind === "alarm") { [0, 0.5].forEach(o => { const os = AC.createOscillator(), g = AC.createGain(); os.type = "sawtooth"; os.frequency.setValueAtTime(520, t + o); os.frequency.linearRampToValueAtTime(880, t + o + 0.4); g.gain.setValueAtTime(0.0001, t + o); g.gain.exponentialRampToValueAtTime(0.03, t + o + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.45); os.connect(g).connect(AC.destination); os.start(t + o); os.stop(t + o + 0.5); }); }
    else if (kind === "cash") { [1318, 1568, 2093].forEach((f, i) => tone(f, 0.12, "triangle", 0.035, i*0.055)); tone(2637, 0.25, "sine", 0.02, 0.17); }
    else if (kind === "cargo") { tone(140, 0.12, "sine", 0.07); tone(220, 0.1, "triangle", 0.03, 0.04); }
    else if (kind === "approach") { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(760, t + 0.45); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.03, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.52); }
    else if (kind === "coin") { tone(1046, 0.06, "square", 0.025); tone(1568, 0.14, "square", 0.02, 0.05); }
  } catch(e){}
}

/* background music: a real track from music/ when bundled, otherwise generative ambient made with Web Audio */
const MUSIC_FILE = "music/theme.mp3";
const music = {on:false, mode:null, timer:0, next:0, step:0, audio:null, master:null, lp:null};
const musicGain = () => (settings.musicVol ?? 55) / 100;
function musicStart(){
  if (!settings.music || music.on || document.hidden) return;
  music.on = true;
  const a = new Audio(MUSIC_FILE); a.loop = true; a.volume = 0.55*musicGain(); a.preload = "auto";
  a.addEventListener("canplaythrough", () => { if (music.on && !music.mode){ music.mode = "file"; music.audio = a; a.play().catch(() => { music.mode = null; synthStart(); }); } }, {once:true});
  a.addEventListener("error", () => { if (music.on && !music.mode) synthStart(); }, {once:true});
  try { a.load(); } catch(e){ synthStart(); }
  setTimeout(() => { if (music.on && !music.mode) synthStart(); }, 1800);
}
function synthStart(){
  if (music.mode) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
    music.mode = "synth";
    music.master = AC.createGain(); music.master.gain.setValueAtTime(0.0001, AC.currentTime); music.master.connect(AC.destination);
    music.master.gain.exponentialRampToValueAtTime(0.5*musicGain() + 0.0001, AC.currentTime + 4);
    music.lp = AC.createBiquadFilter(); music.lp.type = "lowpass"; music.lp.frequency.value = 2200; music.lp.connect(music.master);
    const d = AC.createDelay(); d.delayTime.value = 0.34; const fb = AC.createGain(); fb.gain.value = 0.32; const wet = AC.createGain(); wet.gain.value = 0.3;
    music.lp.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(music.master);
    music.next = AC.currentTime + 0.15; music.step = 0;
    music.timer = setInterval(musicSchedule, 180);
  } catch(e){ music.mode = null; }
}
// warm, hopeful loop: Am – F – C – G with a soft bell arpeggio
const PROG = [[57,60,64],[53,57,60],[48,52,55],[55,59,62],[57,60,64],[53,57,60],[50,53,57],[52,55,59]];
const mtof = m => 440*Math.pow(2, (m-69)/12);
function mnote(f, t, dur, type, vol, attack){ const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g).connect(music.lp); o.start(t); o.stop(t + dur + 0.05); }
function musicSchedule(){
  if (!music.on || music.mode !== "synth") return;
  const beat = 60/72, half = beat/2;
  while (music.next < AC.currentTime + 0.7){
    const t = music.next, bar = Math.floor(music.step/8), chord = PROG[bar % PROG.length], pos = music.step % 8;
    if (pos === 0){
      chord.forEach(m => { mnote(mtof(m), t, beat*4.8, "triangle", 0.03, 1.4); mnote(mtof(m)*1.004, t, beat*4.8, "sine", 0.022, 1.8); });
      mnote(mtof(chord[0]-12), t, beat*4.2, "sine", 0.05, 0.3);
    }
    const pat = [0, null, 1, 2, null, 1, 2, null], pi = pat[pos];
    if (pi !== null && Math.random() < 0.8){ const m = chord[pi] + 12 + (Math.random() < 0.18 ? 12 : 0); mnote(mtof(m), t, beat*2.4, "sine", 0.026, 0.008); mnote(mtof(m)*2, t, beat*0.9, "sine", 0.006, 0.005); }
    if (pos === 4) mnote(mtof(chord[0]-24), t, beat*1.2, "sine", 0.035, 0.03);
    music.next += half; music.step++;
  }
}
function musicStop(){
  music.on = false; clearInterval(music.timer);
  if (music.audio){ try { music.audio.pause(); } catch(e){} }
  if (music.master){ const m = music.master; try { m.gain.setTargetAtTime(0.0001, AC.currentTime, 0.35); } catch(e){} setTimeout(() => { try { m.disconnect(); } catch(e){} }, 1600); }
  music.mode = null; music.audio = null; music.master = null;
}
function musicVolume(){ const v = musicGain(); if (music.audio) music.audio.volume = 0.55*v; if (music.master) music.master.gain.setTargetAtTime(0.5*v + 0.0001, AC.currentTime, 0.2); }
document.addEventListener("pointerdown", () => { if (settings.music && !music.on) musicStart(); }, {passive:true});
document.addEventListener("visibilitychange", () => { if (document.hidden) musicStop(); else if (settings.music) setTimeout(musicStart, 300); });

function act(name, arg){
  const c = me();
  switch(name){
    case "build": {
      const chk = canBuild(arg); if (!chk.ok) return toast("Нельзя построить: " + chk.why + ".");
      const b = BUILDINGS[arg], mat = b.mat || {}, days = buildDays(arg);
      S.treasury -= buildCost(arg); takeMat(mat);
      S.queue.push({type:arg, left:days, total:days});
      toast(`Начато строительство: ${b.name}`); break;
    }
    case "recruit": {
      const cost = recruitCost();
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; c.army += recruitAmount(); toast("Войска набраны."); break;
    }
    case "disband": c.army = Math.max(1, c.army*0.95); toast("Армия сокращена на 5%."); break;
    case "tech": {
      if (c.tech >= 5) return;
      const cost = techCost(); if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; c.tech++; toast(`Военные технологии: уровень ${c.tech}.`); break;
    }
    case "improve": {
      const t = C()[arg], cost = improveCost();
      if (S.treasury < cost) return toast("Не хватает денег в бюджете.");
      S.treasury -= cost; t.rel = clamp(t.rel + 12, -100, 100); t.improveCd = 3; toast(`Отношения с ${t.name} улучшены.`); break;
    }
    case "trade": { const t=C()[arg]; t.trade = !t.trade; if (t.trade) flashMap(t.id, "good"); addLog(t.trade ? `Подписано торговое соглашение с ${t.name}.` : `Торговое соглашение с ${t.name} расторгнуто.`); if(!t.trade) t.rel -= 10; break; }
    case "ally": { const t=C()[arg]; t.ally = !t.ally; addLog(t.ally ? `Заключён военный союз с ${t.name}.` : `Союз с ${t.name} расторгнут.`); if(!t.ally) t.rel -= 20; break; }

/* ---------- Daily progress: research, construction, railways ---------- */
function dayTick(){
  S.rp += rpMonthly()/30;
  researchDay();
  facDay();
  if ((S.day||1) % 5 === 0) save();
  Object.keys(COMMOD).forEach(r => { S.stock[r] += prodOf(r)/30; });
  shipTick();
  if (S.wars.length){ S.wars.forEach(warDay); warOutcomes(); if (ui.tab === "hq") dirty = true; else if (ui.tab === "map") updateWarMap(); }
  const speed = (selfSuff("metal") < 60 ? 0.5 : 1) * (1 + 0.015*minDelta("housing"));
  S.queue.forEach(q => q.left -= speed);
  const done = S.queue.filter(q=>q.left<=0);
  done.forEach(q => { S.buildings[q.type]++; addLog(`Построено: ${BUILDINGS[q.type].name}.`); advise("econ", `Объект сдан: ${BUILDINGS[q.type].name}. Уже работает на страну.`, {tab:"build"}); flashMap(S.player, "good"); dirty = true; });
  if (done.length) S.queue = S.queue.filter(q=>q.left>0);
  Object.keys(S.rails).forEach(id => { const r = S.rails[id]; if (!r.done){ r.left -= 1; if (r.left<=0){ r.done = true; addLog(`Открыта железная дорога в страну ${C()[id].name}.`); toast(`Железная дорога: ${C()[id].name}`); dirty = true; } } });
}
let dirty = false;

/* ---------- Real-time clock ---------- */
let acc = 0, lastTs = 0, pausedBy = null;
function setSpeed(v){
  if (!S || S.over) return;
  if (v===3 && !speed3Unlocked()){ showSpeedOffer(); return; }
  if (S.pendingEvent && v>0){ showReport(); return; }
  if (S.pendingVictory && v>0){ showVictory(); return; }
  ui.speed = v; if (v>0) ui.resumeSpeed = v;
  pausedBy = null; lastTs = performance.now(); updateClock();
}
function pauseFor(reason){ if (ui.speed>0){ ui.resumeSpeed = ui.speed; pausedBy = reason; } ui.speed = 0; updateClock(); }
function resumeAfter(reason){ if (pausedBy===reason){ pausedBy = null; ui.speed = ui.resumeSpeed; lastTs = performance.now(); } updateClock(); }
function tick(ts){
  requestAnimationFrame(tick);
  if (!lastTs) lastTs = ts;
  const dt = Math.min(ts - lastTs, 1000); lastTs = ts;
  if (!S || !S.countries || S.over || ui.speed===0 || S.pendingEvent || S.pendingVictory) return;
  if (ui.speed===3 && !speed3Unlocked()){ ui.speed = 2; ui.resumeSpeed = 2; toast("Время ×3 за рекламу закончилось. Скорость ×2."); render(); }
  acc += dt;
  const msDay = SPEED_MS[ui.speed];
  while (acc >= msDay){
    acc -= msDay;
    S.day = (S.day||1) + 1;
    dayTick();
    if (S.day > daysIn(S.month, S.year)){ acc = 0; nextMonth(); return; }
  }
  if (dirty){ dirty = false; save(); render(); }
  updateLive();
  updateClock();
}
function updateLive(){
  if (ui.tab === "map" || document.getElementById("map-fx")) moveCargo();
  document.querySelectorAll("[data-qprog]").forEach(el => { const q = S.queue[+el.dataset.qprog]; if (q) el.style.width = ((1 - q.left/q.total)*100).toFixed(1)+"%"; });
  document.querySelectorAll("[data-qdays]").forEach(el => { const q = S.queue[+el.dataset.qdays]; if (q) el.textContent = Math.ceil(q.left) + " дн."; });
  document.querySelectorAll("[data-rqprog]").forEach(el => { const q = S.rq[+el.dataset.rqprog]; if (q) el.style.width = ((1 - q.left/q.total)*100).toFixed(1) + "%"; });
  document.querySelectorAll("[data-rqdays]").forEach(el => { const q = S.rq[+el.dataset.rqdays]; if (q) el.textContent = Math.ceil(q.left) + " дн."; });
  document.querySelectorAll("[data-rp]").forEach(el => el.textContent = Math.floor(S.rp).toLocaleString("ru-RU"));
}
function updateClock(){
  if (!S || !S.countries) return;
  const el = document.getElementById("clock-date"); if (el) el.textContent = fullDate();
  const wd = document.getElementById("clock-wd"); if (wd) wd.textContent = weekday();
  const bar = document.getElementById("clock-bar"); if (bar) bar.style.width = ((S.day-1 + acc/SPEED_MS[ui.speed||1]) / daysIn(S.month,S.year) * 100).toFixed(1) + "%";
  document.querySelectorAll("[data-speed]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.speed===ui.speed)));
  const hint = document.getElementById("clock-hint"); if (hint) hint.hidden = ui.speed!==0 || !!S.pendingEvent;
}
requestAnimationFrame(tick);
setInterval(() => { const tEl = document.querySelector('[data-speed="3"] .timer'); if (tEl) tEl.textContent = speed3MinutesLeft() + "м"; }, 30000);
document.addEventListener("visibilitychange", () => { if (document.hidden){ pauseFor("hidden"); if (S && S.countries) save(); } else resumeAfter("hidden"); });

  if (e.code!=="Space" || /INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName) || !S || !S.countries) return;

let viewMapCache = "";
/* long explanatory texts are hidden behind an (i) next to the panel title */
function hintify(root){
  root.querySelectorAll(".panel").forEach(panel => {
    const cand = [...panel.querySelectorAll(".label, p.muted, small.muted, .muted.small, .tip-text")].filter(el => {
      if (el.closest(".ucard, .stock, button, .choice, .dcard, .mincard, .lawcard, .fcard, .org, .cand, .news, .log, .hint-src")) return false;
      if (el.querySelector("button, input, select, .bar, .num")) return false;
      if (el.closest(".panel") !== panel) return false;
      return el.textContent.trim().length > 60;
    });
    if (!cand.length) return;
    const txt = cand.map(el => el.innerHTML).join("<br><br>");
    cand.forEach(el => el.classList.add("hint-src"));
    const head = panel.querySelector("h3");
    const b = document.createElement("button"); b.className = "hint-i"; b.type = "button"; b.setAttribute("aria-label", "Пояснение"); b.textContent = "i"; b._hint = txt;
    if (head) head.appendChild(b); else { panel.classList.add("has-hint"); panel.prepend(b); }
  });
}

  closeHint();

  d.className = "hint-pop"; d.innerHTML = btn._hint; document.body.appendChild(d);
  const w = Math.min(420, innerWidth - 24); d.style.width = w + "px";
  let x = Math.min(Math.max(12, r.left + r.width/2 - w/2), innerWidth - w - 12), y = r.bottom + 8;
  if (y + d.offsetHeight > innerHeight - 12) y = Math.max(12, r.top - d.offsetHeight - 8);
  d.style.left = x + "px"; d.style.top = y + "px";
}

function softRender(html, opening){
  const old = app.querySelector(":scope > .game");
  if (!old || opening) return false;
  const tpl = document.createElement("template"); tpl.innerHTML = html;
  const neu = tpl.content.firstElementChild;
  const oWin = old.querySelector(".window"), nWin = neu.querySelector(".window");

  old.querySelector(".topbar").replaceWith(neu.querySelector(".topbar"));

  return (0.75 + 0.25*S.stability/100) * (lawOn("anticorr") ? 1.06 : 1) * (1 + (K.edu-33)*0.002 + (K.police-33)*0.001) * (1 + 0.05*tech("egov") + 0.05*tech("fintech"))
    * (1 + 0.005*minDelta("finance") + 0.006*minDelta("justice")) * (1 + facFx("tax"));
}
function taxIncome(id){ const t = TAXES.find(x=>x.id===id); return me().gdp/12 * t.w*(S.taxes[id]||0)/100 * taxCompliance(); }
