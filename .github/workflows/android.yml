name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle world map
        run: npm run map

      - name: Bundle flags
        run: npm run flags

      - name: Bundle three.js
        run: npm run three

      - name: Create Android project
        run: npx cap add android

      - name: Icons and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0A1120' --iconBackgroundColorDark '#0A1120' --splashBackgroundColor '#0A1120' --splashBackgroundColorDark '#0A1120'

      - name: Landscape only
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml

      - name: Highest screen refresh rate
        run: |
          cat > android/app/src/main/java/com/askarhan/kabinet/MainActivity.java <<'JAVA'
          package com.askarhan.kabinet;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.Display;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                Display d = getWindowManager().getDefaultDisplay();
                Display.Mode cur = d.getMode(), best = cur;
                for (Display.Mode m : d.getSupportedModes())
                  if (m.getPhysicalWidth() == cur.getPhysicalWidth() && m.getPhysicalHeight() == cur.getPhysicalHeight() && m.getRefreshRate() > best.getRefreshRate()) best = m;
                WindowManager.LayoutParams a = getWindow().getAttributes();
                a.preferredDisplayModeId = best.getModeId();
                getWindow().setAttributes(a);
              }
            }
          }
          JAVA

      - name: Sync web code
        run: npx cap sync android

      - name: Same signature and a growing version for every build
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}"
              }
              signingConfigs {
                  debug {
                      storeFile file("../../tools/signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Show APK signature and version
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256" || true
          "$BT/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -1 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kabinet-prezidenta-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the apk branch
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/kabinet-prezidenta-debug.apk
          cd out
          git init -q
          git checkout -q -b apk
          git add .
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "APK build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
